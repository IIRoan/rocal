name: Mobile internal build

on:
  pull_request:
    branches: [master, main, testing]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/native-calendar/**"
      - "apps/native-mail/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"
      - "scripts/native-*.ts"
      - "scripts/eas-build-profile.ts"
      - "scripts/eas-build-log.sed"
      - ".github/workflows/native-checks.yml"
      - ".github/workflows/mobile-internal-build.yml"
  push:
    branches: [master, main, testing]
    paths:
      - "apps/native-calendar/**"
      - "apps/native-mail/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"
      - "scripts/native-*.ts"
      - "scripts/eas-build-profile.ts"
      - "scripts/eas-build-log.sed"
      - ".github/workflows/native-checks.yml"
      - ".github/workflows/mobile-internal-build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile to publish as the latest slot
        type: choice
        options:
          - development
          - preview
          - testing
        default: development

# One group per PR, so a PR that skips its build never cancels another PR's; pushes and dispatches group per profile (one R2 slot each, newest run wins).
concurrency:
  group: mobile-internal-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref_name == 'testing' && 'testing' || github.event_name == 'push' && 'preview' || inputs.profile || 'development' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta:
    # Fork PRs have no access to EXPO_TOKEN / R2 secrets.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch || github.ref_name == 'testing')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      profile: ${{ steps.meta.outputs.profile }}
      title_suffix: ${{ steps.meta.outputs.title_suffix }}
      matrix: ${{ steps.meta.outputs.matrix }}
      eas_version: ${{ steps.meta.outputs.eas_version }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          # A PR's merge commit has the base branch tip as its first parent.
          fetch-depth: 2
      - uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0
        with:
          bun-version-file: .bun-version
      # Compare with the last successful run (it built, or matched the build before it), so a cancelled or failed build is retried; dispatches always build.
      - name: Check out the last built commit
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          base=$(gh run list --workflow mobile-internal-build.yml --event "$EVENT" --branch "$BRANCH" --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          if [ -z "$base" ] && [ "$EVENT" = pull_request ]; then base=$(git rev-parse HEAD^1); fi
          if [ -n "$base" ] && git fetch --depth=1 origin "$base" && git worktree add --detach "$RUNNER_TEMP/base" "$base" && (cd "$RUNNER_TEMP/base" && bun install --frozen-lockfile); then
            bun install --frozen-lockfile
            echo "NATIVE_BASE_ROOT=$RUNNER_TEMP/base" >> "$GITHUB_ENV"
          else
            echo "::notice::No earlier build to compare with; building every app"
          fi
      - name: Resolve profile metadata
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: bun ./scripts/native-release-metadata.ts

  checks:
    needs: meta
    # Skipping checks skips every build job after it; JS-only changes ship through expo-update.yml.
    if: needs.meta.outputs.build == 'true'
    uses: ./.github/workflows/native-checks.yml

  ios:
    needs: [meta, checks]
    # Dependabot PRs build native E2E apps instead of credentialed internal releases.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    env:
      PROFILE: ${{ needs.meta.outputs.profile }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v6
        with:
          node-version-file: .node-version

      - uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: chainguard-actions/expo-expo-github-action@f202d68400237adfeabf5142b03e4b5aea4e70f8 # 8.2.1
        with:
          eas-version: ${{ needs.meta.outputs.eas_version }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build .ipa
        working-directory: ${{ matrix.dir }}
        env:
          APP_VARIANT: ${{ matrix.app_variant }}
        run: |
          set -o pipefail
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/solace.ipa" 2>&1 | sed -E -f "$GITHUB_WORKSPACE/scripts/eas-build-log.sed"

      # PlistBuddy is macOS-only, so the bundle metadata travels with the .ipa to the publish job.
      - name: Read iOS bundle metadata
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/ios-artifact"
          mkdir -p "$ARTIFACT_DIR"
          mv "$RUNNER_TEMP/solace.ipa" "$ARTIFACT_DIR/solace.ipa"

          EXTRACT_DIR="$RUNNER_TEMP/ipa-extract"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q -o "$ARTIFACT_DIR/solace.ipa" -d "$EXTRACT_DIR" 'Payload/*.app/Info.plist'
          INFO_PLIST=$(echo "$EXTRACT_DIR"/Payload/*.app/Info.plist)
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")
          test -n "$BUNDLE_VERSION"
          IOS_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          test -n "$IOS_BUNDLE_ID"
          jq -n --arg bundleId "$IOS_BUNDLE_ID" --arg bundleVersion "$BUNDLE_VERSION" '{ bundleId: $bundleId, bundleVersion: $bundleVersion }' > "$ARTIFACT_DIR/ios-meta.json"

      - uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: ${{ matrix.app }}-ios
          path: ${{ runner.temp }}/ios-artifact
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  android:
    needs: [meta, checks]
    # Dependabot PRs build native E2E apps instead of credentialed internal releases.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    env:
      PROFILE: ${{ needs.meta.outputs.profile }}
      # Hosted runners OOM with Gradle's default heap on RN 0.86 builds.
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" -Dorg.gradle.parallel=true -Dorg.gradle.daemon=false
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      # The runner starts with about 19 GB free, which RN 0.86's native Android build now outgrows; these toolchains are unused here.
      - name: Free Android build storage
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v6
        with:
          node-version-file: .node-version

      - uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: chainguard-actions/actions-setup-java@85062aee0f74838a204ba15f5ffcf69e60651582 # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: chainguard-actions/expo-expo-github-action@f202d68400237adfeabf5142b03e4b5aea4e70f8 # 8.2.1
        with:
          eas-version: ${{ needs.meta.outputs.eas_version }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build .apk
        working-directory: ${{ matrix.dir }}
        env:
          APP_VARIANT: ${{ matrix.app_variant }}
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local-build
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/solace.apk"

      - uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: ${{ matrix.app }}-android
          path: ${{ runner.temp }}/solace.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: [meta, ios, android]
    # Publish every leg that built, even when a leg of either platform failed; a failed leg leaves no artifact.
    if: ${{ !cancelled() && needs.meta.result == 'success' && (needs.ios.result != 'skipped' || needs.android.result != 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    env:
      PROFILE: ${{ needs.meta.outputs.profile }}
      TITLE: ${{ matrix.name }} ${{ needs.meta.outputs.title_suffix }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v6
        with:
          node-version-file: .node-version

      - uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install qrencode
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qrencode

      # A failed matrix leg leaves no artifact for its app; a fully successful platform must have one.
      - name: Download iOS build
        id: ios-build
        if: needs.ios.result != 'skipped'
        continue-on-error: ${{ needs.ios.result != 'success' }}
        uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          name: ${{ matrix.app }}-ios
          path: ${{ runner.temp }}/ios-artifact

      - name: Publish iOS artifact to R2
        if: steps.ios-build.outcome == 'success'
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/ios-artifact"
          bun "${{ matrix.dir }}/scripts/internal-release/publish-ios.ts" \
            --profile "$PROFILE" \
            --ipa "$ARTIFACT_DIR/solace.ipa" \
            --bundle-id "$(jq -r .bundleId "$ARTIFACT_DIR/ios-meta.json")" \
            --bundle-version "$(jq -r .bundleVersion "$ARTIFACT_DIR/ios-meta.json")" \
            --title "$TITLE" \
            --out-dir "$RUNNER_TEMP/r2-publish"

      - name: Download Android build
        id: android-build
        if: needs.android.result != 'skipped'
        continue-on-error: ${{ needs.android.result != 'success' }}
        uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          name: ${{ matrix.app }}-android
          path: ${{ runner.temp }}/android-artifact

      - name: Publish Android artifact to R2
        if: steps.android-build.outcome == 'success'
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          bun "${{ matrix.dir }}/scripts/internal-release/publish-android.ts" \
            --profile "$PROFILE" \
            --apk "$RUNNER_TEMP/android-artifact/solace.apk" \
            --out-dir "$RUNNER_TEMP/r2-publish"

      - name: Build combined install page + QR
        if: steps.ios-build.outcome == 'success' || steps.android-build.outcome == 'success'
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          bun "${{ matrix.dir }}/scripts/internal-release/publish-page.ts" \
            --profile "$PROFILE" \
            --title "$TITLE" \
            --out-dir "$RUNNER_TEMP/r2-publish"

          {
            echo "### ${TITLE} internal build"
            echo
            echo "iOS → \`solace/releases/${{ matrix.app }}/${PROFILE}.ipa\`, Android → \`solace/releases/${{ matrix.app }}/${PROFILE}.apk\`."
            echo "Combined install QR (iOS + Android) sent to Discord."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send install QR to Discord
        if: steps.ios-build.outcome == 'success' || steps.android-build.outcome == 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          QR_PATH="$RUNNER_TEMP/r2-publish/${PROFILE}-qr.png"
          test -f "$QR_PATH"
          PAGE_URL=$(jq -r '.pageUrl // empty' "$RUNNER_TEMP/r2-publish/publish-page.json")

          REF_LINE="$GITHUB_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REF_LINE="PR #${PR_NUMBER} · $GITHUB_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            REF_LINE="${REF_NAME} · $GITHUB_SHA"
          fi

          bun "${{ matrix.dir }}/scripts/internal-release/notify-discord.ts" \
            --qr "$QR_PATH" \
            --profile "$PROFILE" \
            --title "$TITLE" \
            --url "$PAGE_URL" \
            --ref "$REF_LINE"
