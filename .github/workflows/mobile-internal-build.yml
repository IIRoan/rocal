name: Mobile internal build

on:
  pull_request:
    branches: [master, main, testing]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/native-calendar/**"
      - "apps/native-mail/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"
      - "scripts/native-*.ts"
      - "scripts/eas-build-profile.ts"
      - ".github/workflows/native-checks.yml"
      - ".github/workflows/mobile-internal-build.yml"
  push:
    branches: [master, main, testing]
    paths:
      - "apps/native-calendar/**"
      - "apps/native-mail/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"
      - "scripts/native-*.ts"
      - "scripts/eas-build-profile.ts"
      - ".github/workflows/native-checks.yml"
      - ".github/workflows/mobile-internal-build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile to publish as the latest slot
        type: choice
        options:
          - development
          - preview
          - testing
        default: development

# One group per profile (each publishes to one R2 slot, newest run wins); fork PRs, which the meta guard skips, get their own group so they can't cancel a real build.
concurrency:
  group: mobile-internal-${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && format('fork-{0}', github.run_id) || github.event_name == 'push' && github.ref_name == 'testing' && 'testing' || github.event_name == 'push' && 'preview' || inputs.profile || 'development' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta:
    # Fork PRs have no access to EXPO_TOKEN / R2 secrets.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch || github.ref_name == 'testing')
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.meta.outputs.profile }}
      title_suffix: ${{ steps.meta.outputs.title_suffix }}
      matrix: ${{ steps.meta.outputs.matrix }}
      eas_version: ${{ steps.meta.outputs.eas_version }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      - uses: chainguard-actions/oven-sh-setup-bun@6305b286b0b7ddfec25140687ddaf1b0c63dbe08 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Resolve profile metadata
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: bun ./scripts/native-release-metadata.ts

  checks:
    needs: meta
    uses: ./.github/workflows/native-checks.yml

  ios:
    needs: [meta, checks]
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ needs.meta.outputs.profile }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@4146bcb90c0bb84fc82acd734b2f9f1d95d9545b # v6
        with:
          node-version-file: .node-version

      - uses: chainguard-actions/oven-sh-setup-bun@6305b286b0b7ddfec25140687ddaf1b0c63dbe08 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: chainguard-actions/expo-expo-github-action@a115edabe4756116bf41b0298fe2cd1518329995 # 8.2.1
        with:
          eas-version: ${{ needs.meta.outputs.eas_version }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build .ipa
        working-directory: ${{ matrix.dir }}
        env:
          APP_VARIANT: ${{ matrix.app_variant }}
        run: |
          set -o pipefail
          # Strip device UDIDs, team ids and certificate serials from the public build log.
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/solace.ipa" 2>&1 | sed -E \
              -e 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{16}/[redacted udid]/g' \
              -e 's/\b[0-9A-Fa-f]{40}\b/[redacted udid]/g' \
              -e 's/(Apple Team( ID)?[[:space:]]*[:=]?[[:space:]]*)[^[:space:])]+/\1[redacted]/g' \
              -e 's/^([[:space:]]*(Serial Number|Developer Portal ID)[[:space:]]+).*/\1[redacted]/' \
              -e 's/^([[:space:]]*-[[:space:]]+).*\(UDID:.*/\1[redacted device]/' \
              -e 's/^([[:space:]]*Provisioned devices[[:space:]]+).*/\1[redacted]/'

      - name: Publish iOS artifact to R2
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
          TITLE: ${{ matrix.name }} ${{ needs.meta.outputs.title_suffix }}
        run: |
          set -euo pipefail
          IPA_PATH="$RUNNER_TEMP/solace.ipa"

          EXTRACT_DIR="$RUNNER_TEMP/ipa-extract"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q -o "$IPA_PATH" -d "$EXTRACT_DIR" 'Payload/*.app/Info.plist'
          INFO_PLIST=$(echo "$EXTRACT_DIR"/Payload/*.app/Info.plist)
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")
          test -n "$BUNDLE_VERSION"
          IOS_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          test -n "$IOS_BUNDLE_ID"

          bun "${{ matrix.dir }}/scripts/internal-release/publish-ios.ts" \
            --profile "$PROFILE" \
            --ipa "$IPA_PATH" \
            --bundle-id "$IOS_BUNDLE_ID" \
            --bundle-version "$BUNDLE_VERSION" \
            --title "$TITLE" \
            --out-dir "$RUNNER_TEMP/r2-publish"

  android:
    needs: [meta, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ needs.meta.outputs.profile }}
      # Hosted runners OOM with Gradle's default heap on RN 0.86 builds.
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" -Dorg.gradle.parallel=true -Dorg.gradle.daemon=false
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Check Android build storage
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@4146bcb90c0bb84fc82acd734b2f9f1d95d9545b # v6
        with:
          node-version-file: .node-version

      - uses: chainguard-actions/oven-sh-setup-bun@6305b286b0b7ddfec25140687ddaf1b0c63dbe08 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: chainguard-actions/actions-setup-java@4abbff4c3bfc93084ea2ff1796c8b4e0c255e47d # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: chainguard-actions/expo-expo-github-action@a115edabe4756116bf41b0298fe2cd1518329995 # 8.2.1
        with:
          eas-version: ${{ needs.meta.outputs.eas_version }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build .apk
        working-directory: ${{ matrix.dir }}
        env:
          APP_VARIANT: ${{ matrix.app_variant }}
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local-build
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/solace.apk"

      - name: Publish Android artifact to R2
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          bun "${{ matrix.dir }}/scripts/internal-release/publish-android.ts" \
            --profile "$PROFILE" \
            --apk "$RUNNER_TEMP/solace.apk" \
            --out-dir "$RUNNER_TEMP/r2-publish"

  publish:
    needs: [meta, ios, android]
    # Publish whichever platform built; the page script skips missing artifacts.
    if: always() && needs.meta.result == 'success' && (needs.ios.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    env:
      PROFILE: ${{ needs.meta.outputs.profile }}
      TITLE: ${{ matrix.name }} ${{ needs.meta.outputs.title_suffix }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@4146bcb90c0bb84fc82acd734b2f9f1d95d9545b # v6
        with:
          node-version-file: .node-version

      - uses: chainguard-actions/oven-sh-setup-bun@6305b286b0b7ddfec25140687ddaf1b0c63dbe08 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install qrencode
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qrencode

      - name: Build combined install page + QR
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          bun "${{ matrix.dir }}/scripts/internal-release/publish-page.ts" \
            --profile "$PROFILE" \
            --title "$TITLE" \
            --out-dir "$RUNNER_TEMP/r2-publish"

          {
            echo "### ${TITLE} internal build"
            echo
            echo "iOS → \`solace/releases/${{ matrix.app }}/${PROFILE}.ipa\`, Android → \`solace/releases/${{ matrix.app }}/${PROFILE}.apk\`."
            echo "Combined install QR (iOS + Android) sent to Discord."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send install QR to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          QR_PATH="$RUNNER_TEMP/r2-publish/${PROFILE}-qr.png"
          test -f "$QR_PATH"
          PAGE_URL=$(jq -r '.pageUrl // empty' "$RUNNER_TEMP/r2-publish/publish-page.json")

          REF_LINE="$GITHUB_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REF_LINE="PR #${PR_NUMBER} · $GITHUB_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            REF_LINE="${REF_NAME} · $GITHUB_SHA"
          fi

          bun "${{ matrix.dir }}/scripts/internal-release/notify-discord.ts" \
            --qr "$QR_PATH" \
            --profile "$PROFILE" \
            --title "$TITLE" \
            --url "$PAGE_URL" \
            --ref "$REF_LINE"
