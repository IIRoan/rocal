name: App Store screenshots

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to capture (each run signs in to the App Review account and changes what it sees)
        type: choice
        options: [calendar, mail, all]
        default: calendar

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.app == 'all' && '["calendar","mail"]' || format('["{0}"]', inputs.app)) }}
    defaults:
      run:
        working-directory: apps/native-${{ matrix.app }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      # Flow-only changes reuse the last simulator build; the key covers everything that goes into the app.
      - id: app
        uses: chainguard-actions/actions-cache/restore@46c2783c2418d3de33490be27a0d86c6268bc4fd # v6.1.0
        with:
          path: ${{ runner.temp }}/build/Build/Products/Release-iphonesimulator
          key: ${{ matrix.app }}-simulator-app-v2-${{ hashFiles('bun.lock', 'patches/**', 'packages/*/package.json', 'packages/*/*.json', 'packages/*/*.cjs', 'packages/*/src/**', 'packages/native-core/plugins/**', format('apps/native-{0}/app/**', matrix.app), format('apps/native-{0}/src/**', matrix.app), format('apps/native-{0}/assets/**', matrix.app), format('apps/native-{0}/*.json', matrix.app), format('apps/native-{0}/*.ts', matrix.app), format('apps/native-{0}/*.js', matrix.app), format('apps/native-{0}/*.cts', matrix.app)) }}
      - uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v6
        with:
          node-version-file: .node-version
      - uses: chainguard-actions/oven-sh-setup-bun@6305b286b0b7ddfec25140687ddaf1b0c63dbe08 # v2.2.0
        with:
          bun-version-file: .bun-version
      - if: steps.app.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
        working-directory: .
      - id: eas
        if: steps.app.outputs.cache-hit != 'true'
        run: echo "version=$(node -p "require('../../packages/native-core/expo-apps.json').easCliVersion")" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.cache-hit != 'true'
        uses: chainguard-actions/expo-expo-github-action@a115edabe4756116bf41b0298fe2cd1518329995 # 8.2.1
        with:
          eas-version: ${{ steps.eas.outputs.version }}
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build the production app for the iOS Simulator
        if: steps.app.outputs.cache-hit != 'true'
        env:
          APP_VARIANT: production
          SOLACE_ENV_SOURCE: eas
        run: |
          set -euo pipefail
          # Production EAS values, so the simulator app talks to the same services as the store build.
          # Ad-hoc signing keeps the App Group entitlement, which the keychain needs; an unsigned build can't sign in.
          eas env:exec production '
            set -euo pipefail
            node ../../packages/native-core/expo-config.cjs --check-environment
            npx expo prebuild --platform ios --clean
            workspace=$(ls -d ios/*.xcworkspace | head -1)
            xcodebuild -workspace "$workspace" -scheme "$(basename "$workspace" .xcworkspace)" \
              -configuration Release -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= -quiet
          ' --non-interactive
      - if: steps.app.outputs.cache-hit != 'true'
        uses: chainguard-actions/actions-cache/save@46c2783c2418d3de33490be27a0d86c6268bc4fd # v6.1.0
        with:
          path: ${{ runner.temp }}/build/Build/Products/Release-iphonesimulator
          key: ${{ steps.app.outputs.cache-primary-key }}
      - name: Boot a 6.9-inch iPhone with a clean status bar
        id: sim
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=[x for r in json.load(sys.stdin)["devices"].values() for x in r]; m=[x for n in ("iPhone 17 Pro Max","iPhone 16 Pro Max") for x in d if x["name"]==n]; print(m[0]["udid"])')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$device" "$(ls -d "$RUNNER_TEMP"/build/Build/Products/Release-iphonesimulator/*.app | head -1)"
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Install Maestro
        env:
          MAESTRO_VERSION: cli-2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Capture screenshots
        env:
          EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          PASSWORD: ${{ secrets.APP_REVIEW_PASSWORD }}
          DEVICE: ${{ steps.sim.outputs.device }}
          MAESTRO_CLI_NO_ANALYTICS: "1"
          # The XCTest driver can take minutes to start on a freshly booted CI simulator.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
        run: |
          set -uo pipefail
          capture() {
            for attempt in 1 2 3; do
              maestro --device "$DEVICE" test --env EMAIL="$EMAIL" --env PASSWORD="$PASSWORD" --test-output-dir "$RUNNER_TEMP/maestro-output/$1-$attempt" "$GITHUB_WORKSPACE/apps/native-${{ matrix.app }}/.maestro/app-store-screenshots.yaml" && return 0
            done
            return 1
          }
          status=0
          for appearance in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$appearance"
            capture "$appearance" || status=1
          done
          exit "$status"
      - if: always()
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: ${{ matrix.app }}-app-store-screenshots
          # Maestro's logs record every typed character, App Review password included, and artifacts here are public.
          path: ${{ runner.temp }}/maestro-output/**/*.png
          if-no-files-found: warn
          retention-days: 7
