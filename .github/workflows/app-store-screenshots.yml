name: App Store screenshots

on:
  workflow_dispatch:
  push:
    branches: [chore/app-store-screenshots]
    paths:
      - .github/workflows/app-store-screenshots.yml
      - apps/native-mail/.maestro/**

permissions:
  contents: read

jobs:
  mail:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/native-mail
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      - uses: chainguard-actions/actions-setup-node@4146bcb90c0bb84fc82acd734b2f9f1d95d9545b # v6
        with:
          node-version-file: .node-version
      - uses: chainguard-actions/oven-sh-setup-bun@6305b286b0b7ddfec25140687ddaf1b0c63dbe08 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - id: eas
        run: echo "version=$(node -p "require('../../packages/native-core/expo-apps.json').easCliVersion")" >> "$GITHUB_OUTPUT"
      - uses: chainguard-actions/expo-expo-github-action@a115edabe4756116bf41b0298fe2cd1518329995 # 8.2.1
        with:
          eas-version: ${{ steps.eas.outputs.version }}
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build the production app for the iOS Simulator
        env:
          APP_VARIANT: production
          SOLACE_ENV_SOURCE: eas
        run: |
          set -euo pipefail
          # Production EAS values, so the simulator app talks to the same services as the store build.
          eas env:exec production '
            set -euo pipefail
            node ../../packages/native-core/expo-config.cjs --check-environment
            npx expo prebuild --platform ios --clean
            workspace=$(ls -d ios/*.xcworkspace | head -1)
            xcodebuild -workspace "$workspace" -scheme "$(basename "$workspace" .xcworkspace)" \
              -configuration Release -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO -quiet
          ' --non-interactive
      - name: Boot a 6.9-inch iPhone with a clean status bar
        id: sim
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=[x for r in json.load(sys.stdin)["devices"].values() for x in r]; m=[x for n in ("iPhone 17 Pro Max","iPhone 16 Pro Max") for x in d if x["name"]==n]; print(m[0]["udid"])')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$device" "$(ls -d "$RUNNER_TEMP"/build/Build/Products/Release-iphonesimulator/*.app | head -1)"
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Install Maestro
        env:
          MAESTRO_VERSION: cli-2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Capture screenshots
        env:
          EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          PASSWORD: ${{ secrets.APP_REVIEW_PASSWORD }}
          DEVICE: ${{ steps.sim.outputs.device }}
          MAESTRO_CLI_NO_ANALYTICS: "1"
          # The XCTest driver can take minutes to start on a freshly booted CI simulator.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/screenshots"
          cd "$RUNNER_TEMP/screenshots"
          for attempt in 1 2 3; do
            maestro --device "$DEVICE" test --env EMAIL="$EMAIL" --env PASSWORD="$PASSWORD" --test-output-dir "$RUNNER_TEMP/maestro-output/$attempt" "$GITHUB_WORKSPACE/apps/native-mail/.maestro/app-store-screenshots.yaml" && exit 0
          done
          exit 1
      - if: always()
        working-directory: .
        run: for f in "$RUNNER_TEMP"/screenshots/*.png; do [ -e "$f" ] && sips -g pixelWidth -g pixelHeight "$f"; done; true
      - if: always()
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: mail-app-store-screenshots
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/maestro-output
          if-no-files-found: warn
