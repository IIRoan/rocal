name: Sync mail VPS

on:
  push:
    branches: [master, main]
    paths:
      - "apps/stalwart/vps/haproxy.cfg"
      - "apps/stalwart/vps/apply-vps-repo.sh"
      - "apps/stalwart/vps/gatus-monitor.sh"
      - "apps/stalwart/vps/frps.toml"
      - "apps/stalwart/vps/frpc-relay.toml"
      - ".github/workflows/sync-mail-vps.yml"
  workflow_dispatch:
    inputs:
      apply_frp:
        description: 'Also install frps/frpc-relay.toml (default: no)'
        required: false
        type: boolean
        default: false
      diagnose_only:
        description: 'Read-only network diagnostics; skips all deploy and reload steps'
        required: false
        type: boolean
        default: false
      since:
        description: 'Diagnostic window start (UTC ISO 8601)'
        required: false
        type: string
      until:
        description: 'Diagnostic window end (UTC ISO 8601, at most 20 minutes later)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-mail-vps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Apply VPS repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mail-vps
    if: |
      github.repository == 'IIRoan/rocal'
      && github.event.repository.fork == false
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner)
      )
    steps:
      - name: Assert trusted ref
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "IIRoan/rocal"
          test "${GITHUB_REF}" = "refs/heads/master" -o "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_EVENT_NAME}" = "push" -o "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
          fi
          echo "event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} sha=${GITHUB_SHA}"

      - name: Checkout
        uses: chainguard-actions/actions-checkout@77548e6996d4fe6357c1ac4b2e72cba4c9511aa9 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Read-only VPS diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose_only
        env:
          WINDOW_START: ${{ inputs.since }}
          WINDOW_END: ${{ inputs.until }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: python3 -B apps/stalwart/vps/diagnose-network.py

      - name: Stage allowlisted artifacts only
        if: github.event_name != 'workflow_dispatch' || !inputs.diagnose_only
        env:
          APPLY_FRP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_frp || false }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          echo "STAGE=${STAGE}" >>"$GITHUB_ENV"
          allow=(
            apply-vps-repo.sh
            haproxy.cfg
            gatus-monitor.sh
          )
          APPLY_FRP=0
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${APPLY_FRP_INPUT}" == "true" ]]; then
            APPLY_FRP=1
            allow+=(frps.toml frpc-relay.toml)
          fi
          echo "APPLY_FRP=${APPLY_FRP}" >>"$GITHUB_ENV"

          for f in "${allow[@]}"; do
            src="apps/stalwart/vps/${f}"
            if [[ -f "$src" ]]; then
              if [[ -L "$src" ]]; then
                echo "refusing symlink: $src" >&2
                exit 1
              fi
              install -m 644 "$src" "${STAGE}/${f}"
              echo "staged $f"
            elif [[ "$f" == "gatus-monitor.sh" ]]; then
              echo "optional missing: $f"
            else
              echo "required missing: $src" >&2
              exit 1
            fi
          done
          chmod 755 "${STAGE}/apply-vps-repo.sh"
          if [[ -f "${STAGE}/gatus-monitor.sh" ]]; then
            chmod 755 "${STAGE}/gatus-monitor.sh"
          fi

      - name: Deploy allowlisted artifacts
        if: github.event_name != 'workflow_dispatch' || !inputs.diagnose_only
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          ADMIN_ALLOW_IP: ${{ secrets.ADMIN_ALLOW_IP }}
          FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
          FRP_RELAY_STCP_KEY: ${{ secrets.FRP_RELAY_STCP_KEY }}
          FRP_TLS_CA: ${{ secrets.FRP_TLS_CA }}
          FRP_TLS_SERVER_CERT: ${{ secrets.FRP_TLS_SERVER_CERT }}
          FRP_TLS_SERVER_KEY: ${{ secrets.FRP_TLS_SERVER_KEY }}
          FRP_TLS_CLIENT_CERT: ${{ secrets.FRP_TLS_CLIENT_CERT }}
          FRP_TLS_CLIENT_KEY: ${{ secrets.FRP_TLS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_PRIVATE_KEY:?set Environment secret VPS_SSH_PRIVATE_KEY on mail-vps}"
          : "${VPS_SSH_KNOWN_HOSTS:?set Environment secret VPS_SSH_KNOWN_HOSTS on mail-vps (ssh-keyscan output for the VPS)}"
          : "${ADMIN_ALLOW_IP:?set Environment secret ADMIN_ALLOW_IP on mail-vps}"
          if [[ "${APPLY_FRP}" == "1" ]]; then
            : "${FRP_TOKEN:?set Environment secret FRP_TOKEN on mail-vps}"
            : "${FRP_RELAY_STCP_KEY:?set Environment secret FRP_RELAY_STCP_KEY on mail-vps}"
            for secret in FRP_TLS_CA FRP_TLS_SERVER_CERT FRP_TLS_SERVER_KEY FRP_TLS_CLIENT_CERT FRP_TLS_CLIENT_KEY; do
              : "${!secret:?set Environment secret ${secret} on mail-vps (apps/stalwart/scripts/frp-tls-certs.sh)}"
            done
          fi
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            if ! printf '%s' "$line" | grep -Eq '^[0-9a-fA-F.:/]+$'; then
              echo "ADMIN_ALLOW_IP has unexpected characters: $line" >&2
              exit 1
            fi
          done <<<"$ADMIN_ALLOW_IP"

          HOST="${VPS_SSH_HOST:-mail.solace.onl}"
          USER="${VPS_SSH_USER:-Roan}"
          PORT="${VPS_SSH_PORT:-22}"
          echo "Deploy target: ${USER}@${HOST}:${PORT}"

          KEY="$(mktemp)"
          ALLOW="$(mktemp)"
          FRP_SECRETS="$(mktemp)"
          KNOWN_HOSTS="$(mktemp)"
          trap 'rm -f "$KEY" "$ALLOW" "$FRP_SECRETS" "$KNOWN_HOSTS"' EXIT
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" >"$KNOWN_HOSTS"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" >"$KEY"
          printf '%s\n' "$ADMIN_ALLOW_IP" >"$ALLOW"
          printf 'FRP_TOKEN=%s\nFRP_RELAY_STCP_KEY=%s\nFRP_TLS_CA=%s\nFRP_TLS_SERVER_CERT=%s\nFRP_TLS_SERVER_KEY=%s\nFRP_TLS_CLIENT_CERT=%s\nFRP_TLS_CLIENT_KEY=%s\n' \
            "$FRP_TOKEN" "$FRP_RELAY_STCP_KEY" "$FRP_TLS_CA" "$FRP_TLS_SERVER_CERT" "$FRP_TLS_SERVER_KEY" \
            "$FRP_TLS_CLIENT_CERT" "$FRP_TLS_CLIENT_KEY" >"$FRP_SECRETS"
          chmod 600 "$KEY" "$ALLOW" "$FRP_SECRETS"

          # A fresh runner has no known_hosts, so pin the VPS host key instead of trusting the first answer.
          SSH=(ssh -i "$KEY" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes
               -o UserKnownHostsFile="$KNOWN_HOSTS" -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$KEY" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes
               -o UserKnownHostsFile="$KNOWN_HOSTS" -o StrictHostKeyChecking=yes)

          REMOTE_DIR="/tmp/rocal-vps-$$"
          "${SSH[@]}" "${USER}@${HOST}" "rm -rf '$REMOTE_DIR' && mkdir -p '$REMOTE_DIR'"
          "${SCP[@]}" -r "${STAGE}/." "${USER}@${HOST}:${REMOTE_DIR}/"
          "${SCP[@]}" "$ALLOW" "${USER}@${HOST}:/tmp/admin-allow.lst.new"
          if [[ "${APPLY_FRP}" == "1" ]]; then
            "${SCP[@]}" -p "$FRP_SECRETS" "${USER}@${HOST}:${REMOTE_DIR}.frp-secrets"
          fi

          "${SSH[@]}" "${USER}@${HOST}" bash -s <<REMOTE
          set -euo pipefail
          trap 'rm -rf ${REMOTE_DIR} ${REMOTE_DIR}.frp-secrets /tmp/admin-allow.lst.new' EXIT
          chmod +x ${REMOTE_DIR}/apply-vps-repo.sh
          sudo -n env \
            APPLY_ALLOWLIST=/tmp/admin-allow.lst.new \
            APPLY_FRP=${APPLY_FRP:-0} \
            APPLY_FRP_SECRETS=${REMOTE_DIR}.frp-secrets \
            ${REMOTE_DIR}/apply-vps-repo.sh ${REMOTE_DIR}
          echo "mail VPS apply complete"
          REMOTE
