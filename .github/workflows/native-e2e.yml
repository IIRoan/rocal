name: Native end-to-end

on:
  pull_request:
    branches: [master, main, testing]
    paths:
      - "apps/native-*/**"
      - "apps/backend/**"
      - "apps/stalwart/**"
      - "crates/**"
      - "xtask/**"
      - "packages/**"
      - "scripts/e2e/**"
      - "e2e/**"
      - "patches/**"
      - "*.json"
      - "bun.lock"
      - "Cargo.*"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".bun-version"
      - ".node-version"
      - "babel.config.cts"
      - ".github/workflows/native-e2e*.yml"
  push:
    branches: [master, testing]
    paths:
      - "apps/native-*/**"
      - "apps/backend/**"
      - "apps/stalwart/**"
      - "crates/**"
      - "xtask/**"
      - "packages/**"
      - "scripts/e2e/**"
      - "e2e/**"
      - "patches/**"
      - "bun.lock"
      - "Cargo.*"
      - ".cargo/**"
      - "*.json"
      - ".bun-version"
      - ".node-version"
      - "rust-toolchain.toml"
      - "babel.config.cts"
      - ".github/workflows/native-e2e*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build ${{ matrix.app }} (ios)
    strategy:
      fail-fast: false
      matrix:
        app: [calendar, mail]
    uses: ./.github/workflows/native-e2e-build.yml
    with:
      platform: ios
      app: ${{ matrix.app }}

  build-android:
    name: Build ${{ matrix.app }} (android)
    strategy:
      fail-fast: false
      matrix:
        app: [calendar, mail]
    uses: ./.github/workflows/native-e2e-build.yml
    with:
      platform: android
      app: ${{ matrix.app }}

  ios:
    name: iOS
    needs: build-ios
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/native-e2e-journeys.yml
    with:
      platform: ios

  android:
    name: Android
    needs: build-android
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/native-e2e-journeys.yml
    with:
      platform: android
