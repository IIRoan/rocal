name: Sync HAProxy config

# Legacy manual alias for Sync mail VPS. Prefer the primary workflow for automation.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-mail-vps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Deploy haproxy.cfg (legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mail-vps
    if: |
      github.repository == 'IIRoan/rocal'
      && github.event.repository.fork == false
      && github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      && github.actor == github.repository_owner
    steps:
      - name: Assert trusted dispatch
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "IIRoan/rocal"
          test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Stage allowlisted artifacts only
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          echo "STAGE=${STAGE}" >>"$GITHUB_ENV"
          for f in apply-vps-repo.sh haproxy.cfg haproxy-sync-active-slot.sh \
                   stalwart-switch-slot.sh stalwart-slot-manager.py stalwart-slot-watcher.py \
                   gatus-monitor.sh; do
            src="apps/stalwart/vps/${f}"
            if [[ -f "$src" && ! -L "$src" ]]; then
              install -m 644 "$src" "${STAGE}/${f}"
            elif [[ "$f" != "gatus-monitor.sh" ]]; then
              echo "missing $src" >&2
              exit 1
            fi
          done
          chmod 755 "${STAGE}/apply-vps-repo.sh" "${STAGE}/stalwart-switch-slot.sh" \
            "${STAGE}/haproxy-sync-active-slot.sh"
          [[ -f "${STAGE}/gatus-monitor.sh" ]] && chmod 755 "${STAGE}/gatus-monitor.sh"

      - name: Deploy via apply-vps-repo.sh
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          ADMIN_ALLOW_IP: ${{ secrets.ADMIN_ALLOW_IP }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_PRIVATE_KEY:?set Environment secret VPS_SSH_PRIVATE_KEY on mail-vps}"
          : "${ADMIN_ALLOW_IP:?set Environment secret ADMIN_ALLOW_IP on mail-vps}"
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            if ! printf '%s' "$line" | grep -Eq '^[0-9a-fA-F.:/]+$'; then
              echo "ADMIN_ALLOW_IP has unexpected characters: $line" >&2
              exit 1
            fi
          done <<<"$ADMIN_ALLOW_IP"

          HOST="${VPS_SSH_HOST:-mail.solace.onl}"
          USER="${VPS_SSH_USER:-Roan}"
          PORT="${VPS_SSH_PORT:-22}"

          KEY="$(mktemp)"
          ALLOW="$(mktemp)"
          trap 'rm -f "$KEY" "$ALLOW"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" >"$KEY"
          printf '%s\n' "$ADMIN_ALLOW_IP" >"$ALLOW"
          chmod 600 "$KEY" "$ALLOW"

          SSH=(ssh -i "$KEY" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes
               -o PubkeyAcceptedAlgorithms=+ssh-rsa,rsa-sha2-512,rsa-sha2-256
               -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "$KEY" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes
               -o PubkeyAcceptedAlgorithms=+ssh-rsa,rsa-sha2-512,rsa-sha2-256
               -o StrictHostKeyChecking=accept-new)

          REMOTE_DIR="/tmp/rocal-vps-$$"
          "${SSH[@]}" "${USER}@${HOST}" "rm -rf '$REMOTE_DIR' && mkdir -p '$REMOTE_DIR'"
          "${SCP[@]}" -r "${STAGE}/." "${USER}@${HOST}:${REMOTE_DIR}/"
          "${SCP[@]}" "$ALLOW" "${USER}@${HOST}:/tmp/admin-allow.lst.new"

          "${SSH[@]}" "${USER}@${HOST}" bash -s <<REMOTE
          set -euo pipefail
          chmod +x ${REMOTE_DIR}/apply-vps-repo.sh
          sudo -n env APPLY_ALLOWLIST=/tmp/admin-allow.lst.new APPLY_FRP=0 APPLY_SYSTEMD=0 \
            ${REMOTE_DIR}/apply-vps-repo.sh ${REMOTE_DIR}
          rm -rf ${REMOTE_DIR} /tmp/admin-allow.lst.new
          echo "HAProxy + VPS artifacts installed."
          REMOTE
