name: iOS App Store release
run-name: App Store review — ${{ inputs.app }} ${{ inputs.version }} (${{ inputs.build_number }})

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to release
        type: choice
        options: [calendar, mail]
        required: true
      version:
        description: Version prepared in App Store Connect (for example, 1.0.6)
        type: string
        required: true
      build_number:
        description: Exact uploaded build number from the production profile (not the testflight profile)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ios-app-store-release-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a manual release from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      - uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Submit for App Review with automatic release after approval
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bun scripts/app-store-release.ts
