name: Security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  # Installed from the GitHub release with a pinned checksum; setup-trivy's get.trivy.dev download fails on hosted runners.
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: New dependency vulnerabilities
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: chainguard-actions/actions-dependency-review-action@9734438463c5dfd5ea001f1c5735d88042eba9de # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          license-check: false
          show-openssf-scorecard: false

  javascript:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: chainguard-actions/oven-sh-setup-bun@6305b286b0b7ddfec25140687ddaf1b0c63dbe08 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Audit all JavaScript workspaces, including development dependencies
        run: |
          audit_status=0
          bun audit --json > "$RUNNER_TEMP/bun-audit.json" || audit_status=$?
          jq -e --argjson status "$audit_status" '
            type == "object" and
            all(.[]; type == "array" and length > 0 and
              all(.[]; type == "object" and (.severity | type == "string") and (.url | type == "string"))) and
            ($status == 0 or ($status == 1 and length > 0))
          ' "$RUNNER_TEMP/bun-audit.json" > /dev/null
          if [ "$audit_status" -eq 1 ]; then
            printf '::warning::Bun reported dependency advisories; review the job summary and GitHub Dependency alerts.\n'
          fi
          {
            printf '## JavaScript dependency advisories\n\nFull inventory; new vulnerable dependencies are checked by dependency review.\n\n```json\n'
            jq . "$RUNNER_TEMP/bun-audit.json"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  repository:
    name: Rust dependencies and Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Scan Cargo dependencies and Dockerfiles
        run: >-
          trivy fs --scanners vuln,misconfig --include-dev-deps
          --skip-files bun.lock --skip-dirs node_modules,target,.git,webmail
          --format json --output "$RUNNER_TEMP/repository.json" .

      - name: Create code scanning report
        run: trivy convert --format sarif --output "$RUNNER_TEMP/repository.sarif" "$RUNNER_TEMP/repository.json"

      - name: Publish findings
        uses: chainguard-actions/github-codeql-action/upload-sarif@e4969b640f7a67163769dc6d910d19032366881b # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/repository.sarif
          category: /trivy/repository

      - name: Summarize repository findings
        run: trivy convert --format table --scanners vuln,misconfig --table-mode summary "$RUNNER_TEMP/repository.json" >> "$GITHUB_STEP_SUMMARY"

  containers:
    name: Container (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: apps/backend/Dockerfile
          - image: notifications
            context: .
            dockerfile: apps/notifications/Dockerfile
          - image: stalwart
            context: apps/stalwart
            dockerfile: apps/stalwart/Dockerfile
          - image: gatus
            context: apps/gatus
            dockerfile: apps/gatus/Dockerfile

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: chainguard-actions/docker-setup-buildx-action@9744db81e7643f97efc7d98e7ce3d11d197f3093 # v4.4.1

      - name: Build the application image
        uses: chainguard-actions/docker-build-push-action@5b225cb1d6f5196bc2459eaa52642b902bf3750f # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: solace-security:${{ matrix.image }}
          load: true
          pull: true
          cache-from: type=gha,scope=security-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=security-${{ matrix.image }}

      - name: Install Trivy
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Scan the application image
        env:
          IMAGE: solace-security:${{ matrix.image }}
        run: trivy image --image-src docker --scanners vuln --format json --output "$RUNNER_TEMP/runtime.json" "$IMAGE"

      - name: Create code scanning report
        run: trivy convert --format sarif --output "$RUNNER_TEMP/runtime.sarif" "$RUNNER_TEMP/runtime.json"

      - name: Publish application image findings
        uses: chainguard-actions/github-codeql-action/upload-sarif@e4969b640f7a67163769dc6d910d19032366881b # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/runtime.sarif
          category: /trivy/container/${{ matrix.image }}/runtime

      - name: Summarize application vulnerabilities
        run: trivy convert --format table --scanners vuln --table-mode summary "$RUNNER_TEMP/runtime.json" >> "$GITHUB_STEP_SUMMARY"
