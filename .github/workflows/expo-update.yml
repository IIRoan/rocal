name: Expo Update

on:
  push:
    branches:
      - master
      - main
      - testing
    paths:
      - "apps/native/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"
      - ".github/workflows/expo-update.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "apps/native/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"
      - ".github/workflows/expo-update.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-update-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: https://api.solace.onl
  EXPO_PUBLIC_APP_URL: https://solace.onl
  PASSKEY_ORIGIN: https://solace.onl

jobs:
  publish-preview-update:
    name: Publish Preview EAS Update
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Check for EXPO_TOKEN
        working-directory: .
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to the astralgrove Expo account."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Publish update to preview
        env:
          APP_VARIANT: preview
          EAS_UPDATE_MESSAGE: preview-${{ github.ref_name }}-${{ github.sha }}
        run: eas update --branch preview --environment preview --message "$EAS_UPDATE_MESSAGE" --non-interactive

  publish-development-update:
    name: Publish Development EAS Update
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Check for EXPO_TOKEN
        working-directory: .
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to the astralgrove Expo account."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Publish update to development
        env:
          APP_VARIANT: development
          EAS_UPDATE_MESSAGE: development-${{ github.sha }}
        run: eas update --branch development --environment development --message "$EAS_UPDATE_MESSAGE" --non-interactive

  publish-testing-update:
    name: Publish Testing EAS Update
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Check for EXPO_TOKEN
        working-directory: .
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to the astralgrove Expo account."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Publish update to testing
        env:
          APP_VARIANT: preview
          EAS_UPDATE_MESSAGE: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        run: eas update --branch testing --environment preview --message "$EAS_UPDATE_MESSAGE" --non-interactive

  publish-master-update:
    name: Publish Master EAS Update
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Check for EXPO_TOKEN
        working-directory: .
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to the astralgrove Expo account."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Publish update to master
        env:
          APP_VARIANT: production
          EAS_UPDATE_MESSAGE: master-${{ github.sha }}
        run: eas update --branch master --environment production --message "$EAS_UPDATE_MESSAGE" --non-interactive
