name: Expo Update

on:
  push:
    branches:
      - main
    paths:
      - "apps/native/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.js"

permissions:
  contents: read

concurrency:
  group: expo-update-main
  cancel-in-progress: true

jobs:
  publish-update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck native app
        run: bun run typecheck:native

      - name: Publish update to main
        working-directory: apps/native
        run: eas update --branch main --environment production --message "main ${GITHUB_SHA}"
