name: Expo Update

on:
  push:
    branches: [master, main, testing]
    paths:
      - "apps/native-*/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"
      - "scripts/native-*.ts"
      - "scripts/eas-build-profile.ts"
      - ".github/workflows/expo-update.yml"
      - ".github/workflows/native-checks.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/native-*/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"
      - "scripts/native-*.ts"
      - "scripts/eas-build-profile.ts"
      - ".github/workflows/expo-update.yml"
      - ".github/workflows/native-checks.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Matching EAS build/update profile (production requires the default branch)
        type: choice
        options: [development, testing, preview, production]
        default: preview
      app:
        description: App to update
        type: choice
        options: [all, calendar, mail]
        default: all

permissions:
  contents: read

concurrency:
  group: expo-update-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch || github.ref_name == 'testing')
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.release.outputs.profile }}
      matrix: ${{ steps.release.outputs.matrix }}
      eas_version: ${{ steps.release.outputs.eas_version }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_APP: ${{ inputs.app }}
          ALLOW_PRODUCTION: "true"
        run: bun ./scripts/native-release-metadata.ts

  checks:
    needs: meta
    uses: ./.github/workflows/native-checks.yml

  publish:
    name: Publish ${{ needs.meta.outputs.profile }} update
    needs: [meta, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      - uses: chainguard-actions/actions-setup-node@4146bcb90c0bb84fc82acd734b2f9f1d95d9545b # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ needs.meta.outputs.eas_version }}
          token: ${{ secrets.EXPO_TOKEN }}
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Publish to the build profile's channel
        env:
          PROFILE: ${{ needs.meta.outputs.profile }}
          UPDATE_MESSAGE: ${{ needs.meta.outputs.profile }}-${{ github.sha }}
        run: bun run ./scripts/publish-update.ts "$PROFILE" --message "$UPDATE_MESSAGE" --non-interactive
