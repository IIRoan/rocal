name: Expo Update

on:
  push:
    branches:
      - master
    paths:
      - "apps/native/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "apps/native/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "babel.config.cts"

permissions:
  contents: read

concurrency:
  group: expo-update-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-testing-update:
    name: Publish Testing EAS Update
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish update to testing
        working-directory: apps/native
        env:
          EAS_UPDATE_MESSAGE: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        run: eas update --branch testing --environment production --message "$EAS_UPDATE_MESSAGE"

  publish-master-update:
    name: Publish Master EAS Update
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish update to master
        working-directory: apps/native
        env:
          EAS_UPDATE_MESSAGE: master-${{ github.sha }}
        run: eas update --branch master --environment production --message "$EAS_UPDATE_MESSAGE"
