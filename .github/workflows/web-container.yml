name: Web container

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".node-version"
      - ".bun-version"
      - "Dockerfile.vercel*"
      - "scripts/check-web-runtime.ts"
      - "scripts/deploy-web-container.py"
      - "scripts/test_deploy_web_container.py"
      - "vercel.json"
      - ".github/workflows/web-container.yml"
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".node-version"
      - ".bun-version"
      - "Dockerfile.vercel*"
      - "scripts/check-web-runtime.ts"
      - "scripts/deploy-web-container.py"
      - "scripts/test_deploy_web_container.py"
      - "vercel.json"
      - ".github/workflows/web-container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Web container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Check deployment boundaries
        run: python3 scripts/test_deploy_web_container.py

      - name: Build and verify the container
        run: |
          set -euo pipefail
          echo 'CONTAINER_CONTEXT_CANARY=excluded' > apps/web/.env.production
          args=(--file Dockerfile.vercel --build-arg NEXT_PUBLIC_API_URL=https://api.example.test --build-arg NEXT_PUBLIC_APP_URL=https://web.example.test)
          docker build "${args[@]}" --target build --tag solace-web:build .
          docker run --rm --entrypoint node solace-web:build -e 'require("node:assert/strict").equal(require("node:fs").existsSync("/app/apps/web/.env.production"), false)'
          test "$(docker run --rm --entrypoint bun solace-web:build --version)" = "$(cat .bun-version)"
          docker build "${args[@]}" --tag solace-web:test .
          docker run --rm --entrypoint node solace-web:test -e 'require("node:assert/strict").equal(process.versions.node, process.argv[1])' "$(cat .node-version)"
          docker run --rm --entrypoint node solace-web:test -e 'const a=require("node:assert/strict"),z=require("node:zlib");a.equal(z.constants.BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH,-17);a.throws(()=>z.brotliDecompressSync(Buffer.from("200010414141fcffff07002228f00b60f7f41f000000","hex")),{errno:-17})'

      - name: Check page delivery and security headers
        run: |
          set -euo pipefail
          docker run --detach --name solace-web --publish 127.0.0.1:8080:8080 solace-web:test
          curl --retry 40 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://127.0.0.1:8080/login --output /tmp/solace-login.html
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.sources.extend(value for key, value in attrs if key == 'src')
          with urllib.request.urlopen('http://127.0.0.1:8080/login') as response:
              assert response.status == 200
              assert response.headers['X-Content-Type-Options'] == 'nosniff'
              assert 'api.example.test' in response.headers['Content-Security-Policy']
              assert 'max-age=' in response.headers['Strict-Transport-Security']
              scripts = Scripts()
              scripts.feed(response.read().decode())
          assert scripts.sources
          for source in scripts.sources[:3]:
              assert source.startswith('/_next/')
              with urllib.request.urlopen('http://127.0.0.1:8080' + source) as response:
                  assert response.status == 200
                  assert 'javascript' in response.headers['Content-Type']
          PY

      - name: Refuse an unsupported production runtime
        run: |
          set -euo pipefail
          echo 'Object.defineProperty(process.versions, "node", { value: "24.21.0" });' > /tmp/old-runtime.cjs
          set +e
          timeout 30 docker run --name solace-runtime-reject --volume /tmp/old-runtime.cjs:/tmp/old-runtime.cjs:ro --env NODE_OPTIONS=--require=/tmp/old-runtime.cjs solace-web:test > /tmp/old-runtime.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          test "$status" -ne 124
          grep -q 'Unsupported JavaScript runtime' /tmp/old-runtime.log

      - name: Stop test containers
        if: always()
        run: |
          docker logs solace-web 2>/dev/null || true
          docker rm --force solace-web solace-runtime-reject 2>/dev/null || true

  deploy:
    name: Deploy web
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: web-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_AxYhs6cn2KZ6PnbEdZF22RPctb79
      VERCEL_ORG_ID: team_rGOQj2q34Fwz7XzHy4QpZDff
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install deployment CLI
        run: npm install --global vercel@65.2.0
      - name: Build and publish production image
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          image="vcr.vercel.com/astralgrove/solace-web/web:$GITHUB_SHA"
          docker build --file Dockerfile.vercel --build-arg NEXT_PUBLIC_API_URL --build-arg NEXT_PUBLIC_APP_URL --build-arg NEXT_PUBLIC_SENTRY_DSN --tag "$image" .
          docker run --rm --entrypoint node "$image" -e 'require("node:assert/strict").equal(process.versions.node, process.argv[1])' "$(cat .node-version)"
          vercel vcr login docker --project "$VERCEL_PROJECT_ID" --scope astralgrove
          vercel vcr push docker "web:$GITHUB_SHA" --project "$VERCEL_PROJECT_ID" --scope astralgrove
          vercel vcr tag inspect web "$GITHUB_SHA" --project "$VERCEL_PROJECT_ID" --scope astralgrove --json > /tmp/web-image.json
          digest=$(python3 -c 'import json; print(json.load(open("/tmp/web-image.json"))["manifestDigest"])')
          python3 scripts/deploy-web-container.py --image "vcr.vercel.com/astralgrove/solace-web/web@$digest" --apply
      - name: Verify production
        run: |
          curl --retry 10 --retry-all-errors --fail --silent --show-error https://solace.onl/login --output /tmp/web-login.html
      - name: Remove registry credentials
        if: always()
        run: docker logout vcr.vercel.com
