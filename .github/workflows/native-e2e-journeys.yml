name: Run native E2E journeys

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      diagnostic:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  journeys:
    name: ${{ inputs.diagnostic && 'Native E2E diagnostics' || 'Native E2E' }} (${{ inputs.platform }})
    timeout-minutes: 180
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    env:
      SOLACE_E2E: "1"
      E2E_PLATFORM: ${{ inputs.platform }}
      CI: "1"
      CARGO_BUILD_JOBS: "3"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
      DEVELOPER_DIR: ${{ inputs.platform == 'ios' && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      SOLACE_E2E_IOS_RUNTIME: "26.5"
    steps:
      - name: Prepare isolated test directory
        shell: bash
        run: |
          set -euo pipefail
          echo "SOLACE_E2E_DIR=$RUNNER_TEMP/solace-e2e" >> "$GITHUB_ENV"
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      - uses: chainguard-actions/actions-setup-node@4146bcb90c0bb84fc82acd734b2f9f1d95d9545b # v6
        with:
          node-version-file: .node-version
      - uses: chainguard-actions/oven-sh-setup-bun@6305b286b0b7ddfec25140687ddaf1b0c63dbe08 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: chainguard-actions/actions-setup-java@4abbff4c3bfc93084ea2ff1796c8b4e0c255e47d # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - name: Install native test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ "$E2E_PLATFORM" = ios ]; then
            brew install postgresql@18 python@3.13
            echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          else
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
            sudo apt-get update -qq
            sudo apt-get install -y -qq podman libssl-dev pkg-config
            sudo chmod 666 /dev/kvm
          fi
          rustup toolchain install
      - uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          pattern: native-e2e-binary-${{ inputs.platform }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/solace-e2e/private/binary-archives
      - name: Restore both release apps
        shell: bash
        run: python3 scripts/e2e/build.py restore "$E2E_PLATFORM"
      - uses: chainguard-actions/Swatinem-rust-cache@203beff8e447695cdc59f7c4f322178a54ec6be4 # v2.9.3
        with:
          shared-key: native-e2e-${{ runner.os }}
          cache-on-failure: "true"
      - name: Build the guarded test harness
        run: cargo build -p xtask
      - name: Start disposable Postgres, Stalwart and avatar storage
        shell: bash
        run: python3 scripts/e2e/services.py start
      - name: Start the real API and create two fresh test accounts
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/xtask e2e serve > "$SOLACE_E2E_DIR/private/backend.log" 2>&1 &
          echo "$!" > "$SOLACE_E2E_DIR/private/backend.pid"
          python3 scripts/e2e/services.py wait-api
          ./target/debug/xtask e2e seed
      - name: Boot the device and install both apps and Maestro
        timeout-minutes: 20
        shell: bash
        run: python3 scripts/e2e/device.py "$E2E_PLATFORM"
      - name: Exercise Calendar authentication and management
        id: calendar
        if: ${{ !inputs.diagnostic }}
        shell: bash
        run: python3 scripts/e2e/run.py "$E2E_PLATFORM" --calendar-start
      - name: Upload initial Calendar evidence
        if: ${{ !cancelled() && !inputs.diagnostic && (steps.calendar.outcome == 'success' || steps.calendar.outcome == 'failure') }}
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: native-e2e-${{ inputs.platform }}-calendar-start
          path: ${{ runner.temp }}/solace-e2e/artifacts
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Exercise remaining Calendar and Mail journeys
        if: ${{ !cancelled() && !inputs.diagnostic && steps.calendar.outputs.ready == 'true' }}
        shell: bash
        run: python3 scripts/e2e/run.py "$E2E_PLATFORM" --continue
      - name: Exercise focused iOS journeys
        if: ${{ inputs.diagnostic }}
        shell: bash
        run: python3 scripts/e2e/run.py "$E2E_PLATFORM" --diagnostic
      - name: Check persisted encryption and account state
        if: ${{ !inputs.diagnostic }}
        run: ./target/debug/xtask e2e verify
      - name: Publish test evidence
        if: always()
        shell: bash
        run: python3 scripts/e2e/run.py collect
      - name: Upload test evidence
        if: always()
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: native-e2e-${{ inputs.platform }}${{ inputs.diagnostic && '-diagnostics' || '' }}
          path: ${{ runner.temp }}/solace-e2e/artifacts
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Stop disposable services and device
        if: always()
        shell: bash
        run: python3 scripts/e2e/services.py stop
