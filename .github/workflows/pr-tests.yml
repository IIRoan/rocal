name: PR Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate native E2E workflow semantics
        env:
          SOLACE_E2E: "1"
          SOLACE_E2E_DIR: ${{ runner.temp }}/solace-e2e
        run: python3 -B scripts/e2e/check_workflow.py

      - name: Run lint checks
        run: bun run lint

      - name: Run type checks
        run: bun run typecheck && bun run typecheck:native

      - name: Run tests with coverage
        run: bun run scripts/run-tests.ts --coverage --summary="$GITHUB_STEP_SUMMARY"

      - name: Build the web production bundle
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

      - name: Check mail service helpers
        run: |
          python3 -B -m unittest discover -s apps/stalwart/tests -v
          python3 -B apps/stalwart/vps/gatus-monitor_test.py
          python3 -B -m unittest discover -s apps/gatus/tests -v
          python3 -B -m unittest discover -s scripts/e2e -p 'test_*.py' -v
      - name: Check iOS notification extension configuration
        run: node scripts/tests/notification-extension.cjs
      - name: Check iOS native code has no camera or microphone access
        run: node scripts/tests/ios-no-camera.cjs
      - name: Check native version and patch changes trigger new builds
        run: node scripts/tests/native-fingerprint.cjs
      - name: Check EAS uploads skip everything git ignores
        run: node scripts/tests/easignore.cjs
      - name: Check App Store release automation
        run: bun test scripts/tests/app-store-release.test.ts

      - name: Upload UI coverage
        if: always()
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: ui-coverage
          path: packages/ui/coverage

      - name: Upload native coverage
        if: always()
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: native-coverage
          path: |
            packages/native-core/coverage
            apps/native-calendar/coverage
            apps/native-mail/coverage

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache Rust builds
        uses: chainguard-actions/Swatinem-rust-cache@b83da835517599f3f42d100dde7195b7edfb9e30 # v2.9.3

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install sea-orm-cli
        run: cargo install sea-orm-cli@2.0.4 --locked

      - name: Start the test environment
        run: cargo xtask test-env up && cargo xtask test-env template

      - name: Verify PostgreSQL subject search on encrypted drafts
        run: python3 -B apps/stalwart/tests/probe_subject_search.py --assert-fixed

      - name: Verify disposable probe cleanup
        env:
          STALWART_SUBJECT_TEST_IMAGE: localhost/solace-test-stalwart
        run: python3 -B -m unittest discover -s apps/stalwart/tests -p test_subject_search.py -k SubjectProbeCleanupIntegrationTests -v

      - name: Verify JMAP gateway access controls
        run: >-
          podman run --rm --network none
          -e HAPROXY_TEST_BINARY=/usr/sbin/haproxy
          -v "${GITHUB_WORKSPACE}/apps/stalwart:/work:ro"
          --workdir /work --entrypoint python3
          localhost/solace-test-stalwart
          -B -m unittest discover -s tests -p 'test_*gate.py' -v

      # Memory budgets stay local: shared runners' RSS is too noisy for fixed MiB limits.
      - name: Run cargo xtask check
        run: cargo xtask check --skip-mem
