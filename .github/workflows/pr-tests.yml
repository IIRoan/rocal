name: PR Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@4146bcb90c0bb84fc82acd734b2f9f1d95d9545b # v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint checks
        run: bun run lint

      - name: Run type checks
        run: bun run typecheck && bun run typecheck:native

      - name: Run tests with coverage
        run: bun run scripts/run-tests.ts --coverage --summary="$GITHUB_STEP_SUMMARY"

      - name: Check mail service helpers
        run: |
          python3 -B -m unittest discover -s apps/stalwart/tests -v
          python3 -B apps/stalwart/vps/gatus-monitor_test.py
          python3 -B -m unittest discover -s apps/gatus/tests -v
      - name: Check iOS notification extension configuration
        run: node scripts/tests/notification-extension.cjs
      - name: Check iOS native code has no camera or microphone access
        run: node scripts/tests/ios-no-camera.cjs
      - name: Check EAS uploads skip everything git ignores
        run: node scripts/tests/easignore.cjs

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: retired/backend/coverage

      - name: Upload UI coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-coverage
          path: packages/ui/coverage

      - name: Upload native coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-coverage
          path: |
            packages/native-core/coverage
            apps/native-calendar/coverage
            apps/native-mail/coverage

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@4146bcb90c0bb84fc82acd734b2f9f1d95d9545b # v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install sea-orm-cli
        run: cargo install sea-orm-cli@2.0.4 --locked

      - name: Start the test environment
        run: cargo xtask test-env up && cargo xtask test-env template

      - name: Verify JMAP gateway access controls
        run: >-
          podman run --rm --network none
          -e HAPROXY_TEST_BINARY=/usr/sbin/haproxy
          -v "${GITHUB_WORKSPACE}/apps/stalwart:/work:ro"
          --workdir /work --entrypoint python3
          localhost/solace-test-stalwart
          -B -m unittest discover -s tests -p 'test_*gate.py' -v

      # Memory budgets stay local: shared runners' RSS is too noisy for fixed MiB limits.
      - name: Run cargo xtask check
        run: cargo xtask check --skip-mem
