name: PR Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/notifications/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:ci

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage

      - name: Upload UI coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: packages/ui/coverage

      - name: Upload notifications coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-coverage
          path: apps/notifications/coverage.out
