name: PR Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect integration test inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.inputs.outputs.rust }}
      mail_gateway: ${{ steps.inputs.outputs.mail_gateway }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          fetch-depth: 2
      - name: Check the pull request merge diff
        id: inputs
        shell: bash
        run: |
          changed() {
            local status=0
            git diff --quiet HEAD^1 HEAD -- "$@" || status=$?
            case "$status" in
              0) printf 'false\n' ;;
              1) printf 'true\n' ;;
              *) return "$status" ;;
            esac
          }

          rust=$(changed Cargo.toml Cargo.lock .cargo rust-toolchain.toml rustfmt.toml .rustfmt.toml \
            clippy.toml .clippy.toml apps/backend apps/notifications apps/stalwart crates xtask \
            packages/api-contracts package.json bun.lock .bun-version .node-version)
          mail_gateway=$(changed apps/stalwart .zeabur/solace-mail/gateway \
            .zeabur/solace-mail/stalwart-a .zeabur/solace-mail/stalwart-b scripts/check-zeabur.py)
          printf 'rust=%s\nmail_gateway=%s\n' "$rust" "$mail_gateway" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require integration input detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Verify selective Solace releases
        run: python3 -B scripts/test-solace-releases.py

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate native E2E workflow semantics
        env:
          SOLACE_E2E: "1"
          SOLACE_E2E_DIR: ${{ runner.temp }}/solace-e2e
        run: python3 -B scripts/e2e/check_workflow.py

      - name: Run lint checks
        run: bun run lint

      - name: Run type checks
        run: bun run typecheck && bun run typecheck:native

      - name: Run tests with coverage
        run: bun run scripts/run-tests.ts --coverage --summary="$GITHUB_STEP_SUMMARY"

      - name: Build the web production bundle
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

      - name: Validate Solace GitOps manifests
        run: |
          python3 -m venv "$RUNNER_TEMP/solace-python"
          "$RUNNER_TEMP/solace-python/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/solace-python/bin" >> "$GITHUB_PATH"
          archive=flux_2.10.0_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/fluxcd/flux2/releases/download/v2.10.0/$archive"
          echo "208dd7012c04fedeed5b2d0b6e63df3b15b1c34a381527811685c098bc9f8659  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" flux
          "$RUNNER_TEMP/solace-python/bin/python" -B scripts/check-zeabur.py \
            --flux "$RUNNER_TEMP/flux" --gateway-dir "$RUNNER_TEMP/solace-gateway"
          "$RUNNER_TEMP/solace-python/bin/python" -B -m unittest discover -s apps/gatus/tests -v

      - name: Verify the deployed Zeabur mail gateway
        if: needs.changes.outputs.mail_gateway == 'true'
        run: |
          relay="$RUNNER_TEMP/solace-test-relay"
          gateway="$RUNNER_TEMP/solace-gateway"
          mkdir -p "$relay"
          openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=disposable-ci -days 1 \
            -keyout "$relay/client.key" -out "$relay/ca.crt"
          cat "$relay/ca.crt" "$relay/client.key" > "$relay/client.pem"
          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1\n' > "$relay/resolv.conf"
          while IFS= read -r image; do
            printf 'FROM %s\nUSER root\nRUN apk add --no-cache python3\n' "$image" > "$gateway/Dockerfile"
            docker build -t solace-gateway-check "$gateway"
            docker run --rm --network none --add-host solace-api.solace-mail.svc.cluster.local:127.0.0.1 \
              -e HAPROXY_TEST_BINARY=/usr/local/sbin/haproxy -e SOLACE_GATE_CONFIG_DIR=/gateway \
              -v "$GITHUB_WORKSPACE/apps/stalwart:/work:ro" \
              -v "$gateway:/gateway:ro" -v "$relay:/etc/relay-secondary:ro" -v "$relay/resolv.conf:/etc/resolv.conf:ro" \
              --workdir /work --entrypoint python3 solace-gateway-check \
              -B -m unittest discover -s tests -p test_backend_gate.py -v
          done < "$gateway/images"

      - name: Check mail service helpers
        run: |
          python3 -B -m unittest discover -s apps/stalwart/tests -v
          python3 -B -m unittest discover -s scripts/e2e -p 'test_*.py' -v
      - name: Check iOS notification extension configuration
        run: node scripts/tests/notification-extension.cjs
      - name: Check iOS native code has no camera or microphone access
        run: node scripts/tests/ios-no-camera.cjs
      - name: Check native version and patch changes trigger new builds
        run: node scripts/tests/native-fingerprint.cjs
      - name: Check EAS uploads skip everything git ignores
        run: node scripts/tests/easignore.cjs
      - name: Check App Store release automation
        run: bun test scripts/tests/app-store-release.test.ts
      - name: Check security.txt copies match and are not about to expire
        run: bun test scripts/tests/security-txt.test.ts

      - name: Upload UI coverage
        if: always()
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: ui-coverage
          path: packages/ui/coverage

      - name: Upload native coverage
        if: always()
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: native-coverage
          path: |
            packages/native-core/coverage
            apps/native-calendar/coverage
            apps/native-mail/coverage

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache Rust builds
        uses: chainguard-actions/Swatinem-rust-cache@b83da835517599f3f42d100dde7195b7edfb9e30 # v2.9.3

      - name: Setup Node.js
        uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install sea-orm-cli
        run: cargo install sea-orm-cli@2.0.4 --locked

      - name: Start the test environment
        run: cargo xtask test-env up && cargo xtask test-env template

      - name: Verify PostgreSQL subject search on encrypted drafts
        run: python3 -B apps/stalwart/tests/probe_subject_search.py --assert-fixed

      - name: Verify the JMAP vacation responder and send holds
        run: python3 -B apps/stalwart/tests/probe_jmap_send_features.py --assert

      - name: Verify disposable probe cleanup
        env:
          STALWART_SUBJECT_TEST_IMAGE: localhost/solace-test-stalwart
        run: python3 -B -m unittest discover -s apps/stalwart/tests -p test_subject_search.py -k SubjectProbeCleanupIntegrationTests -v

      - name: Verify JMAP gateway access controls
        run: >-
          podman run --rm --network none
          -e HAPROXY_TEST_BINARY=/usr/sbin/haproxy
          -v "${GITHUB_WORKSPACE}/apps/stalwart:/work:ro"
          --workdir /work --entrypoint python3
          localhost/solace-test-stalwart
          -B -m unittest discover -s tests -p 'test_*gate.py' -v

      # Memory budgets stay local: shared runners' RSS is too noisy for fixed MiB limits.
      - name: Run cargo xtask check
        run: cargo xtask check --skip-mem
