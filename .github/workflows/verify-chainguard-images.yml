name: Verify Chainguard images

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - apps/backend/Dockerfile
      - apps/notifications/Dockerfile
      - .github/workflows/verify-chainguard-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-chainguard-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Chainguard image verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@40e53bf063d4f87f0a6e0a83231c09bcfb22bc19 # v6
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: chainguard-actions/sigstore-cosign-installer@b87981cc3b0232e11827d1a8c6bcfa63d6cbd97a # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Verify pinned runtime images and signed metadata
        env:
          CERTIFICATE_IDENTITY: https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          for service in backend notifications; do
            image="$(awk 'toupper($1) == "FROM" { image = $2 } END { print image }' "apps/$service/Dockerfile")"
            [[ "$image" =~ ^cgr\.dev/chainguard/[a-z0-9._-]+(:[a-zA-Z0-9._-]+)?@sha256:[a-f0-9]{64}$ ]]
            repository="${image%@*}"
            image="${repository%%:*}@${image##*@}"
            runtime_digest="$(docker manifest inspect "$image" | jq -er '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
              | if length == 1 then .[0].digest else error("Expected one linux/amd64 manifest") end')"
            [[ "$runtime_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            for reference in "$image" "${image%@*}@$runtime_digest"; do
              output="$RUNNER_TEMP/chainguard-verification/$service/${reference##*@sha256:}"
              mkdir -p "$output"
              printf '%s\n' "$reference" > "$output/image.txt"
              cosign verify "$reference" \
                --certificate-identity "$CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" > "$output/signature.json"
              cosign verify-attestation "$reference" --type https://spdx.dev/Document \
                --certificate-identity "$CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" > "$output/sbom.jsonl"
              cosign verify-attestation "$reference" --type https://slsa.dev/provenance/v1 \
                --certificate-identity "$CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" > "$output/provenance.jsonl"
            done
          done

      - name: Save verified signatures, SBOMs and provenance
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: chainguard-image-verification
          path: ${{ runner.temp }}/chainguard-verification
          retention-days: 30
          if-no-files-found: error
