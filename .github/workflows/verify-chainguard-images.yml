name: Verify Chainguard images

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - apps/backend/Dockerfile
      - apps/notifications/Dockerfile
      - scripts/verify_chainguard_images.py
      - scripts/verify_chainguard_images_test.py
      - .github/workflows/verify-chainguard-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-chainguard-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Chainguard image verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@40e53bf063d4f87f0a6e0a83231c09bcfb22bc19 # v6
        with:
          persist-credentials: false

      - name: Test verification policy
        run: python3 -B -m unittest discover -s scripts -p 'verify_chainguard_images_test.py' -v

      - name: Install Cosign
        uses: chainguard-actions/sigstore-cosign-installer@b87981cc3b0232e11827d1a8c6bcfa63d6cbd97a # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Verify pinned runtime images and signed metadata
        run: python3 -B scripts/verify_chainguard_images.py --output "$RUNNER_TEMP/chainguard-verification"

      - name: Save verified signatures, SBOMs and provenance
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: chainguard-image-verification
          path: ${{ runner.temp }}/chainguard-verification
          retention-days: 30
          if-no-files-found: error
