version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # SDK 58 modules require a coordinated native binary upgrade.
      - dependency-name: expo-network
        versions: [">=58.0.0"]
      - dependency-name: expo-image-manipulator
        versions: [">=58.0.0"]
    groups:
      javascript:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      rust:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
