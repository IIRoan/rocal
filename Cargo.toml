[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
ciborium = "0.2"
hmac = "0.13"
p256 = { version = "0.14", features = ["ecdsa"] }
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query", "form", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
sha2 = "0.11"
solace-api-tests = { path = "crates/solace-api-tests" }
solace-api-types = { path = "crates/solace-api-types" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "signal", "net"] }
url = "2"
utoipa = "6"
