[workspace]
resolver = "3"
members = ["apps/backend", "apps/notifications", "crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# HTTP server and middleware.
axum = { version = "0.8", features = ["macros"] }
# The frame type for hand-written streaming bodies (mail SSE); already in the tree through axum and hyper.
http-body = "1"
tower = { version = "0.5", features = ["util"] }
# One pool for everything, over SQLx; `time` because SeaORM has no jiff support.
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-time", "with-json"] }
# Routes and their OpenAPI entries registered together.
utoipa-axum = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
# Errex speaks the Sentry protocol.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "panic", "reqwest", "rustls"] }
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
# Picked over mimalloc and glibc by `cargo xtask mem-budget` (plan 001, step 4a).
tikv-jemallocator = "0.7"
# Better Auth passwords: scrypt over the NFKC-normalized password.
scrypt = { version = "0.12", default-features = false }
unicode-normalization = "0.1"
# Prisma `cuid()` ids.
cuid = { version = "2", default-features = false, features = ["v1"] }
subtle = "2"
# Passkeys: WebAuthn ceremonies over the stored COSE keys; pinned because its expert API may change in minor versions. Needs OpenSSL.
webauthn-rs-core = "=0.5.5"
# The CBOR crate webauthn-rs-core reads COSE keys with.
serde_cbor_2 = "0.13"
anyhow = "1"
# Local runs of the notifications worker read the shared dev `.env` files.
dotenvy = "0.15"
base64 = "0.22"
ciborium = "0.2"
cookie = "0.18"
hmac = "0.13"
# `localeCompare(…, { sensitivity: "base" })`: ICU4X has the same CLDR root collation as Bun's ICU, and its base crates are already in the tree through `url`.
icu_collator = "2"
p256 = { version = "0.14", features = ["ecdsa"] }
percent-encoding = "2"
# Mailbox key fingerprints: `readKey` from openpgp.js, which `lib/mail-key-utils.ts` used.
pgp = { version = "0.21", default-features = false }
rand = "0.10"
regex-lite = "0.1"
# Decompression matches Bun's fetch, and safe fetch caps bodies after decoding.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query", "form", "stream", "gzip", "deflate", "brotli"] }
# Gzip bodies for the safe-fetch decompression tests (already in the tree through reqwest).
flate2 = "1"
# Profile pictures: decode the uploaded PNG/JPEG/WebP crop and resize it into variants.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Lossy WebP (quality 80, as Bun.Image wrote it); `image` only encodes lossless WebP.
webp = { version = "0.3", default-features = false }
# SigV4-presigned requests to the S3-compatible avatar bucket over the existing reqwest client.
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto"] }
# Time zones (validation, ICS feeds, recurrence, reminders) with the tzdb bundled, so results don't depend on the image's zoneinfo.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "1", features = ["derive"] }
# Objects keep insertion order, so issues name unknown keys in the order clients sent them.
serde_json = { version = "1", features = ["preserve_order"] }
serde_with = { version = "3", default-features = false, features = ["macros"] }
sha2 = "0.11"
solace-api-tests = { path = "crates/solace-api-tests" }
solace-server = { path = "apps/backend" }
solace-api-types = { path = "crates/solace-api-types" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "signal", "net"] }
url = "2"
utoipa = "6"

# Unoptimized scrypt takes seconds per hash, which dominated every suite run; only dependencies are optimized, so our crates still rebuild fast.
[profile.dev.package."*"]
opt-level = 3
