appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- runFlow: ../common/conversation-inbox.yaml
- tapOn: ".*Maestro conversation.*"
- runFlow:
    file: ../common/conversation-body.yaml
    env:
      BODY_TEXT: ".*Maestro peer final note.*"
      OPEN_TIMEOUT_MS: 10000
- assertVisible: ".*Maestro conversation.*\\[3\\].*"
- runFlow: ../common/conversation-cycle.yaml
- runFlow: ../common/conversation-cycle.yaml
- takeScreenshot: ${SCREENSHOT_DIR}/conversation-cached-message-switching
- tapOn: Go back
- waitForAnimationToEnd
- tapOn: ".*Maestro conversation.*"
- runFlow:
    file: ../common/conversation-body.yaml
    env:
      BODY_TEXT: ".*Maestro peer final note.*"
      OPEN_TIMEOUT_MS: 5000
- assertVisible: ".*Maestro conversation.*\\[3\\].*"
- takeScreenshot: ${SCREENSHOT_DIR}/conversation-reopened-without-restart
- tapOn: Go back
