appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- runFlow: ../common/conversation-inbox.yaml
- tapOn: ".*Maestro conversation.*"
- runFlow:
    file: ../common/conversation-body.yaml
    env:
      BODY_TEXT: ".*Maestro peer opening note.*"
      OPEN_TIMEOUT_MS: 10000
- runFlow:
    file: ../common/conversation-reply.yaml
    env:
      REPLY_TEXT: Maestro primary reply
- runFlow: ../common/sign-out.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${PEER_EMAIL}
      PASSWORD: ${PEER_PASSWORD}
- assertNotVisible: ".*Maestro round trip.*"
- runFlow: ../common/conversation-inbox.yaml
- tapOn: ".*Maestro conversation.*"
- runFlow:
    file: ../common/conversation-body.yaml
    env:
      BODY_TEXT: ".*Maestro primary reply.*"
      OPEN_TIMEOUT_MS: 10000
- assertVisible: ".*Maestro conversation.*\\[2\\].*"
- takeScreenshot: ${SCREENSHOT_DIR}/conversation-reply-delivered-to-peer
- runFlow:
    file: ../common/conversation-reply.yaml
    env:
      REPLY_TEXT: Maestro peer final note
- runFlow: ../common/sign-out.yaml
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/conversation-inbox.yaml
- tapOn: ".*Maestro conversation.*"
- runFlow:
    file: ../common/conversation-body.yaml
    env:
      BODY_TEXT: ".*Maestro peer final note.*"
      OPEN_TIMEOUT_MS: 10000
- assertVisible: ".*Maestro conversation.*\\[3\\].*"
- takeScreenshot: ${SCREENSHOT_DIR}/conversation-three-messages
- tapOn: Go back
