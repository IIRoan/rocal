appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- tapOn: Filter messages
- assertVisible: Unread
- runFlow: ../common/close-sheet.yaml
- tapOn: Compose message
- assertVisible: Send
- waitForAnimationToEnd
# The format bar, which holds Attach file, shows while the body is being edited.
- runFlow: ../common/focus-compose-body.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 1
          commands:
            - runFlow:
                when:
                  notVisible: Attach file
                commands:
                  # An unresponsive system sheet must close before another picker can open.
                  - swipe:
                      start: 50%,8%
                      end: 50%,75%
                  - runFlow: ../common/focus-compose-body.yaml
            - tapOn:
                text: Attach file
                enabled: true
                retryTapIfNoChange: false
            - extendedWaitUntil:
                visible:
                  text: Cancel
                  enabled: true
                timeout: 30000
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: Attach file
          enabled: true
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible: "(?i).*(browse|recents|recent|downloads|files).*"
          timeout: 30000
- takeScreenshot: ${SCREENSHOT_DIR}/native-attachment-picker
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Cancel
          enabled: true
          retryTapIfNoChange: false
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible: Send
- runFlow: ../common/close-compose.yaml
- assertVisible: Compose message
