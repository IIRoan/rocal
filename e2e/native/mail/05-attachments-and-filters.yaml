appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- tapOn: Filter messages
- assertVisible: Unread
- runFlow: ../common/close-sheet.yaml
- tapOn: Compose message
- assertVisible: Send
- waitForAnimationToEnd
- tapOn:
    text: Attach file
    enabled: true
    retryTapIfNoChange: false
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: Cancel
            enabled: true
          timeout: 30000
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "(?i).*(browse|recents|recent|downloads|files).*"
          timeout: 30000
- takeScreenshot: ${SCREENSHOT_DIR}/native-attachment-picker
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Cancel
          enabled: true
          retryTapIfNoChange: false
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible: Send
- runFlow: ../common/close-compose.yaml
- assertVisible: Compose message
