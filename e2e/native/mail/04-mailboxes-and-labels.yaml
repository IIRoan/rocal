appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- tapOn: Settings
- runFlow:
    file: ../common/select-settings-page.yaml
    env:
      PAGE: mailboxes
- tapOn: New mailbox name
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro folder
- pressKey: Enter
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: Maestro folder
    timeout: 30000
- scrollUntilVisible:
    element: Rename Maestro folder
    direction: DOWN
- tapOn: Rename Maestro folder
- waitForAnimationToEnd
- eraseText
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro renamed folder
- pressKey: Enter
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: Maestro renamed folder
    timeout: 30000
- tapOn: Hide Maestro renamed folder
- tapOn: Show Maestro renamed folder
- takeScreenshot: ${SCREENSHOT_DIR}/encrypted-custom-mailbox
- tapOn: Back to settings
- runFlow:
    file: ../common/select-settings-page.yaml
    env:
      PAGE: labels
- tapOn: Label name
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro mail label
- hideKeyboard
- tapOn: Create label
- extendedWaitUntil:
    visible: Maestro mail label
    timeout: 30000
- runFlow: ../common/open-app.yaml
- tapOn: Settings
- runFlow:
    file: ../common/select-settings-page.yaml
    env:
      PAGE: labels
- assertVisible: Maestro mail label
- tapOn: Delete Maestro mail label
- assertVisible: "Delete label\\?"
- tapOn: Delete
- extendedWaitUntil:
    notVisible: Maestro mail label
    timeout: 30000
