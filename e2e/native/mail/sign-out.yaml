appId: ${APP_ID}
---
- runFlow: ../common/sign-out.yaml
- assertNotVisible: ".*Maestro round trip.*"
- runFlow: ../common/sign-in.yaml
- tapOn: ".*Switch mailbox"
- tapOn: Inbox
- extendedWaitUntil:
    visible: ".*Maestro round trip.*"
    timeout: 60000
- tapOn: ".*Maestro round trip.*"
- runFlow:
    when:
      visible:
        id: mail-thread-message-0
    commands:
      - tapOn:
          id: mail-thread-message-0
          retryTapIfNoChange: false
- runFlow:
    file: ../common/conversation-body.yaml
    env:
      BODY_TEXT: ".*Maestro body survives encrypted draft storage.*"
      SIGNATURE_LABEL: Signed with your local key
      OPEN_TIMEOUT_MS: 60000
- takeScreenshot: ${SCREENSHOT_DIR}/signed-in-and-unlocked-again
