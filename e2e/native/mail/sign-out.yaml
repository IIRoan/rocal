appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- tapOn: Settings
- runFlow:
    file: ../common/select-settings-page.yaml
    env:
      PAGE: account
- scrollUntilVisible:
    element: Sign Out
    direction: DOWN
- tapOn: Sign Out
- runFlow:
    when:
      visible: "Sign out\\?"
    commands:
      - tapOn: Sign Out
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- assertNotVisible: ".*Maestro round trip.*"
- runFlow: ../common/sign-in.yaml
- tapOn: ".*Switch mailbox"
- tapOn: Inbox
- extendedWaitUntil:
    visible: ".*Maestro round trip.*"
    timeout: 60000
- tapOn: ".*Maestro round trip.*"
- extendedWaitUntil:
    visible: ".*Maestro body survives encrypted draft storage.*"
    timeout: 60000
- takeScreenshot: ${SCREENSHOT_DIR}/signed-in-and-unlocked-again
