appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- tapOn: Create new event
- tapOn: Event title
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro recurring event
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: All day
- tapOn: "Repeat:.*"
- tapOn: "Every week on .*"
- tapOn: Save
- extendedWaitUntil:
    visible: "Maestro recurring event.*"
    timeout: 30000
- tapOn: "Maestro recurring event.*"
- tapOn: Edit
- extendedWaitUntil:
    visible: All occurrences
    timeout: 30000
- tapOn: All occurrences
- tapOn: Event title
- eraseText
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro edited series
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Save
- extendedWaitUntil:
    visible: "Maestro edited series.*"
    timeout: 30000
- runFlow: ../common/open-app.yaml
- tapOn: "Maestro edited series.*"
- tapOn: Delete
- extendedWaitUntil:
    visible: All occurrences
    timeout: 30000
- tapOn: All occurrences
- extendedWaitUntil:
    visible: "Delete event\\?"
    timeout: 30000
- tapOn: Delete
- extendedWaitUntil:
    notVisible: "Maestro edited series.*"
    timeout: 30000
- assertVisible: "Maestro updated event.*"
