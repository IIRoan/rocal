appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- tapOn: Settings
- runFlow:
    file: ../common/select-settings-page.yaml
    env:
      PAGE: account
- scrollUntilVisible:
    element:
      id: account-action-change-profile-picture
    direction: DOWN
- tapOn:
    id: account-action-change-profile-picture
- runFlow:
    when:
      visible: Allow Full Access
    commands:
      - tapOn: Allow Full Access
- extendedWaitUntil:
    visible: "(?i).*(photos|photo library|select.*photo).*"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "(?i)Photo,.*"
          index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "(Photo taken on .*|Media)"
          index: 0
- extendedWaitUntil:
    visible: "(Choose|Done|Crop|Save|Change Profile Picture.*)"
    timeout: 30000
- runFlow:
    when:
      visible: Choose
    commands:
      - tapOn: Choose
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
- runFlow:
    when:
      visible: Crop
    commands:
      - tapOn: Crop
- runFlow:
    when:
      visible: Save
    commands:
      - tapOn: Save
- extendedWaitUntil:
    visible: "Change Profile Picture.*"
    timeout: 60000
- takeScreenshot: ${SCREENSHOT_DIR}/uploaded-private-profile-picture
- tapOn:
    id: account-action-change-profile-picture
- tapOn: Remove Photo
- extendedWaitUntil:
    visible: "Add Profile Picture.*"
    timeout: 30000
