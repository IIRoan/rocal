appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- tapOn: Settings
- runFlow:
    file: ../common/select-settings-page.yaml
    env:
      PAGE: account
- scrollUntilVisible:
    element:
      id: account-action-change-profile-picture
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: account-action-change-profile-picture
    retryTapIfNoChange: false
- runFlow:
    when:
      visible: Allow Full Access
    commands:
      - tapOn: Allow Full Access
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "(?i)Photo,.*"
          timeout: 180000
      - tapOn:
          text: "(?i)Photo,.*"
          index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "(Photo taken on .*|Media)"
          timeout: 30000
      - tapOn:
          text: "(Photo taken on .*|Media)"
          index: 0
- extendedWaitUntil:
    visible: "(Choose|Done|Crop|Save|Change Profile Picture.*)"
    timeout: 30000
- runFlow:
    when:
      visible: Choose
    commands:
      - tapOn: Choose
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
- runFlow:
    when:
      visible: Crop
    commands:
      - tapOn: Crop
- runFlow:
    when:
      visible: Save
    commands:
      - tapOn: Save
- extendedWaitUntil:
    visible:
      id: account-action-change-profile-picture
      text: "Change Profile Picture.*"
      enabled: true
    timeout: 180000
- takeScreenshot: ${SCREENSHOT_DIR}/uploaded-private-profile-picture
- waitForAnimationToEnd
- tapOn:
    id: account-action-change-profile-picture
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: Remove Photo
    timeout: 30000
- tapOn: Remove Photo
- extendedWaitUntil:
    visible: "Add Profile Picture.*"
    timeout: 30000
