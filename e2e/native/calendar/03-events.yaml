appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- tapOn: Create new event
- waitForAnimationToEnd
- assertVisible: Event title
- tapOn: Event title
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro retained event
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: All day
- scrollUntilVisible:
    element: Location
    direction: DOWN
- tapOn: Location
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro meeting room
- pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: event-description
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: event-description
    point: 50%,20%
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro event notes stay encrypted
- tapOn: Save
- extendedWaitUntil:
    notVisible: Event title
    timeout: 30000
- extendedWaitUntil:
    visible: Create new event
    timeout: 30000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Maestro retained event.*"
    timeout: 30000
- tapOn:
    text: "Maestro retained event.*"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Edit
    timeout: 30000
- assertVisible: Export .ics
- assertVisible: Maestro meeting room
- assertVisible: Maestro event notes stay encrypted
- tapOn: Edit
- tapOn: Event title
- eraseText
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro updated event
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Save
- extendedWaitUntil:
    notVisible: Event title
    timeout: 30000
- extendedWaitUntil:
    visible: "Maestro updated event.*"
    timeout: 30000
- takeScreenshot: ${SCREENSHOT_DIR}/event-updated
- runFlow: ../common/open-app.yaml
- extendedWaitUntil:
    visible: "Maestro updated event.*"
    timeout: 30000
- tapOn: "Maestro updated event.*"
- assertVisible: Edit
- tapOn: Export .ics
- extendedWaitUntil:
    visible: ".*(Copy|Save to Files|Sharing|Bluetooth|Quick Share|Nearby Share).*"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: PopoverDismissRegion
          point: 50%,10%
          retryTapIfNoChange: false
      - extendedWaitUntil:
          notVisible: Save to Files
          timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: Edit
    commands:
      - tapOn:
          text: "Maestro updated event.*"
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Edit
    timeout: 30000
- assertVisible: Maestro meeting room
- assertVisible: Maestro event notes stay encrypted
- tapOn: Close
- tapOn: Create new event
- waitForAnimationToEnd
- tapOn: Event title
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro disposable event
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: All day
- tapOn: Save
- extendedWaitUntil:
    visible: "Maestro disposable event.*"
    timeout: 30000
- tapOn: "Maestro disposable event.*"
- tapOn: Delete
- runFlow: ../common/confirm-event-delete.yaml
- extendedWaitUntil:
    notVisible: "Maestro disposable event.*"
    timeout: 30000
- assertVisible: "Maestro updated event.*"
