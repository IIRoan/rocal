appId: ${APP_ID}
---
- runFlow: ../common/open-app.yaml
- tapOn: Create new event
- tapOn: Event title
- runFlow:
    file: ../common/type.yaml
    env:
      TEXT: Maestro timed event
- hideKeyboard
- tapOn: "Start time:.*"
- assertVisible: "Hour.*"
- assertVisible: "Minute.*"
- tapOn: Done
- tapOn: "End time:.*"
- assertVisible: "Hour.*"
- assertVisible: "Minute.*"
- tapOn: Done
- copyTextFrom: "Start time:.*"
- evalScript: ${output.startTime = maestro.copiedText}
- copyTextFrom: "End time:.*"
- evalScript: ${output.endTime = maestro.copiedText}
- assertTrue: ${output.startTime.length > 0 && output.endTime.length > 0}
- tapOn: Save
- extendedWaitUntil:
    notVisible: Event title
    timeout: 30000
- runFlow: ../common/open-app.yaml
- extendedWaitUntil:
    visible: "Maestro timed event.*"
    timeout: 30000
- tapOn: "Maestro timed event.*"
- tapOn: Edit
- copyTextFrom: "Start time:.*"
- assertTrue: ${maestro.copiedText === output.startTime}
- copyTextFrom: "End time:.*"
- assertTrue: ${maestro.copiedText === output.endTime}
- takeScreenshot: ${SCREENSHOT_DIR}/timed-event-restored
- tapOn: Save
- extendedWaitUntil:
    notVisible: Event title
    timeout: 30000
- tapOn: "Maestro timed event.*"
- tapOn: Delete
- tapOn: Delete
- extendedWaitUntil:
    notVisible: "Maestro timed event.*"
    timeout: 30000
- assertVisible: "Maestro updated event.*"
