appId: ${APP_ID}
---
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: settings-page-${PAGE}
    commands:
      - scrollUntilVisible:
          element:
            id: settings-page-${PAGE}
          direction: DOWN
- tapOn:
    id: settings-page-${PAGE}
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Back to settings
    timeout: 30000
- waitForAnimationToEnd
