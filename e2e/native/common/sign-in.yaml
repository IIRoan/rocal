appId: ${APP_ID}
---
- tapOn:
    id: sign-in-email
- runFlow:
    file: type.yaml
    env:
      TEXT: ${EMAIL}
- tapOn:
    id: sign-in-password
- runFlow:
    file: type.yaml
    env:
      TEXT: ${PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible: "(Create new event|Compose message|Not Now)"
    timeout: 180000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Not Now
          optional: true
- extendedWaitUntil:
    visible: ${HOME_LABEL}
    timeout: 180000
