appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: workspace-ready
    timeout: 90000
- runFlow:
    when:
      visible: Go back
    commands:
      - tapOn: Go back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${HOME_LABEL}
    timeout: 30000
- tapOn: Settings
- runFlow:
    file: select-settings-page.yaml
    env:
      PAGE: account
- scrollUntilVisible:
    element:
      id: account-action-sign-out
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: account-action-sign-out
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Sign out\\?"
    timeout: 30000
- tapOn:
    text: Sign Out
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- waitForAnimationToEnd
