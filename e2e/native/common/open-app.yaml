appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: "(Welcome back|Create new event|Compose message)"
    timeout: 120000
- assertNotVisible: Welcome back
- extendedWaitUntil:
    visible: ${HOME_LABEL}
    timeout: 180000
