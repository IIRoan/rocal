appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: "(Welcome back|Create new event|Compose message)"
    timeout: 120000
- assertNotVisible: Welcome back
- extendedWaitUntil:
    visible: ${HOME_LABEL}
    timeout: 180000
- runFlow:
    when:
      true: ${APP_ID === "onl.solace.calendar.e2e"}
    commands:
      - tapOn: Choose date and view
      - scrollUntilVisible:
          element: ${AGENDA_DATE_LABEL}
          direction: RIGHT
          visibilityPercentage: 100
      - tapOn: ${AGENDA_DATE_LABEL}
      - extendedWaitUntil:
          notVisible: Close sheet
          timeout: 30000
      - waitForAnimationToEnd
      - tapOn: Choose date and view
      - assertVisible: Agenda
      - runFlow:
          when:
            visible:
              text: Agenda
              selected: true
          commands:
            - runFlow: close-sheet.yaml
      - runFlow:
          when:
            visible:
              text: Agenda
              selected: false
          commands:
            - tapOn: Agenda
      - extendedWaitUntil:
          notVisible: Agenda
          timeout: 30000
      - waitForAnimationToEnd
