appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: workspace-ready
    timeout: 90000
- assertVisible: ".*Maestro body survives encrypted draft storage.*"
- runFlow:
    file: conversation-reply.yaml
    env:
      REPLY_TEXT: Maestro online recovery reply
      RECIPIENT_EMAIL: ${EMAIL}
- runFlow: go-back.yaml
- tapOn: ".*Switch mailbox"
- tapOn: Inbox
- waitForAnimationToEnd
- swipe:
    start: 50%,30%
    end: 50%,80%
    duration: 500
- extendedWaitUntil:
    visible: ".*Maestro round trip.*"
    timeout: 120000
- tapOn: ".*Maestro round trip.*"
- extendedWaitUntil:
    visible:
      id: mail-message-text
      # The reply must sit above the quote header, not inside it.
      text: "Maestro online recovery reply.*wrote:.*"
    timeout: 60000
- assertVisible: Signed with your local key
- takeScreenshot: ${SCREENSHOT_DIR}/mail-recovered-without-restart
