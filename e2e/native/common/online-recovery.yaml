appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: workspace-ready
    timeout: 90000
- assertVisible: ".*Maestro body survives encrypted draft storage.*"
- runFlow:
    file: conversation-reply.yaml
    env:
      REPLY_TEXT: Maestro online recovery reply
      RECIPIENT_EMAIL: ${EMAIL}
- runFlow: go-back.yaml
- tapOn: ".*Switch mailbox"
- tapOn: Inbox
- waitForAnimationToEnd
- swipe:
    start: 50%,30%
    end: 50%,80%
    duration: 500
- extendedWaitUntil:
    visible: ".*Maestro round trip.*"
    timeout: 120000
- tapOn: ".*Maestro round trip.*"
- runFlow:
    file: conversation-body.yaml
    env:
      BODY_TEXT: Maestro online recovery reply
      SIGNATURE_LABEL: Signed with your local key
      CHECK_QUOTE: "true"
      OPEN_TIMEOUT_MS: 60000
- takeScreenshot: ${SCREENSHOT_DIR}/mail-recovered-without-restart
