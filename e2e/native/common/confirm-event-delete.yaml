appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "Delete event\\?"
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Delete
          rightOf: Cancel
          retryTapIfNoChange: false
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: Delete
          retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible: "Delete event\\?"
    timeout: 30000
