appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: mail-thread-message-0
    direction: UP
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: mail-thread-message-0
    retryTapIfNoChange: false
- runFlow:
    file: conversation-body.yaml
    env:
      BODY_TEXT: ".*Maestro peer opening note.*"
      EXCLUDED_TEXT: ".*Maestro primary reply.*"
      OPEN_TIMEOUT_MS: 5000
- scrollUntilVisible:
    element:
      id: mail-thread-message-1
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: mail-thread-message-1
    retryTapIfNoChange: false
- runFlow:
    file: conversation-body.yaml
    env:
      BODY_TEXT: ".*Maestro primary reply.*"
      EXCLUDED_TEXT: ".*Maestro peer final note.*"
      OPEN_TIMEOUT_MS: 5000
- scrollUntilVisible:
    element:
      id: mail-thread-message-2
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: mail-thread-message-2
    retryTapIfNoChange: false
- runFlow:
    file: conversation-body.yaml
    env:
      BODY_TEXT: ".*Maestro peer final note.*"
      OPEN_TIMEOUT_MS: 5000
