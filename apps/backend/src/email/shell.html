<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light dark; }
    body { background-color: #ffffff !important; }
    @media (prefers-color-scheme: dark) {
      body, .email-page { background-color: #111111 !important; }
      .email-box, .email-divider { border-color: #333333 !important; }
      .email-title, .email-text { color: #eeeeee !important; }
      .email-muted, .email-footer { color: #a3a3a3 !important; }
      .email-link { color: #ffe0c2 !important; }
      .email-btn { background-color: #ffe0c2 !important; color: #202020 !important; }
    }
  </style>
</head>
<body style='margin:0;padding:0;background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased'>
  <div style="display:none;overflow:hidden;line-height:1px;opacity:0;max-height:0;max-width:0">{{PREVIEW}}</div>
  <table class="email-page" role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="background-color:#ffffff">
    <tr>
      <td align="center" style="padding:24px 12px 32px">
        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width:600px">
          <tr>
            <td style="text-align:left">
              {{BODY}}
              {{FOOTER}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
