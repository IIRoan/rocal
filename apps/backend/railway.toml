[build]
builder = "RAILPACK"
buildCommand = "bun run build"
watchPatterns = [
  "apps/backend/**",
  "packages/typescript-config/**",
  "pnpm-lock.yaml"
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "./server"

# Health check
[deploy.healthcheck]
path = "/api/health"
timeout = 10
interval = 30
