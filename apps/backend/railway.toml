[build]
builder = "RAILPACK"
rootDirectory = "."
buildCommand = "bun install && bun --filter backend run build"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "bun --filter backend run start"

# Health check
[deploy.healthcheck]
path = "/api/health"
timeout = 10
interval = 30
