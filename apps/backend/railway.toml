[build]
builder = "RAILPACK"
rootDirectory = "."
buildCommand = "bun install && cd apps/backend && bun run build"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "cd apps/backend && ./server"

# Health check
[deploy.healthcheck]
path = "/api/health"
timeout = 10
interval = 30
