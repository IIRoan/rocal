<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solace status</title>
<meta name="description" content="Live status and 90-day uptime for Solace and Solace Mail.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<script>try { const theme = localStorage.getItem("solace-status-theme"); if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme; } catch {}</script>
<style>
/* Tokens mirror apps/web/app/globals.css; data-theme pins one side of light-dark(). */
:root {
  color-scheme: light dark;
  --bg: light-dark(oklch(0.9821 0 0), oklch(0.1776 0 0));
  --fg: light-dark(oklch(0.2435 0 0), oklch(0.9491 0 0));
  --muted: light-dark(oklch(0.45 0 0), oklch(0.7 0 0));
  --border: light-dark(oklch(0.86 0 0), oklch(0.3 0.0115 91.7467));
  --card: light-dark(oklch(0.9911 0 0), oklch(0.2134 0 0));
  --hover: light-dark(oklch(0.931 0 0), oklch(0.285 0 0));
  --accent: light-dark(oklch(0.4341 0.0392 41.9938), oklch(0.9247 0.0524 66.1732));
  --up: light-dark(oklch(0.49 0.12 150), oklch(0.68 0.15 150));
  --down: light-dark(oklch(0.53 0.1936 33.339), oklch(0.677 0.1936 33.339));
  --partial: light-dark(oklch(0.52 0.14 85), oklch(0.72 0.16 85));
  --outage: light-dark(oklch(0.53 0.1936 33.339 / 0.2), oklch(0.677 0.1936 33.339 / 0.34));
  --none: light-dark(oklch(0.9 0 0), oklch(0.28 0 0));
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, .chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) {
  button { transition: transform 150ms ease-out; }
  button:active:not(:disabled) { transform: scale(0.96); }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { width: 100%; max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }
.top { display: flex; align-items: center; justify-content: space-between; padding-top: 1rem; }
.brand { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 44px; color: var(--fg); font-weight: 600; text-decoration: none; }
.brand img { border-radius: 50%; }
.theme { display: flex; gap: 0.125rem; margin-right: -0.5rem; }
.theme button { display: inline-grid; place-items: center; width: 2.75rem; height: 2.75rem; border: 0; border-radius: 0.5rem; background: transparent; color: var(--muted); }
.theme button:hover { color: var(--fg); }
.theme button[aria-pressed="true"] { background: var(--hover); color: var(--fg); }
main.wrap { flex: 1; }
.summary { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 0.625rem; padding: 1rem 0 1.5rem; border-bottom: 1px solid var(--border); }
.summary h1, .detail-head h1 { margin: 0; font-size: 1.375rem; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
.summary .meta { grid-column: 2; }
.meta { margin: 0.125rem 0 0; color: var(--muted); font-size: 0.8125rem; }
.dot { width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--muted); }
.dot.up { background: var(--up); }
.dot.down { background: var(--down); }
.label { margin: 0 0 0.875rem; color: var(--muted); font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.group, .incidents { padding: 1.5rem 0 0.25rem; border-bottom: 1px solid var(--border); }
.incidents { border-bottom: 0; }
.svc { margin-bottom: 1rem; }
.svc-head { display: flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; margin-top: -0.5rem; color: inherit; text-decoration: none; }
.svc h3 { margin: 0; font-size: 0.875rem; font-weight: 600; white-space: nowrap; }
.svc-head:hover h3 { text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
.svc-head > svg { flex: none; margin-right: -0.25rem; color: var(--muted); }
.svc-head:hover > svg { color: var(--fg); }
.detail { min-width: 0; overflow: hidden; color: var(--muted); font-size: 0.8125rem; text-overflow: ellipsis; white-space: nowrap; }
.state { display: inline-flex; align-items: center; gap: 0.375rem; margin-left: auto; font-size: 0.8125rem; font-weight: 500; white-space: nowrap; }
.state::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: currentColor; }
.state:empty { display: none; }
.state.up { color: var(--up); }
.state.down { color: var(--down); }
.state.unknown { color: var(--muted); }
.bars { display: flex; gap: 2px; height: 1.75rem; }
.bars:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.bars > span { flex: 1; min-width: 1px; border-radius: 2px; background: var(--none); cursor: pointer; }
.bars > .empty { cursor: default; }
.bars > .up { background: var(--up); }
.bars > .partial { background: var(--partial); }
.bars > .down { background: var(--down); }
.bars > span:hover, .bars > .active { opacity: 0.7; }
.bars.dense { gap: 1px; }
.bars.dense > span { border-radius: 1px; }
.bars > .selected { position: relative; z-index: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.scale { display: flex; justify-content: space-between; gap: 0.5rem; margin-top: 0.375rem; color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.scale strong { color: var(--fg); font-weight: 500; }
.incident-list { margin: 0 0 0.75rem; padding: 0; list-style: none; }
.incident-list li { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 0.5rem; padding: 0.625rem 0; border-top: 1px solid var(--border); font-size: 0.8125rem; }
.incident-list li:first-child { border-top: 0; padding-top: 0; }
.incident-list .name { color: var(--fg); font-weight: 600; text-decoration: none; }
.incident-list .name:hover { text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
.incident-list .what { color: var(--muted); }
.incident-list .what.down { color: var(--down); }
.incident-list time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.incident-list .empty { color: var(--muted); }
.incidents > .meta { margin-bottom: 1.5rem; }
.back { display: inline-flex; align-items: center; gap: 0.25rem; min-height: 2.75rem; margin-left: -0.25rem; color: var(--muted); font-size: 0.8125rem; text-decoration: none; }
.back:hover { color: var(--fg); }
.detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.75rem; }
.detail-intro { padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
.uptimes { display: flex; flex-wrap: wrap; gap: 0.125rem 1.25rem; margin: 0.25rem 0 0; font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.uptimes div { display: flex; gap: 0.375rem; }
.uptimes dt { color: var(--muted); }
.uptimes dd { margin: 0; color: var(--fg); font-weight: 600; }
.block { padding: 1.5rem 0; border-bottom: 1px solid var(--border); }
.block:last-child, #d-body > .block:not(:has(~ .block:not([hidden]))) { border-bottom: 0; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 1rem; margin: -0.75rem 0 0.25rem; }
.block-head .label { margin: 0; }
.range { display: flex; gap: 0.125rem; margin-right: -0.5rem; }
.range button { min-height: 2.75rem; padding: 0 0.625rem; border: 0; border-radius: 0.375rem; background: transparent; color: var(--muted); font-size: 0.75rem; font-weight: 500; }
.range button:hover { color: var(--fg); }
.range button[aria-pressed="true"] { background: var(--hover); color: var(--fg); }
.chart { position: relative; height: 11rem; }
.chart[data-zoomable] { cursor: pointer; }
.plot { position: absolute; top: 0.5rem; right: 0; bottom: 1.75rem; left: 3.25rem; }
.plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plot .grid { stroke: var(--hover); stroke-width: 1; vector-effect: non-scaling-stroke; }
.plot .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.plot .area { fill: var(--accent); fill-opacity: 0.1; }
.plot .outage { fill: var(--outage); }
.ytick { position: absolute; left: -3.25rem; width: 2.75rem; color: var(--muted); font-size: 0.6875rem; font-variant-numeric: tabular-nums; text-align: right; transform: translateY(-50%); }
.xticks { position: absolute; right: 0; bottom: 0; left: 3.25rem; display: flex; justify-content: space-between; color: var(--muted); font-size: 0.6875rem; font-variant-numeric: tabular-nums; }
.cross { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); pointer-events: none; }
.mark, .point { position: absolute; width: 0.5rem; height: 0.5rem; margin: -0.25rem 0 0 -0.25rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); pointer-events: none; }
.point.failed { background: var(--down); }
.point.partial { background: var(--partial); }
.chart .empty { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: var(--muted); font-size: 0.8125rem; }
.sub { margin: 0; font-size: 0.8125rem; font-weight: 600; }
.check-title { margin-top: 1.25rem; }
.check-list { margin: 0.5rem 0 0; padding: 0; list-style: none; }
.check-list > li + li { border-top: 1px solid var(--border); }
.check-list summary { display: flex; align-items: center; gap: 0.75rem; min-height: 2.75rem; font-size: 0.8125rem; font-variant-numeric: tabular-nums; list-style: none; cursor: pointer; }
.check-list summary::-webkit-details-marker { display: none; }
.check-list summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.check-list summary > svg:first-child { flex: none; color: var(--up); }
.check-list summary > span { white-space: nowrap; }
.check-list .when { min-width: 8.5rem; }
.check-list .result { font-weight: 600; }
.check-list .speed, .check-list .http { color: var(--muted); }
.check-list .failed summary > svg:first-child, .check-list .failed .result { color: var(--down); }
.check-list .chev { flex: none; margin-left: auto; color: var(--muted); }
.check-list details[open] .chev { transform: rotate(90deg); }
.check-list summary:hover .chev { color: var(--fg); }
.check-list .conditions { margin: 0 0 0.75rem 1.625rem; }
@media (prefers-reduced-motion: no-preference) {
  .check-list .chev { transition: transform 150ms ease-out; }
}
.more { min-height: 2.75rem; margin-top: 0.75rem; padding: 0 0.875rem; border: 1px solid var(--border); border-radius: 0.5rem; background: transparent; color: var(--fg); font-size: 0.8125rem; font-weight: 500; }
.more:hover { background: var(--hover); }
#d-check-more > .meta { margin-top: 0.75rem; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 0 0.375rem; min-height: 2.75rem; margin: -0.75rem 0 0.25rem; }
.crumbs .label { margin: 0; }
.crumbs > span { display: contents; }
.crumbs button { min-height: 2.75rem; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
.crumbs button:hover { color: var(--fg); text-decoration-color: currentColor; }
.crumbs .sep { color: var(--muted); font-size: 0.6875rem; }
#d-crumbs:not(:empty) ~ .label { color: var(--fg); }
.level-meta { margin-top: 0.75rem; }
.level-meta strong { color: var(--fg); font-weight: 600; }
.level-meta strong.partial { color: var(--partial); }
.level-meta strong.down { color: var(--down); }
.level-incidents { margin: 0.75rem 0 0; }
.incident-list .outage { align-items: center; font-size: 0.875rem; }
.incident-list .outage svg { flex: none; color: var(--down); }
.incident-list .outage .what { font-weight: 600; }
.incident-list .outage time { color: var(--fg); }
.conditions { margin: 0.5rem 0 0; padding: 0; list-style: none; }
.conditions li { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.1875rem 0; font-size: 0.8125rem; }
.conditions svg { flex: none; margin-top: 0.1875rem; }
.conditions .pass svg { color: var(--up); }
.conditions .fail svg { color: var(--down); }
.conditions code { font-family: var(--mono); font-size: 0.75rem; overflow-wrap: anywhere; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1rem; padding-top: 1.25rem; padding-bottom: 1.5rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.75rem; }
footer p { margin: 0; }
footer a { color: var(--muted); font-weight: 500; text-decoration: none; }
footer a:hover { color: var(--fg); }
#tip { position: fixed; top: 0; left: 0; z-index: 10; max-width: 17rem; padding: 0.5rem 0.625rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--card); color: var(--fg); font-size: 0.75rem; line-height: 1.4; pointer-events: none; box-shadow: 0 4px 12px oklch(0 0 0 / 0.08); }
#tip span { display: block; color: var(--muted); }
@media (max-width: 32rem) {
  .bars { gap: 1px; height: 1.5rem; }
  .bars > span { border-radius: 1px; }
  .check-list summary { gap: 0.5rem; }
  .check-list .when { min-width: 0; flex: 1; }
}
</style>
</head>
<body>
<header class="wrap top">
  <a class="brand" href="/"><img src="/solace-logo.png" alt="" width="24" height="24">Solace status</a>
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="system" aria-pressed="true" aria-label="System theme" title="System theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
    <button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Light theme" title="Light theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
    <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark theme" title="Dark theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  </div>
</header>
<main class="wrap">
  <div id="overview">
    <section class="summary" aria-live="polite">
      <span id="summary-dot" class="dot"></span>
      <h1 id="summary">Checking services…</h1>
      <p id="summary-meta" class="meta"></p>
    </section>
    <noscript><p class="meta">Turn on JavaScript to see live status.</p></noscript>
    <div id="groups"></div>
    <section class="incidents" aria-labelledby="incidents-title">
      <h2 id="incidents-title" class="label">Incidents in the last 30 days</h2>
      <ul id="incidents" class="incident-list"></ul>
      <p class="meta">Interruptions shorter than 3 minutes are not listed.</p>
    </section>
  </div>
  <div id="detail" hidden>
    <div class="detail-intro">
      <a class="back" href="/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>All services</a>
      <div class="detail-head">
        <h1 id="d-name">Loading…</h1>
        <span id="d-state" class="state"></span>
      </div>
      <p id="d-meta" class="meta" aria-live="polite"></p>
    </div>
    <div id="d-body" hidden>
      <section id="d-history" class="block" aria-labelledby="d-days-title">
        <nav class="crumbs" aria-label="Zoom level">
          <span id="d-crumbs"></span>
          <h2 id="d-days-title" class="label" tabindex="-1" aria-live="polite"></h2>
        </nav>
        <div id="d-days"></div>
        <p id="d-level-meta" class="meta level-meta" hidden></p>
        <ul id="d-level-incidents" class="incident-list level-incidents"></ul>
      </section>
      <section class="block" aria-labelledby="d-chart-title">
        <div class="block-head">
          <h2 id="d-chart-title" class="label">Response time</h2>
          <div class="range" role="group" aria-label="Time range">
            <button type="button" data-range="24h" aria-pressed="true">24 hours</button>
            <button type="button" data-range="7d" aria-pressed="false">7 days</button>
            <button type="button" data-range="30d" aria-pressed="false">30 days</button>
            <button type="button" data-range="90d" aria-pressed="false">90 days</button>
          </div>
        </div>
        <div id="d-chart" class="chart" role="img" tabindex="0"></div>
        <p id="d-chart-meta" class="meta"></p>
      </section>
      <section class="block" aria-labelledby="d-checks-title">
        <h2 id="d-checks-title" class="label">Checks</h2>
        <div id="d-checks"></div>
        <h3 id="d-list-title" class="sub check-title" hidden>Latest checks</h3>
        <ul id="d-check-list" class="check-list" hidden></ul>
        <div id="d-check-more"></div>
      </section>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">
    <p>Solace. Private, for now.</p>
    <a href="https://solace.onl/privacy">Privacy commitments</a>
  </div>
</footer>
<div id="tip" role="tooltip" hidden></div>
<script>
(() => {
  "use strict";
  // Gatus keys are group_name; endpoints missing here fall back to their raw name.
  const SERVICES = {
    "application_website": ["Website", "solace.onl"],
    "application_api-health": ["API", "api.solace.onl"],
    "application_api-mail-jmap": ["API to mail server", "Private network link"],
    "mail_jmap-session": ["Mail access", "JMAP at mail.solace.onl"],
    "mail_mta-sts": ["Mail server certificate", "MTA-STS at mta-sts.solace.onl"],
    "stalwart-metrics_stalwart-metrics": ["Storage and delivery", "Mail server error counters"],
    "vps_vps-health": ["Mail relay", "SMTP relay and tunnels"],
  };
  const GROUPS = { "Stalwart Metrics": "Mail server", VPS: "Mail relay" };
  const DAYS = 90;
  // Individual checks are listed a page at a time; the first page also feeds the service header.
  const CHECKS_PAGE = 30;
  const CURRENT_MS = 60e3;
  const HISTORY_MS = 15 * 60e3;
  const INCIDENT_DAYS = 30;
  const MIN_INCIDENT_MS = 3 * 60e3;
  const MAX_INCIDENTS = 10;
  const THEME_KEY = "solace-status-theme";
  const STATE_TEXT = { up: "Operational", down: "Down", unknown: "No data" };
  const DATES = { month: "short", day: "numeric" };
  // Range: [label, tick format, length in ms, bucket size in seconds]; wide ranges use coarser buckets so the line stays readable.
  const RANGES = {
    "24h": ["24 hours", { hour: "numeric" }, 864e5, 3600],
    "7d": ["7 days", DATES, 7 * 864e5, 3600],
    "30d": ["30 days", DATES, 30 * 864e5, 6 * 3600],
    "90d": ["90 days", DATES, 90 * 864e5, 24 * 3600],
  };

  const icon = (paths, size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
  const ICONS = {
    next: icon('<path d="m9 18 6-6-6-6"/>', 16),
    pass: icon('<path d="M20 6 9 17l-5-5"/>', 14),
    fail: icon('<path d="M18 6 6 18M6 6l12 12"/>', 14),
    alert: icon('<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>', 16),
  };

  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const format = (options) => new Intl.DateTimeFormat(undefined, options);
  const clock = format({ hour: "numeric", minute: "2-digit" });
  const clockSeconds = format({ hour: "numeric", minute: "2-digit", second: "2-digit" });
  const dayTime = format({ month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const dateOnly = format(DATES);
  const weekday = format({ weekday: "short", month: "short", day: "numeric" });
  const longDay = format({ weekday: "long", month: "long", day: "numeric" });
  const api = (key, path) => `/api/v1/endpoints/${encodeURIComponent(key)}/${path}`;
  const link = (key) => `/endpoints/${encodeURIComponent(key)}`;
  // Days are calendar days in the viewer's time zone; the server buckets them at the same midnights.
  const ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
  const pad = (n) => String(n).padStart(2, "0");
  const dateKey = (at) => {
    const d = new Date(at);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const dayOf = (y, m, d) => ({ from: new Date(y, m, d).getTime(), to: new Date(y, m, d + 1).getTime() });
  const periodLink = (key, day, hour) => `${link(key)}?day=${dateKey(day.from)}${hour == null ? "" : `&hour=${new Date(hour).getHours()}`}`;
  const timelineUrl = (key, from, to, step = 3600) =>
    `/timeline/${encodeURIComponent(key)}?from=${Math.floor(from / 1000)}&to=${Math.ceil(to / 1000)}&step=${step}&tz=${encodeURIComponent(ZONE)}`;

  function lastDays() {
    const today = new Date();
    return Array.from({ length: DAYS }, (_, i) => dayOf(today.getFullYear(), today.getMonth(), today.getDate() - (DAYS - 1 - i)));
  }

  const daysUrl = (key) => timelineUrl(key, lastDays()[0].from, Date.now(), 86400);
  const route = /^\/endpoints\/([^/]+)\/?$/.exec(location.pathname);
  let detailKey = null;
  try {
    detailKey = route && decodeURIComponent(route[1]);
  } catch {
    detailKey = null;
  }
  const query = new URLSearchParams(location.search);
  const queryDay = /^(\d{4})-(\d{2})-(\d{2})$/.exec(query.get("day") || "");
  const queryHour = Number(query.get("hour") ?? "x");

  const order = Object.keys(SERVICES);
  const rank = (key) => (order.includes(key) ? order.indexOf(key) : order.length);
  const describe = (key, name) => SERVICES[key] || [name || key, ""];
  const stateOf = (e) => {
    const results = e.results || [];
    const last = results[results.length - 1];
    return last ? (last.success ? "up" : "down") : "unknown";
  };
  const percent = (uptime) => (uptime >= 1 ? "100%" : `${(Math.floor(uptime * 10000) / 100).toFixed(2)}%`);
  const ms = (value) => (value >= 1000 ? `${(value / 1000).toFixed(1)} s` : `${Math.round(value)} ms`);

  function duration(span) {
    const minutes = Math.max(1, Math.round(span / 60e3));
    if (minutes < 60) return `${minutes} min`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return minutes % 60 ? `${hours} h ${minutes % 60} min` : `${hours} h`;
    const days = Math.floor(hours / 24);
    return hours % 24 ? `${days} d ${hours % 24} h` : `${days} d`;
  }

  let endpoints = [];
  let history = {};
  let detail = null;
  // The day and hour picked from the bars live in the URL; while one is set, the chart shows it instead of a range.
  let selected = detailKey && queryDay ? dayOf(Number(queryDay[1]), Number(queryDay[2]) - 1, Number(queryDay[3])) : null;
  let selectedHour = selected && Number.isInteger(queryHour) && queryHour >= 0 && queryHour < 24
    ? new Date(Number(queryDay[1]), Number(queryDay[2]) - 1, Number(queryDay[3]), queryHour).getTime()
    : null;
  let selectedCheck = null;
  // Older pages of checks loaded with "Show more", and the rows the viewer has expanded (kept across refreshes).
  let olderResults = [];
  let checksExhausted = false;
  let loadingMore = false;
  const openChecks = new Set();
  const zoom = { day: null, hour: null, error: false };
  const chart = { range: "24h", data: null, error: false, valid: [], index: null };
  let slowAt = 0;
  let updatedAt = null;
  let failed = false;
  let missing = false;
  let busy = false;

  async function getJSON(url) {
    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) {
      // An unread error body keeps the connection busy, so drain it before failing.
      await response.text();
      throw Object.assign(new Error(`HTTP ${response.status}`), { status: response.status });
    }
    return response.json();
  }

  async function loadOverview(slow) {
    const list = await getJSON("/api/v1/endpoints/statuses?page=1&pageSize=1");
    endpoints = list.sort((a, b) => rank(a.key) - rank(b.key));
    if (!slow) return;
    const entries = await Promise.all(endpoints.map(async (e) => {
      const [days, statuses] = await Promise.allSettled([
        getJSON(daysUrl(e.key)),
        getJSON(api(e.key, "statuses?page=1&pageSize=1")),
      ]);
      const previous = history[e.key] || {};
      return [e.key, {
        days: days.status === "fulfilled" ? days.value : previous.days,
        events: statuses.status === "fulfilled" ? statuses.value.events || [] : previous.events,
      }];
    }));
    history = Object.fromEntries(entries);
  }

  const rangeUrl = (range) => timelineUrl(detailKey, Date.now() - RANGES[range][2], Date.now(), RANGES[range][3]);

  async function loadZoom() {
    const day = selected;
    const hour = selectedHour;
    try {
      if (day && !zoom.day) {
        const data = await getJSON(timelineUrl(detailKey, day.from, day.to));
        if (selected === day) zoom.day = data;
      }
      if (hour !== null && !zoom.hour) {
        const data = await getJSON(timelineUrl(detailKey, hour, hour + 36e5));
        if (selectedHour === hour) {
          zoom.hour = data;
          // An hour opens on its first failure, which is usually why someone zoomed in.
          const failure = data.checks.find((c) => !c.ok);
          if (failure && !openChecks.size) openChecks.add(failure.at);
        }
      }
      zoom.error = false;
    } catch {
      zoom.error = true;
    }
  }

  async function loadDetail(slow) {
    detail = await getJSON(api(detailKey, `statuses?page=1&pageSize=${CHECKS_PAGE}`));
    if (slow) Object.assign(zoom, { day: null, hour: null });
    await loadZoom();
    if (!slow) return;
    const range = chart.range;
    const [times] = await Promise.allSettled([getJSON(rangeUrl(range))]);
    if (chart.range === range) {
      chart.data = times.status === "fulfilled" ? times.value : chart.data;
      chart.error = times.status === "rejected" && !chart.data;
    }
  }

  async function refresh() {
    if (busy || (document.hidden && updatedAt)) return;
    busy = true;
    const slow = Date.now() - slowAt > HISTORY_MS;
    try {
      await (detailKey ? loadDetail(slow) : loadOverview(slow));
      if (slow) slowAt = Date.now();
      updatedAt = new Date();
      failed = false;
      missing = false;
    } catch (error) {
      failed = true;
      missing = error.status === 404;
    }
    busy = false;
    render();
  }

  async function setRange(range) {
    if (range === chart.range) return;
    Object.assign(chart, { range, data: null, error: false });
    render();
    try {
      const data = await getJSON(rangeUrl(range));
      if (chart.range === range) chart.data = data;
    } catch {
      if (chart.range === range) chart.error = true;
    }
    render();
  }

  const tips = {};
  const activeBar = {};

  function strip(id, items, aria, selectedIndex) {
    tips[id] = items;
    const bars = items.map((item, i) => `<span class="${item ? item.cls : "empty"}${i === selectedIndex ? " selected" : ""}" data-i="${i}"></span>`).join("");
    return `<div class="bars" role="group" tabindex="0" aria-label="${esc(aria)}" data-tip="${esc(id)}">${bars}</div>`;
  }

  const checksText = (ok, total) => `${ok.toLocaleString()} of ${total.toLocaleString()} checks passed`;

  function totals(buckets) {
    const sum = { ok: 0, total: 0, ms: 0 };
    for (const b of buckets) {
      sum.ok += b.ok;
      sum.total += b.total;
      sum.ms += b.ms * b.total;
    }
    return sum.total ? { share: sum.ok / sum.total, ok: sum.ok, total: sum.total, ms: sum.ms / sum.total } : null;
  }

  function dayItems(data) {
    if (!data) return Array(DAYS).fill(null);
    const buckets = new Map(data.buckets.map((b) => [b.at * 1000, b]));
    return lastDays().map((window) => {
      const b = buckets.get(window.from);
      const label = esc(weekday.format(window.from));
      if (!b || !b.total) return { cls: "none", window, tip: `${label}<span>No data</span>` };
      const share = b.ok / b.total;
      return {
        cls: share >= 0.99 ? "up" : share >= 0.9 ? "partial" : "down",
        window,
        tip: `${label}<span>${percent(share)} uptime · ${checksText(b.ok, b.total)}</span><span>Average response ${ms(b.ms)}</span>`,
      };
    });
  }

  function dayStrip(key, name, data) {
    const items = dayItems(data);
    const sum = data && totals(data.buckets);
    const bad = items.filter((item) => item && item.cls !== "up" && item.cls !== "none").length;
    const aria = sum
      ? `${name}: ${percent(sum.share)} uptime over ${DAYS} days${bad ? `, ${bad} ${bad === 1 ? "day" : "days"} below 99%` : ""}. Arrow keys browse days, Enter opens one.`
      : `${name}: no history yet.`;
    return `${strip(`days:${key}`, items, aria, -1)}<div class="scale"><span>${DAYS} days ago</span><span>Today</span></div>`;
  }

  // Gatus's results and the timeline's checks share one shape: { at, ok, ms, status, errors, conditions: [[text, ok]] }.
  const fromResult = (r) => ({
    at: Date.parse(r.timestamp),
    ok: r.success,
    ms: r.duration / 1e6,
    status: r.status,
    errors: r.errors || [],
    conditions: (r.conditionResults || []).map((c) => [c.condition, c.success]),
  });

  const checkItem = (c) => ({
    cls: c.ok ? "up" : "down",
    at: c.at,
    tip: `${esc(clockSeconds.format(c.at))}<span>${c.ok ? "Passed" : "Failed"} in ${ms(c.ms)}</span>${c.status ? `<span>HTTP ${c.status}</span>` : ""}`,
  });

  function incidentsOf(e, events) {
    const found = [];
    let start = null;
    for (const event of events || []) {
      const at = Date.parse(event.timestamp);
      if (event.type === "UNHEALTHY" && start === null) start = at;
      if (event.type === "HEALTHY" && start !== null) {
        found.push({ e, start, end: at });
        start = null;
      }
    }
    if (start !== null && stateOf(e) === "down") found.push({ e, start, end: null });
    return found.sort((a, b) => b.start - a.start);
  }

  function incidentRow(incident, withName) {
    const ongoing = incident.end === null;
    const what = ongoing ? `Down since ${clock.format(incident.start)}` : `Down for ${duration(incident.end - incident.start)}`;
    const name = withName ? `<a class="name" href="${link(incident.e.key)}">${esc(describe(incident.e.key, incident.e.name)[0])}</a>` : "";
    return `<li>${name}<span class="what${ongoing ? " down" : ""}">${what}</span><time datetime="${new Date(incident.start).toISOString()}">${esc(dayTime.format(incident.start))}</time></li>`;
  }

  // Zoomed in, an outage is the point of the view, so it gets the alert colour and its exact window.
  function outageRow(incident) {
    const end = incident.end === null ? null : incident.end;
    const sameDay = end !== null && dateKey(end) === dateKey(incident.start);
    const window = end === null ? `since ${dayTime.format(incident.start)}` : `${dayTime.format(incident.start)} – ${sameDay ? clock.format(end) : dayTime.format(end)}`;
    const what = end === null ? "Down now" : `Down for ${duration(end - incident.start)}`;
    return `<li class="outage">${ICONS.alert}<span class="what down">${what}</span><time datetime="${new Date(incident.start).toISOString()}">${esc(window)}</time></li>`;
  }

  const shareClass = (share) => (share >= 1 ? "" : share >= 0.9 ? "partial" : "down");

  function renderSummary() {
    const down = endpoints.filter((e) => stateOf(e) === "down");
    let state = "up";
    let title = "All systems operational";
    let meta = updatedAt ? `Updated ${clock.format(updatedAt)}` : "";
    if (!endpoints.length) {
      state = "unknown";
      title = failed ? "Status unavailable" : "Checking services…";
      meta = failed ? "The monitor did not answer. Trying again every minute." : "";
    } else if (down.length) {
      state = "down";
      title = down.length === endpoints.length ? "All services are down" : down.length === 1 ? "One service is down" : `${down.length} services are down`;
      meta = `Affected: ${down.map((e) => describe(e.key, e.name)[0]).join(", ")} · ${meta}`;
    }
    if (failed && updatedAt) meta += " · Refresh failed, retrying";
    $("summary-dot").className = `dot ${state}`;
    $("summary").textContent = title;
    $("summary-meta").textContent = meta;
  }

  function uptimeLine(e, days) {
    const uptime = e.uptime || {};
    const ninety = days && totals(days.buckets);
    const cells = [["24 hours", uptime.day], ["7 days", uptime.week], ["30 days", uptime.month], ["90 days", ninety && ninety.share]];
    return `<dl class="uptimes">${cells.map(([label, value]) => `<div><dt>${label}</dt><dd>${typeof value === "number" ? percent(value) : "–"}</dd></div>`).join("")}</dl>`;
  }

  function renderService(e) {
    const [name, about] = describe(e.key, e.name);
    const state = stateOf(e);
    const days = (history[e.key] || {}).days;
    return `<article class="svc">
      <a class="svc-head" href="${link(e.key)}"><h3>${esc(name)}</h3><span class="detail">${esc(about)}</span><span class="state ${state}">${STATE_TEXT[state]}</span>${ICONS.next}</a>
      ${dayStrip(e.key, name, days)}
      ${uptimeLine(e, days)}
    </article>`;
  }

  function renderOverview() {
    renderSummary();
    const groups = new Map();
    for (const e of endpoints) {
      if (!groups.has(e.group)) groups.set(e.group, []);
      groups.get(e.group).push(e);
    }
    $("groups").innerHTML = [...groups].map(([group, list]) =>
      `<section class="group"><h2 class="label">${esc(GROUPS[group] || group || "Other")}</h2>${list.map(renderService).join("")}</section>`
    ).join("");
    const list = $("incidents");
    if (!slowAt) {
      list.innerHTML = `<li class="empty">${failed ? "Incident history is unavailable." : "Loading…"}</li>`;
      return;
    }
    const since = Date.now() - INCIDENT_DAYS * 864e5;
    const all = endpoints
      .flatMap((e) => incidentsOf(e, (history[e.key] || {}).events))
      .filter((i) => i.end === null || (i.end >= since && i.end - i.start >= MIN_INCIDENT_MS))
      .sort((a, b) => b.start - a.start);
    const items = all.slice(0, MAX_INCIDENTS).map((i) => incidentRow(i, true));
    if (!items.length) items.push(`<li class="empty">No incidents in the last ${INCIDENT_DAYS} days.</li>`);
    if (all.length > MAX_INCIDENTS) items.push(`<li class="empty">Showing the ${MAX_INCIDENTS} most recent of ${all.length}.</li>`);
    list.innerHTML = items.join("");
  }

  function checkInterval(results) {
    if (results.length < 2) return "";
    const gaps = results.slice(1).map((r, i) => Date.parse(r.timestamp) - Date.parse(results[i].timestamp)).sort((a, b) => a - b);
    return `Checked every ${duration(gaps[gaps.length >> 1])}`;
  }

  function condition(ok, html) {
    return `<li class="${ok ? "pass" : "fail"}">${ok ? ICONS.pass : ICONS.fail}<span class="sr">${ok ? "Passed:" : "Failed:"}</span>${html}</li>`;
  }

  function renderDetail() {
    const [name, about] = describe(detailKey, detail && detail.name);
    document.title = `${missing ? "Not found" : name} · Solace status`;
    $("d-name").textContent = missing ? "Service not found" : name;
    $("d-body").hidden = !detail;
    if (!detail) {
      $("d-state").textContent = "";
      $("d-meta").textContent = missing
        ? "No monitor has this name. It may have been renamed or removed."
        : failed ? "The monitor did not answer. Trying again every minute." : "";
      return;
    }
    const results = detail.results || [];
    const last = results[results.length - 1];
    const state = stateOf(detail);
    $("d-state").className = `state ${state}`;
    $("d-state").textContent = STATE_TEXT[state];
    $("d-meta").textContent = [about, checkInterval(results), last && `Last check ${clockSeconds.format(new Date(last.timestamp))}`, failed && "Refresh failed, retrying"]
      .filter(Boolean).join(" · ");
    renderHistory();
    renderChecks();
    renderChart();
  }

  const hourLabel = (at) => `${clock.format(at)} – ${clock.format(at + 36e5)}`;
  const note = (text) => `<p class="meta">${esc(text)}</p>`;

  // Every part of the detail view follows one period: the chart's range, a selected day, or a selected hour.
  function period() {
    if (selectedHour !== null) {
      return { kind: "hour", from: selectedHour, to: selectedHour + 36e5, data: zoom.hour, error: zoom.error, title: `${weekday.format(selectedHour)}, ${hourLabel(selectedHour)}` };
    }
    if (selected) return { kind: "day", from: selected.from, to: selected.to, step: 3600, data: zoom.day, error: zoom.error, title: longDay.format(selected.from) };
    const [label, , span, step] = RANGES[chart.range];
    const now = Date.now();
    return { kind: "range", from: now - span, to: now, step, data: chart.data, error: chart.error, title: `Last ${label}`, ago: `${label} ago` };
  }

  function summaryOf(p) {
    if (!p.data) return { note: p.error ? "History is unavailable right now." : "Loading…" };
    if (p.kind === "hour") {
      const checks = p.data.checks;
      if (!checks.length) {
        const since = p.data.checksSince;
        return { note: since && since > p.from ? `Individual checks are kept for about a day; the oldest is from ${dayTime.format(since)}.` : "No checks were recorded in this hour." };
      }
      const passed = checks.filter((c) => c.ok);
      const average = passed.length ? passed.reduce((sum, c) => sum + c.ms, 0) / passed.length : 0;
      return { meta: `<strong class="${shareClass(passed.length / checks.length)}">${checksText(passed.length, checks.length)}</strong>${passed.length ? ` · average response ${ms(average)}` : ""}` };
    }
    const sum = totals(p.data.buckets);
    const meta = sum ? `<strong class="${shareClass(sum.share)}">${percent(sum.share)} uptime</strong> · ${checksText(sum.ok, sum.total)} · average response ${ms(sum.ms)}` : "No checks were recorded in this period.";
    const merged = p.kind === "day" && p.data.buckets.some((b) => b.span > 3600);
    return { meta, note: merged ? "This day was recorded before hourly history was kept, so only its daily total exists." : null };
  }

  // The period's title (with a breadcrumb when zoomed), its summary and its outages.
  function renderHistory() {
    const p = period();
    const crumbs = selected ? [["overview", "Overview"]] : [];
    if (selectedHour !== null) crumbs.push(["day", weekday.format(selected.from)]);
    $("d-crumbs").innerHTML = crumbs.map(([level, text]) => `<button type="button" data-level="${level}">${esc(text)}</button><span class="sep" aria-hidden="true">/</span>`).join("");
    $("d-days-title").textContent = p.title;
    const summary = summaryOf(p);
    // An hour's notes (loading, checks no longer kept) already stand in for its checks below.
    const notice = p.kind === "hour" ? null : summary.note;
    $("d-days").innerHTML = notice ? note(notice) : "";
    $("d-days").hidden = !notice;
    $("d-level-meta").innerHTML = summary.meta || "";
    $("d-level-meta").hidden = !summary.meta;
    const events = detail.events || [];
    const rows = incidentsOf(detail, events)
      .filter((i) => i.start < p.to && (i.end === null ? Date.now() : i.end) > p.from)
      .map(outageRow);
    const covered = events.length > 0 && Date.parse(events[0].timestamp) <= p.from;
    if (!rows.length) rows.push(`<li class="empty">${covered ? "No incidents in this period." : "No incidents recorded. Older status changes are not kept."}</li>`);
    $("d-level-incidents").innerHTML = rows.join("");
  }

  function slotsOf(p) {
    const slots = [];
    if (p.step >= 86400) {
      for (let at = dayAt(p.from).from; at < p.to; at = dayAt(at).to) slots.push([at, dayAt(at).to]);
    } else {
      const size = p.step * 1000;
      for (let at = Math.floor(p.from / size) * size; at < p.to; at += size) slots.push([at, at + size]);
    }
    return slots;
  }

  // One bar per bucket of the period, coloured by its checks; a bar opens its hour, or its day when that is finer than the view.
  function periodItems(p) {
    return slotsOf(p).map(([start, end]) => {
      if (start > Date.now()) return null;
      const bucket = p.data.buckets.find((b) => b.at * 1000 <= start && start < (b.at + b.span) * 1000);
      const merged = bucket && bucket.span * 1000 > end - start;
      const hour = end - start === 36e5 && !merged ? { day: dayAt(start), hour: start } : null;
      const open = hour || (p.kind === "range" ? { day: dayAt(start), hour: null } : null);
      const label = merged ? `${dateOnly.format(bucket.at * 1000)}, daily total` : end - start >= 864e5 ? weekday.format(start) : `${dayTime.format(start)} – ${clock.format(end)}`;
      if (!bucket || !bucket.total) return { cls: "none", open, tip: `${esc(label)}<span>No data</span>` };
      const share = bucket.ok / bucket.total;
      const strict = bucket.span <= 3600;
      return {
        cls: share === 1 || (!strict && share >= 0.99) ? "up" : share >= (strict ? 0.5 : 0.9) ? "partial" : "down",
        open,
        tip: `${esc(label)}<span>${percent(share)} uptime · ${checksText(bucket.ok, bucket.total)}</span><span>Average response ${ms(bucket.ms)}</span>`,
      };
    });
  }

  // The checks follow the period: one bar per bucket, or every check of a selected hour with its details.
  function renderChecks() {
    const p = period();
    const box = $("d-checks");
    $("d-checks-title").textContent = p.kind === "hour" ? "Checks in this hour" : "Checks";
    if (!p.data || (p.kind === "hour" && !p.data.checks.length)) {
      box.innerHTML = note(p.data ? summaryOf(p).note : p.error ? "Checks are unavailable right now." : "Loading…");
    } else if (p.kind !== "hour") {
      const items = periodItems(p);
      box.innerHTML = strip("periods", items, `${p.title}. Arrow keys browse, Enter opens one.`, -1)
        + `<div class="scale"><span>${esc(p.ago || clock.format(p.from))}</span><span>${esc(p.ago ? "Now" : clock.format(p.to))}</span></div>`;
      box.querySelector(".bars").classList.toggle("dense", items.length > 100);
    } else {
      const checks = p.data.checks;
      const failures = checks.filter((c) => !c.ok).length;
      const items = checks.map(checkItem);
      box.innerHTML = strip("checks", items, `${checks.length} checks in this hour, ${failures} failed. Arrow keys browse checks, Enter opens one.`, items.findIndex((item) => item.at === selectedCheck))
        + `<div class="scale"><span>${esc(clock.format(p.from))}</span><span>${esc(clock.format(p.to))}</span></div>`;
    }
    renderCheckList(p);
  }

  // Individual checks, newest first: the latest ones Gatus kept on a range, every check of a selected hour, none for a day.
  function listedChecks(p) {
    if (p.kind === "hour") return p.data ? [...p.data.checks].reverse() : [];
    if (p.kind === "day") return [];
    const byTime = new Map();
    for (const result of [...(detail.results || []), ...olderResults]) byTime.set(result.timestamp, fromResult(result));
    return [...byTime.values()].filter((c) => c.at >= p.from).sort((a, b) => b.at - a.at);
  }

  function checkRow(check) {
    const when = dateKey(check.at) === dateKey(Date.now()) ? clockSeconds.format(check.at) : `${dateOnly.format(check.at)}, ${clockSeconds.format(check.at)}`;
    const details = [
      ...check.conditions.map(([text, ok]) => condition(ok, `<code>${esc(text)}</code>`)),
      ...check.errors.map((error) => condition(false, esc(error))),
    ].join("");
    return `<li><details class="${check.ok ? "passed" : "failed"}" data-at="${check.at}"${openChecks.has(check.at) ? " open" : ""}>
      <summary>${check.ok ? ICONS.pass : ICONS.fail}<span class="when">${esc(when)}</span><span class="result">${check.ok ? "Passed" : "Failed"}</span><span class="speed">${ms(check.ms)}</span>${check.status ? `<span class="http">HTTP ${check.status}</span>` : ""}${ICONS.next}</summary>
      <ul class="conditions">${details}</ul>
    </details></li>`;
  }

  function renderCheckList(p) {
    const checks = listedChecks(p);
    const list = $("d-check-list");
    list.hidden = !checks.length;
    $("d-list-title").hidden = !checks.length || p.kind === "hour";
    list.innerHTML = checks.map(checkRow).join("");
    for (const chevron of list.querySelectorAll("summary > svg:last-child")) chevron.classList.add("chev");
    const oldest = checks[checks.length - 1];
    const more = $("d-check-more");
    if (p.kind !== "range" || !checks.length) more.innerHTML = "";
    else if (checksExhausted) more.innerHTML = note("Older checks are not kept.");
    else more.innerHTML = oldest.at > p.from ? `<button class="more" type="button"${loadingMore ? " disabled" : ""}>${loadingMore ? "Loading…" : "Show more"}</button>` : "";
  }

  function niceCeil(value) {
    const power = 10 ** Math.floor(Math.log10(value));
    return [1, 2, 4, 5, 10].map((step) => step * power).find((step) => step >= value);
  }

  const dayAt = (at) => {
    const d = new Date(at);
    return dayOf(d.getFullYear(), d.getMonth(), d.getDate());
  };

  // Points open the hour they cover (hourly buckets) or their day (wider ones); days Gatus merged before hourly retention open nothing finer.
  function bucketPoints(buckets, from, to, inDay) {
    return buckets.filter((b) => b.total).map((b) => {
      const at = b.at * 1000;
      const span = b.span * 1000;
      const share = b.ok / b.total;
      const label = span >= 864e5 ? dateOnly.format(at) : `${dayTime.format(at)} – ${clock.format(at + span)}`;
      const open = span === 36e5 ? { day: inDay || dayAt(at), hour: at } : !inDay ? { day: dayAt(at), hour: null } : null;
      return {
        t: Math.min(to, Math.max(from, at + span / 2)),
        v: b.ms,
        failed: share < 0.5,
        partial: share >= 0.5 && share < 1,
        reach: span * 2.5,
        open,
        tip: `${esc(label)}<span>Average response ${ms(b.ms)}</span><span>${b.ok} of ${b.total} checks passed</span>`,
      };
    });
  }

  function rangeModel() {
    const [label, ticks, span, step] = RANGES[chart.range];
    const now = Date.now();
    const points = chart.data ? bucketPoints(chart.data.buckets, now - span, now, null) : [];
    const unit = step === 3600 ? ["hour", "hours"] : step === 86400 ? ["day", "days"] : ["six-hour block", "six-hour blocks"];
    const empty = chart.error ? "Response times are unavailable." : chart.data ? "No response times recorded in this range." : "Loading…";
    return { points, from: now - span, to: now, label: `the last ${label}`, ticks, unit, empty };
  }

  function dayModel() {
    const points = zoom.day ? bucketPoints(zoom.day.buckets, selected.from, selected.to, selected) : [];
    const empty = zoom.error ? "Hourly detail is unavailable right now." : zoom.day ? "No response times recorded for this day." : "Loading…";
    return { points, from: selected.from, to: selected.to, label: `${dayTime.format(selected.from)} – ${dayTime.format(selected.to)}`, ticks: { hour: "numeric" }, unit: ["hour", "hours"], empty };
  }

  function hourModel() {
    const checks = zoom.hour ? zoom.hour.checks || [] : [];
    const points = checks.map((c) => ({
      t: c.at,
      v: Math.max(1, c.ms),
      failed: !c.ok,
      reach: 15 * 60e3,
      tip: `${esc(clockSeconds.format(c.at))}<span>${c.ok ? "Passed" : "Failed"} in ${ms(c.ms)}</span>${c.status ? `<span>HTTP ${c.status}</span>` : ""}`,
    }));
    const empty = zoom.error ? "Checks are unavailable right now." : zoom.hour ? "No individual checks were kept for this hour." : "Loading…";
    return { points, from: selectedHour, to: selectedHour + 36e5, label: `${dayTime.format(selectedHour)} – ${clock.format(selectedHour + 36e5)}`, ticks: { hour: "numeric", minute: "2-digit" }, unit: ["check", "checks"], empty };
  }

  function renderChart() {
    const box = $("d-chart");
    for (const button of document.querySelectorAll("[data-range]")) button.setAttribute("aria-pressed", String(!selected && button.dataset.range === chart.range));
    const model = selectedHour !== null ? hourModel() : selected ? dayModel() : rangeModel();
    const points = model.points;
    chart.valid = points;
    chart.index = null;
    box.toggleAttribute("data-zoomable", points.some((p) => p.open));
    if (!points.length) {
      box.innerHTML = `<p class="empty">${model.empty}</p>`;
      box.setAttribute("aria-label", `Response time: ${model.empty}`);
      $("d-chart-meta").textContent = selected ? model.label : "";
      return;
    }
    // Failed checks report their timeout, so the scale follows healthy points and failures are pinned to the top edge.
    const healthy = points.filter((p) => !p.failed && !p.partial);
    const values = (healthy.length ? healthy : points).map((p) => p.v);
    const top = niceCeil(Math.max(1, ...values) * 1.15);
    chart.t0 = model.from;
    chart.span = model.to - model.from || 1;
    chart.x = (t) => ((t - chart.t0) / chart.span) * 100;
    chart.y = (v) => 100 - (Math.min(v, top) / top) * 100;
    const xy = (p) => `${chart.x(p.t).toFixed(2)},${chart.y(p.v).toFixed(2)}`;
    let line = "";
    let area = "";
    let run = [];
    const lone = [];
    const flush = () => {
      if (run.length === 1) lone.push(run[0]);
      if (run.length > 1) {
        const path = run.map(xy).join("L");
        line += `M${path}`;
        area += `M${chart.x(run[0].t).toFixed(2)},100L${path}L${chart.x(run[run.length - 1].t).toFixed(2)},100Z`;
      }
      run = [];
    };
    points.forEach((p, i) => {
      const previous = points[i - 1];
      if (previous && p.t - previous.t > Math.max(previous.reach, p.reach)) flush();
      run.push(p);
    });
    flush();
    const markers = [...lone, ...points.filter((p) => (p.failed || p.partial) && !lone.includes(p))];
    const tick = format(model.ticks);
    const average = values.reduce((sum, v) => sum + v, 0) / values.length;
    const degraded = points.length - healthy.length;
    // Outages from the recorded status changes are shaded across the chart so downtime reads at a glance.
    const outages = incidentsOf(detail, detail.events)
      .map((i) => [Math.max(model.from, i.start), Math.min(model.to, i.end === null ? Date.now() : i.end)])
      .filter(([start, end]) => end > start);
    const downFor = outages.reduce((sum, [start, end]) => sum + end - start, 0);
    const bands = outages.map(([start, end]) => {
      const x = chart.x(start);
      return `<rect class="outage" x="${x.toFixed(2)}" y="0" width="${Math.max(0.6, chart.x(end) - x).toFixed(2)}" height="100"/>`;
    }).join("");
    const summary = `${downFor ? `Down ${duration(downFor)} · ` : ""}Average ${ms(average)} · fastest ${ms(Math.min(...values))} · slowest ${ms(Math.max(...values))}`
      + (degraded && healthy.length ? ` · ${degraded} ${model.unit[degraded === 1 ? 0 : 1]} with failures left out` : "");
    const zoomable = box.hasAttribute("data-zoomable");
    box.setAttribute("aria-label", `Response time, ${model.label}. ${summary}.${zoomable ? " Arrow keys browse points, Enter opens one." : ""}`);
    box.innerHTML = `<div class="plot">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${bands}${[0, 50, 100].map((y) => `<line class="grid" x1="0" x2="100" y1="${y}" y2="${y}"/>`).join("")}<path class="area" d="${area}"/><path class="line" d="${line}"/></svg>
      ${[top, top / 2, 0].map((v, i) => `<span class="ytick" style="top:${i * 50}%">${ms(v)}</span>`).join("")}
      ${markers.map((p) => `<span class="point${p.failed ? " failed" : p.partial ? " partial" : ""}" style="left:${chart.x(p.t)}%;top:${chart.y(p.v)}%"></span>`).join("")}
      <span class="cross" hidden></span><span class="mark" hidden></span>
    </div>
    <div class="xticks" aria-hidden="true">${[0, 0.5, 1].map((f) => `<span>${esc(tick.format(chart.t0 + f * chart.span))}</span>`).join("")}</div>`;
    $("d-chart-meta").textContent = selected ? `${model.label} · ${summary}` : summary;
  }

  const tip = $("tip");

  function placeTip(html, box) {
    tip.innerHTML = html;
    tip.hidden = false;
    const x = Math.min(Math.max(8, (box.left + box.right) / 2 - tip.offsetWidth / 2), innerWidth - tip.offsetWidth - 8);
    const above = box.top - tip.offsetHeight - 8;
    tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(above < 8 ? box.bottom + 8 : above)}px)`;
  }

  function hideTip() {
    tip.hidden = true;
    for (const marker of document.querySelectorAll(".cross, .mark")) marker.hidden = true;
    for (const bar of document.querySelectorAll(".bars > .active")) bar.classList.remove("active");
  }

  function showBar(strip, index) {
    const item = (tips[strip.dataset.tip] || [])[index];
    hideTip();
    if (!item) return;
    activeBar[strip.dataset.tip] = index;
    const bar = strip.children[index];
    bar.classList.add("active");
    placeTip(item.tip, bar.getBoundingClientRect());
  }

  async function zoomTo(day, hour) {
    // The bars a keyboard user acted on are replaced, so focus moves to the new level's heading.
    const refocus = $("d-history").contains(document.activeElement);
    if (!day || !selected || day.from !== selected.from) zoom.day = null;
    zoom.hour = null;
    selectedCheck = null;
    openChecks.clear();
    selected = day;
    selectedHour = day ? hour : null;
    globalThis.history.replaceState(null, "", day ? periodLink(detailKey, day, selectedHour) : link(detailKey));
    render();
    if (refocus) $("d-days-title").focus({ preventScroll: true });
    await loadZoom();
    render();
  }

  function activate(strip, index) {
    const id = strip.dataset.tip;
    const item = (tips[id] || [])[index];
    if (!item) return;
    if (id === "checks") {
      selectedCheck = item.at;
      openChecks.add(item.at);
      render();
      const row = $("d-check-list").querySelector(`[data-at="${item.at}"]`);
      if (row) row.scrollIntoView({ block: "nearest" });
    } else if (id === "periods") {
      if (item.open) zoomTo(item.open.day, item.open.hour);
    } else {
      location.href = periodLink(id.slice("days:".length), item.window);
    }
  }

  function showPoint(index) {
    const p = chart.valid[index];
    const plot = $("d-chart").querySelector(".plot");
    if (!p || !plot) return;
    chart.index = index;
    const x = chart.x(p.t);
    const y = chart.y(p.v);
    const cross = plot.querySelector(".cross");
    const mark = plot.querySelector(".mark");
    cross.style.left = `${x}%`;
    mark.style.left = `${x}%`;
    mark.style.top = `${y}%`;
    cross.hidden = false;
    mark.hidden = false;
    const box = plot.getBoundingClientRect();
    const px = box.left + (x / 100) * box.width;
    const py = box.top + (y / 100) * box.height;
    placeTip(p.tip, { left: px, right: px, top: py, bottom: py });
  }

  const main = document.querySelector("main");
  const focusId = (el) => (el && el !== document.body ? el.dataset.tip || el.getAttribute("href") : null);

  function render() {
    // Re-rendering replaces strips and links, so keyboard focus is carried over to their replacements.
    const focused = document.activeElement;
    const id = focusId(focused);
    hideTip();
    if (detailKey) renderDetail();
    else renderOverview();
    if (id && !document.contains(focused)) {
      const again = [...main.querySelectorAll("[data-tip], a[href]")].find((el) => focusId(el) === id);
      if (again) again.focus({ preventScroll: true });
    }
  }

  main.addEventListener("pointerover", (event) => {
    if (event.target.closest(".chart")) return;
    const bar = event.target.closest(".bars > span");
    if (bar) showBar(bar.parentElement, Number(bar.dataset.i));
    else hideTip();
  });
  main.addEventListener("pointerleave", hideTip);
  main.addEventListener("click", (event) => {
    const bar = event.target.closest(".bars > span");
    if (bar) activate(bar.parentElement, Number(bar.dataset.i));
  });
  main.addEventListener("focusin", (event) => {
    const strip = event.target;
    if (!strip.matches(".bars")) return;
    const items = tips[strip.dataset.tip] || [];
    const remembered = activeBar[strip.dataset.tip];
    showBar(strip, items[remembered] ? remembered : items.length - 1);
  });
  main.addEventListener("focusout", (event) => {
    if (event.target.matches(".bars")) hideTip();
  });
  main.addEventListener("keydown", (event) => {
    const strip = event.target;
    if (!strip.matches(".bars")) return;
    const filled = (tips[strip.dataset.tip] || []).map((item, i) => (item ? i : -1)).filter((i) => i >= 0);
    if (!filled.length) return;
    const current = filled.includes(activeBar[strip.dataset.tip]) ? activeBar[strip.dataset.tip] : filled[filled.length - 1];
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      activate(strip, current);
      return;
    }
    const step = { ArrowLeft: -1, ArrowRight: 1, Home: -Infinity, End: Infinity }[event.key];
    if (step === undefined) return;
    event.preventDefault();
    const position = Math.min(filled.length - 1, Math.max(0, filled.indexOf(current) + step));
    showBar(strip, filled[position]);
  });
  $("d-crumbs").addEventListener("click", (event) => {
    const crumb = event.target.closest("[data-level]");
    if (crumb) zoomTo(crumb.dataset.level === "day" ? selected : null, null);
  });
  // "toggle" doesn't bubble, so a capturing listener keeps the expanded rows in sync across re-renders.
  $("d-check-list").addEventListener("toggle", (event) => {
    const at = Number(event.target.dataset.at);
    if (event.target.open) openChecks.add(at);
    else openChecks.delete(at);
  }, true);
  $("d-check-more").addEventListener("click", async (event) => {
    if (!event.target.closest(".more") || loadingMore) return;
    loadingMore = true;
    render();
    try {
      const page = 2 + Math.floor(olderResults.length / CHECKS_PAGE);
      const data = await getJSON(api(detailKey, `statuses?page=${page}&pageSize=${CHECKS_PAGE}`));
      olderResults = [...olderResults, ...(data.results || [])];
      if ((data.results || []).length < CHECKS_PAGE) checksExhausted = true;
    } catch {
      // The button comes back, so the viewer can try again.
    }
    loadingMore = false;
    render();
    const button = $("d-check-more").querySelector(".more");
    if (button) button.focus({ preventScroll: true });
  });

  const chartBox = $("d-chart");

  function nearestPoint(clientX) {
    const plot = chartBox.querySelector(".plot");
    if (!plot || !chart.valid.length) return -1;
    const box = plot.getBoundingClientRect();
    const t = chart.t0 + ((clientX - box.left) / box.width) * chart.span;
    let nearest = 0;
    chart.valid.forEach((p, i) => {
      if (Math.abs(p.t - t) < Math.abs(chart.valid[nearest].t - t)) nearest = i;
    });
    return nearest;
  }

  function openPoint(index) {
    const p = chart.valid[index];
    if (p && p.open) zoomTo(p.open.day, p.open.hour);
  }

  chartBox.addEventListener("pointermove", (event) => {
    const index = nearestPoint(event.clientX);
    if (index >= 0) showPoint(index);
  });
  chartBox.addEventListener("click", (event) => openPoint(nearestPoint(event.clientX)));
  chartBox.addEventListener("pointerleave", () => {
    if (document.activeElement !== chartBox) hideTip();
  });
  chartBox.addEventListener("focus", () => showPoint(chart.valid.length - 1));
  chartBox.addEventListener("blur", hideTip);
  chartBox.addEventListener("keydown", (event) => {
    if (!chart.valid.length) return;
    const last = chart.valid.length - 1;
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openPoint(chart.index === null ? last : chart.index);
      return;
    }
    const step = { ArrowLeft: -1, ArrowRight: 1, Home: -Infinity, End: Infinity }[event.key];
    if (step === undefined) return;
    event.preventDefault();
    // With no point picked yet, moving right starts at the first point and moving left at the last.
    const current = chart.index === null ? (step > 0 ? -1 : last + 1) : chart.index;
    showPoint(Math.min(last, Math.max(0, current + step)));
  });
  for (const button of document.querySelectorAll("[data-range]")) {
    button.addEventListener("click", () => {
      if (selected) zoomTo(null, null);
      setRange(button.dataset.range);
    });
  }

  const root = document.documentElement;
  const themeButtons = document.querySelectorAll("[data-theme-choice]");

  function syncThemeButtons() {
    const choice = root.dataset.theme || "system";
    for (const button of themeButtons) button.setAttribute("aria-pressed", String(button.dataset.themeChoice === choice));
  }

  for (const button of themeButtons) {
    button.addEventListener("click", () => {
      const choice = button.dataset.themeChoice;
      // System clears the override; light-dark() then tracks the browser's preference live.
      if (choice === "system") delete root.dataset.theme;
      else root.dataset.theme = choice;
      try {
        if (choice === "system") localStorage.removeItem(THEME_KEY);
        else localStorage.setItem(THEME_KEY, choice);
      } catch {
        // Storage can be blocked; the choice then lasts for this page view only.
      }
      syncThemeButtons();
    });
  }
  syncThemeButtons();

  $("overview").hidden = Boolean(detailKey);
  $("detail").hidden = !detailKey;
  addEventListener("scroll", hideTip, { passive: true });
  document.addEventListener("visibilitychange", refresh);
  setInterval(refresh, CURRENT_MS);
  refresh();
})();
</script>
</body>
</html>
