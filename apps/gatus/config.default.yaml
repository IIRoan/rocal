storage:
  type: sqlite
  path: /data/gatus.db
  maximum-number-of-results: 100

web:
  address: 0.0.0.0
  port: ${PORT}

metrics: true

alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    title: "Solace Status"
    default-alert:
      send-on-resolved: true
      failure-threshold: 2
      success-threshold: 2
      description: "Service monitor failed"

ui:
  title: "Solace Status"
  header: "Solace Status"
  description: "Uptime for Solace (solace.onl) and mail (mail.solace.onl)."
  # Non-empty (Gatus falls back to "Health Dashboard" on empty); hidden via theme.css.
  dashboard-heading: " "
  dashboard-subheading: " "
  logo: /solace-logo.png
  link: "https://solace.onl"
  # Default when no cookie / OS preference; prefers-color-scheme still wins.
  dark-mode: false
  default-sort-by: group
  favicon:
    default: /favicon.ico
    size16x16: /favicon-16x16.png
    size32x32: /favicon-32x32.png
  buttons: []
  custom-css: |
    __THEME_CSS_PLACEHOLDER__

.endpoint-ui: &endpoint-ui
  period: 90d

.discord-alerts: &discord-alerts
  alerts:
    - type: discord

# Prometheus scrape via slot-manager so HAProxy never hits the warming slot.
.prometheus: &prometheus
  <<: *discord-alerts
  url: https://mail.solace.onl/slot-manager/metrics/prometheus
  headers:
    Authorization: "Basic __PROMETHEUS_BASIC_AUTH__"
  client:
    timeout: 15s
  ui:
    <<: *endpoint-ui
    hide-url: true

endpoints:
  - name: website
    <<: *discord-alerts
    group: Application
    url: https://solace.onl/
    interval: 60s
    ui:
      <<: *endpoint-ui
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: api-health
    <<: *discord-alerts
    group: Application
    url: https://api.solace.onl/api/health
    interval: 60s
    ui:
      <<: *endpoint-ui
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: jmap-session
    <<: *discord-alerts
    group: Mail
    url: https://mail.solace.onl/jmap/session
    interval: 30s
    ui:
      <<: *endpoint-ui
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: slot-blue-green
    <<: *discord-alerts
    group: Mail
    url: https://mail.solace.onl/slot-manager/status
    interval: 60s
    ui:
      <<: *endpoint-ui
    headers:
      Authorization: "Bearer ${SLOT_MANAGER_TOKEN}"
    conditions:
      - "[STATUS] == 200"

  - name: stalwart-exporter
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP server_memory*)"
      - "[BODY] == pat(*# TYPE server_memory*)"

  - name: stalwart-smtp-receive
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP smtp_active_connections*)"
      - "[BODY] == pat(*smtp_active_connections*)"
      - "[BODY] == pat(*# TYPE smtp_request_time*)"

  - name: stalwart-smtp-antispam
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP smtp_active_connections*)"
      - "[BODY] == pat(*# HELP delivery_active_connections*)"
      - "[BODY] == pat(*delivery_active_connections*)"

  - name: stalwart-delivery
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*delivery_active_connections*)"
      - "[BODY] == pat(*# HELP delivery_active_connections*)"

  - name: stalwart-imap
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP imap_active_connections*)"
      - "[BODY] == pat(*imap_active_connections*)"

  - name: stalwart-jmap-http
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*http_active_connections*)"
      - "[BODY] == pat(*http_request_time_count*)"

  - name: stalwart-store
    <<: *prometheus
    group: Stalwart Metrics
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP user_count*)"
      - "[BODY] == pat(*user_count*)"
      - "[BODY] == pat(*# HELP domain_count*)"
      - "[BODY] == pat(*domain_count*)"

  - name: stalwart-error-counters
    <<: *prometheus
    group: Stalwart Metrics
    interval: 120s
    conditions:
      # Store I/O must be present; error counters are unhealthy only when exported (>0).
      - "[STATUS] == 200"
      - "[BODY] == pat(*store_blob_read*)"
      - "[BODY] == pat(*store_data_write*)"
      - "[BODY] != pat(*store_unexpected_error*)"
      - "[BODY] != pat(*store_s3_error*)"
      - "[BODY] != pat(*smtp_concurrency_limit_exceeded*)"
      - "[BODY] != pat(*calendar_rule_expansion_error*)"
