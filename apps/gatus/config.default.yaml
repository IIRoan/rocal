storage:
  type: sqlite
  path: /data/gatus.db
  # A day of individual checks at the fastest (30s) interval, so the status page can zoom into any recent hour.
  maximum-number-of-results: 2880

web:
  address: 0.0.0.0
  port: ${PORT}

alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    title: "Solace Status"
    default-alert:
      send-on-resolved: true
      failure-threshold: 2
      success-threshold: 2
      description: "Service monitor failed"

# Endpoint names are storage keys: renaming one drops its 90-day history. Display names live in status.html.
.discord-alerts: &discord-alerts
  alerts:
    - type: discord

endpoints:
  # Vercel: HEAD keeps Fluid bandwidth low (status + TLS only).
  - name: website
    <<: *discord-alerts
    group: Application
    url: https://solace.onl/
    method: HEAD
    interval: 2m
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  # Cheap JSON liveness on the API; the primary backend signal.
  - name: api-health
    <<: *discord-alerts
    group: Application
    url: https://api.solace.onl/api/health
    interval: 1m
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  # API -> Stalwart over the private network; one unauthenticated request.
  - name: api-mail-jmap
    <<: *discord-alerts
    group: Application
    url: https://api.solace.onl/api/health/mail-jmap
    interval: 1m
    client:
      timeout: 15s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 10000"

  # Shared user-directory scan status; independent from liveness and mail acceptance.
  - name: api-mail-policy
    <<: *discord-alerts
    group: Application
    url: https://api.solace.onl/api/health/mail-policy
    interval: 5m
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

  # Fourteen-day user-key advisory; service keys require a separate operator check.
  - name: api-mail-key-expiry
    <<: *discord-alerts
    group: Application
    url: https://api.solace.onl/api/health/mail-key-expiry
    interval: 5m
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

  # Public JMAP through Railway HTTPS.
  - name: jmap-session
    <<: *discord-alerts
    group: Mail
    url: https://mail.solace.onl/jmap/session
    interval: 30s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  # Stalwart's ACME certificate (the one SMTP STARTTLS presents) via the VPS :443 passthrough; starttls:// fails, Go sends EHLO localhost.
  - name: mta-sts
    <<: *discord-alerts
    group: Mail
    url: https://mta-sts.solace.onl/.well-known/mta-sts.txt
    interval: 10m
    client:
      timeout: 15s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*mx: mx.solace.onl*)"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  # One scrape of Stalwart's exporter; Stalwart Enterprise Alerts handle counter values and thresholds.
  - name: stalwart-metrics
    <<: *discord-alerts
    group: Stalwart Metrics
    url: https://mail.solace.onl/metrics/prometheus
    interval: 2m
    headers:
      Authorization: "Basic __PROMETHEUS_BASIC_AUTH__"
    client:
      timeout: 15s
    ui:
      hide-url: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*stalwart_server_memory_bytes*)"
      - "[BODY] == pat(*stalwart_smtp_active_connections*)"
      - "[BODY] == pat(*stalwart_smtp_request_time_seconds_count*)"
      - "[BODY] == pat(*stalwart_delivery_active_connections*)"
      - "[BODY] == pat(*stalwart_imap_active_connections*)"
      - "[BODY] == pat(*stalwart_http_active_connections*)"
      - "[BODY] == pat(*stalwart_http_request_time_seconds_count*)"
      - "[BODY] == pat(*stalwart_users*)"
      - "[BODY] == pat(*stalwart_domains*)"
      - "[BODY] == pat(*stalwart_store_blob_read_total*)"
      - "[BODY] == pat(*stalwart_store_data_write_total*)"
      # Error counters are exported only once they are non-zero.
      - "[BODY] != pat(*store_unexpected_error*)"
      - "[BODY] != pat(*store_s3_error*)"
      - "[BODY] != pat(*smtp_concurrency_limit_exceeded*)"
      - "[BODY] != pat(*calendar_rule_expansion_error*)"
      - "[BODY] != pat(*stalwart_encryption_encryption_skipped_total*)"
