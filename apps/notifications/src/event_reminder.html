<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{{.EventTitle}}</title>
  <style>
    :root { color-scheme: light dark; }
    body { background-color: #ffffff !important; }
    @media (prefers-color-scheme: dark) {
      body, .email-page { background-color: #111111 !important; }
      .email-box, .email-divider { border-color: #333333 !important; }
      .email-title, .email-text { color: #eeeeee !important; }
      .email-muted, .email-footer { color: #a3a3a3 !important; }
      .email-btn { background-color: #ffe0c2 !important; color: #202020 !important; }
    }
  </style>
</head>
<body style='margin:0;padding:0;background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased'>
  <div style="display:none;overflow:hidden;line-height:1px;opacity:0;max-height:0;max-width:0">{{.Summary}}</div>
  <table class="email-page" role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="background-color:#ffffff">
    <tr>
      <td align="center" style="padding:24px 12px 32px">
        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width:600px">
          <tr>
            <td style="text-align:left">
              <table class="email-box" role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" align="center" style="max-width:520px;margin:0 auto;border:1px solid #e0e0e0;border-radius:8px;border-collapse:separate">
                <tr>
                  <td align="center" style="padding:40px 24px">
                    <img src="{{.LogoUrl}}" alt="Solace" width="40" height="40" style="display:block;width:40px;height:40px;margin:0 auto;border:0" />
                    <div class="email-divider" style="padding:16px 0 24px;border-bottom:1px solid #e0e0e0;text-align:center">
                      <h1 class="email-title" style="margin:0;font-size:24px;line-height:32px;font-weight:400;color:#202020">{{.TimeUntilEvent}}</h1>
                      <p class="email-muted" style="margin:8px 0 0;font-size:14px;line-height:20px;color:#6b6b6b">{{.EventDate}} &middot; {{.EventTime}}{{if .Duration}} &middot; {{.Duration}}{{end}}</p>
                    </div>
                    <div style="padding-top:20px;text-align:left">
                      <p class="email-text" style="margin:0;font-size:14px;line-height:20px;color:#202020">{{.Summary}}</p>
                      <div style="padding-top:32px;text-align:center">
                        <a class="email-btn" href="{{.EventUrl}}" style="display:inline-block;min-width:90px;padding:10px 24px;border-radius:4px;background-color:#644a40;color:#ffffff;font-size:14px;font-weight:500;line-height:16px;text-decoration:none">Open event</a>
                      </div>
                    </div>
                  </td>
                </tr>
              </table>
              <p class="email-footer" style="margin:12px 0 0;font-size:11px;line-height:18px;color:#6b6b6b;text-align:center">You received this reminder because email notifications are enabled for your account. Change this in your <a class="email-footer" href="{{.SettingsUrl}}" style="color:#6b6b6b;text-decoration:underline">settings</a>.</p>
              <p class="email-footer" style="margin:0;font-size:11px;line-height:18px;color:#6b6b6b;text-align:center"><a class="email-footer" href="{{.PrivacyUrl}}" style="color:#6b6b6b;text-decoration:underline">Privacy</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
