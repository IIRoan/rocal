# HAProxy public edge: TCP/HTTP to the frps load-balancing group ports; install at /etc/haproxy/haproxy.cfg.
global
    log /dev/log local0
    maxconn 4096
    stats socket /run/haproxy/admin.sock mode 660 level admin
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  5m
    timeout server  5m

frontend ft_smtp
    bind *:25
    default_backend bk_smtp

# HTTP→HTTPS redirect so browsers can see HSTS on :80.
frontend ft_http
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301
    http-after-response set-header Strict-Transport-Security "max-age=15552000"

# TLS passes through untouched: Stalwart is the only certificate manager, and its listener allowlists the public paths.
frontend ft_https
    bind *:443
    default_backend bk_https

# Loopback WebAdmin via SSH tunnel.
frontend ft_http_admin
    bind 127.0.0.1:8080
    mode http
    option httplog
    default_backend bk_http_admin

# Only HAProxy should send PROXY v2; frpc must pass it through (no second header).
backend bk_smtp
    balance roundrobin
    option tcp-check
    default-server inter 4s fastinter 2s downinter 4s fall 3 rise 1
    server stalwart 127.0.0.1:10025 send-proxy-v2 check check-send-proxy

# The check fetches the MTA-STS policy end to end; verify none so an expiring certificate never takes the route down.
backend bk_https
    balance roundrobin
    option httpchk
    http-check send meth GET uri /.well-known/mta-sts.txt ver HTTP/1.1 hdr Host mta-sts.solace.onl
    http-check expect status 200
    default-server inter 4s fastinter 2s downinter 4s fall 3 rise 1
    server stalwart 127.0.0.1:18443 send-proxy-v2 check check-send-proxy check-ssl verify none check-sni mta-sts.solace.onl

backend bk_http_admin
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /jmap/session ver HTTP/1.1 hdr Host mail.solace.onl
    http-check expect status 200
    default-server inter 4s fastinter 2s downinter 4s fall 3 rise 1
    server stalwart 127.0.0.1:18080 send-proxy-v2 check check-send-proxy
