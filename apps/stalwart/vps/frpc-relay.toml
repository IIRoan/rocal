serverAddr = "127.0.0.1"
serverPort = 7000
transport.tls.serverName = "frps.solace"
transport.tls.certFile = "/etc/frp/tls/client.crt"
transport.tls.keyFile = "/etc/frp/tls/client.key"
transport.tls.trustedCaFile = "/etc/frp/tls/ca.crt"

[auth]
method = "token"
token = "__FRP_TOKEN__"

[[proxies]]
name = "relay-postfix"
type = "stcp"
localIP = "127.0.0.1"
localPort = 2525
secretKey = "__FRP_RELAY_STCP_KEY__"
