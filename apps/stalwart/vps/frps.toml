# Run on the VPS: frps -c frps.toml (firewall TCP 7000 for Railway only).

bindAddr = "0.0.0.0"
bindPort = 7000

# Tunnel endpoints are only reachable from localhost; HAProxy connects locally.
proxyBindAddr = "127.0.0.1"

# Dashboard for debugging (localhost only)
webServer.addr = "127.0.0.1"
webServer.port = 7500

# Mutual TLS: only clients holding a cert from the Solace frp CA (scripts/frp-tls-certs.sh) may connect.
transport.tls.force = true
transport.tls.certFile = "/etc/frp/tls/server.crt"
transport.tls.keyFile = "/etc/frp/tls/server.key"
transport.tls.trustedCaFile = "/etc/frp/tls/ca.crt"

[auth]
method = "token"
# Rendered by apply-vps-repo.sh from the mail-vps FRP_TOKEN secret; never commit the value.
token = "__FRP_TOKEN__"

# Only allow the ports frpc registers.
[[allowPorts]]
start = 10025
end = 10025

[[allowPorts]]
start = 11025
end = 11025

[[allowPorts]]
start = 10465
end = 10465

[[allowPorts]]
start = 11465
end = 11465

[[allowPorts]]
start = 10587
end = 10587

[[allowPorts]]
start = 11587
end = 11587

[[allowPorts]]
start = 10993
end = 10993

[[allowPorts]]
start = 11993
end = 11993

[[allowPorts]]
start = 10443
end = 10443

[[allowPorts]]
start = 11443
end = 11443

[[allowPorts]]
start = 18080
end = 18080

[[allowPorts]]
start = 19080
end = 19080
