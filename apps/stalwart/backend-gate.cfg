# Railway entries for public JMAP and the private API; never log paths, blob ids or attachment names.
global
    maxconn 1024
    # Railway exposes host CPUs beyond this container's eight-vCPU quota.
    thread-hard-limit 8
    lua-load-per-thread "${STALWART_GATE_LUA_PATH}"
    tune.lua.session-timeout 1s
    httpclient.resolvers.prefer ipv4
    httpclient.retries 0
    httpclient.timeout.connect 500ms

resolvers default
    parse-resolv-conf
    hold valid 10s

defaults
    mode http
    timeout connect 5s
    timeout http-request 10s
    timeout client 5m
    timeout server 5m

frontend ft_backend_gate
    bind ":::${STALWART_GATE_PORT}" v4v6
    # Digests are compared so timing reveals nothing about the key; an unset digest matches nothing.
    acl gate_key req.fhdr(x-solace-gate),sha2(256),hex -m str -i "${STALWART_GATE_KEY_SHA256}"
    acl api_jmap path /jmap /.well-known/jmap
    acl api_jmap path_beg /jmap/
    acl api_auth path /api/auth /auth/token
    http-request return status 404 if !gate_key
    http-request return status 404 if !api_jmap !api_auth
    http-request return status 404 if api_auth !METH_POST
    http-request del-header x-solace-gate
    # Railway's edge sets X-Real-IP and only key holders reach this line, so Stalwart rate-limits the API's egress IP as it does via the VPS.
    http-request set-src req.hdr(x-real-ip) if { req.hdr(x-real-ip) -m found }
    # PROXY v2 needs one address family; an IPv4 dst keeps an IPv4 client from arriving as ::ffff:-mapped.
    http-request set-dst ipv4(127.0.0.1)
    # Stalwart's discovery redirect always names mail.solace.onl, which the API proxy rejects as cross-origin.
    http-request set-path /jmap/session if { path /.well-known/jmap }
    default_backend bk_stalwart

frontend ft_public_jmap
    bind ":::${STALWART_PUBLIC_PORT}" v4v6
    # Only the Railway edge supplies this header; the authorizer's limiter and Stalwart's login protections key on it.
    acl real_ip_present req.hdr_ip(x-real-ip) -m found
    http-request return status 200 content-type "text/plain; charset=utf-8" lf-string "Contact: mailto:postmaster@solace.onl\nExpires: 2027-08-26T00:00:00.000Z\nPreferred-Languages: en\nCanonical: https://mail.solace.onl/.well-known/security.txt\n" if { path /.well-known/security.txt }
    acl unsafe_path path,url_dec -m reg (^|/)[.]{1,2}(/|$)
    acl public_path path /jmap /metrics/prometheus
    acl public_path path /mail/config-v1.1.xml /autodiscover/autodiscover.xml /autodiscover/autodiscover.json
    acl public_path path_beg /autodiscover/autodiscover.json/
    acl public_path path_beg /jmap/ /.well-known/ /api/discover
    http-request return status 404 if unsafe_path
    http-request set-var(txn.solace_is_public) bool(true) if public_path
    http-request return status 404 if !public_path !real_ip_present
    http-request lua.solace_admin_authorize if !public_path
    acl session_admin var(txn.solace_admin_status) -m str allowed
    acl admin_login var(txn.solace_admin_status) -m str login
    acl admin_step_up var(txn.solace_admin_status) -m str step_up
    acl admin_entry path / /admin /admin/
    http-request redirect location %[var(txn.solace_admin_login_url)] code 302 if !public_path admin_entry METH_GET admin_login
    http-request redirect location %[var(txn.solace_admin_login_url)]&stepUp=1 code 302 if !public_path admin_entry METH_GET admin_step_up
    http-request return status 404 if !public_path !session_admin
    http-request lua.solace_strip_cookies if { req.hdr(cookie) -m found }
    http-request del-header x-solace-gate
    http-request del-header x-solace-admin-gate
    # Railway overwrites X-Real-IP; Stalwart consumes the address through PROXY v2, never a client-supplied forwarding header.
    http-request set-src req.hdr_ip(x-real-ip) if { req.hdr(x-real-ip) -m found }
    http-request set-dst ipv4(127.0.0.1)
    http-after-response set-header Strict-Transport-Security "max-age=15552000"
    http-after-response lua.solace_admin_response if { res.hdr(set-cookie) -m found } || { var(txn.solace_auth_cookies) -m bool }
    http-after-response set-header Cache-Control "no-store" unless { var(txn.solace_is_public) -m bool }
    http-after-response set-header X-Content-Type-Options "nosniff"
    http-after-response set-header X-Frame-Options "DENY"
    http-after-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-after-response set-header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    http-after-response set-header Cross-Origin-Opener-Policy "same-origin"
    http-after-response set-header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; upgrade-insecure-requests" if { res.hdr(content-type) -m sub text/html }
    default_backend bk_stalwart

backend bk_stalwart
    # One upstream connection per request so each PROXY header carries that request's source.
    option http-server-close
    # Stalwart trusts PROXY v2 from loopback (proxyTrustedNetworks 127.0.0.0/8), so plain loopback HTTP is rejected.
    server stalwart "127.0.0.1:${STALWART_HTTP_PORT}" send-proxy-v2
