# Signs in to the App Review account and captures the App Store screenshots; run by app-store-screenshots.yml.
appId: onl.solace.mail
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 120000
- tapOn: "Email address"
- runFlow:
    file: type-slowly.yaml
    env:
      TEXT: ${EMAIL}
# Return moves focus to the password field, and Return there signs in; "Password" also matches the field's label.
- pressKey: Enter
- runFlow:
    file: type-slowly.yaml
    env:
      TEXT: ${PASSWORD}
- pressKey: Enter
# iOS offers to save the password after sign-in; its sheet hides the inbox from Maestro.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 180000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "(Re: )?Studio walkthrough on Thursday"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-inbox
- tapOn: "(Re: )?Studio walkthrough on Thursday"
- extendedWaitUntil:
    visible: ".*see you then.*"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-conversation
- tapOn: "Reply"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-reply
- tapOn: "Close"
- tapOn: "Go back"
- tapOn: "Invitation: Studio walkthrough.*"
- extendedWaitUntil:
    visible: "Accept"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-invitation
- tapOn: "Go back"
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-settings
