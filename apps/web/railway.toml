[build]
builder = "RAILPACK"
rootDirectory = "."
buildCommand = "cd packages/ui && bun install --frozen-lockfile && cd ../../apps/web && bun install --frozen-lockfile && bun run build"
watchPatterns = ["apps/web/**", "packages/ui/**", "packages/typescript-config/**", "bun.lockb"]

[deploy]
startCommand = "cd apps/web && bun run start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
