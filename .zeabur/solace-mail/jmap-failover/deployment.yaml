apiVersion: apps/v1
kind: Deployment
metadata:
  name: solace-jmap-failover
  namespace: solace-mail
  labels:
    app.kubernetes.io/name: solace-jmap-failover
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: solace-jmap-failover
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solace-jmap-failover
    spec:
      automountServiceAccountToken: false
      serviceAccountName: solace-jmap-endpoints
      enableServiceLinks: false
      imagePullSecrets:
        - name: solace-jmap-failover-registry
      nodeSelector:
        kubernetes.io/hostname: roan-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: cgr.dev/lunary.roan.zip/bun:1.4.5@sha256:3e7364a619c088e9d3d92ee0483f37785f2f2ab7bd1511b38a836de7b89f603e
          args: ["/app/failover.ts"]
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 15
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: cloudflare
              mountPath: /var/run/secrets/jmap-failover
              readOnly: true
            - name: gateway-endpoints
              mountPath: /var/run/secrets/jmap-endpoints
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: solace-jmap-failover-code
        - name: cloudflare
          secret:
            secretName: solace-jmap-failover-dns
            defaultMode: 0440
            items:
              - key: api-token
                path: api-token
        - name: gateway-endpoints
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
