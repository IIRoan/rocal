apiVersion: apps/v1
kind: Deployment
metadata:
  name: solace-jmap-failover
  namespace: solace-mail
  labels:
    app.kubernetes.io/name: solace-jmap-failover
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: solace-jmap-failover
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solace-jmap-failover
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: roan-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: docker.io/oven/bun:1.4.4-distroless@sha256:153a951ae40106e125898103e6e990ee0f38e6aee7f561029e26cf9fbed23470
          args: ["/app/failover.ts"]
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: cloudflare
              mountPath: /var/run/secrets/jmap-failover
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: solace-jmap-failover-code
        - name: cloudflare
          secret:
            secretName: solace-jmap-failover-dns
            defaultMode: 0440
            items:
              - key: api-token
                path: api-token
