apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: solace-origin
  namespace: solace-mail
spec:
  dnsNames:
    - api.solace.onl
    - mail.solace.onl
  duration: 2160h
  issuerRef:
    kind: Issuer
    name: solace-origin-ca
  privateKey:
    rotationPolicy: Always
  renewBefore: 720h
  secretName: solace-origin-tls
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: solace-origin-ca
  namespace: solace-mail
spec:
  ca:
    secretName: solace-origin-ca
