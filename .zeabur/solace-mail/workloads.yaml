apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: solace-api
    app.kubernetes.io/part-of: solace
  name: solace-api
  namespace: solace-mail
spec:
  minReadySeconds: 8
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: solace-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solace-api
        app.kubernetes.io/part-of: solace
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - haproxy
            - -db
            - -f
            - /etc/solace-api/haproxy.cfg
          env:
            - name: SOLACE_MAIL_UPSTREAM
              value: mail-live.solace-mail.svc.cluster.local:8081
          image: haproxy@sha256:1c3568e520453cc8ba98c39501febcf450429c80e6cc27ecad779961d76e597c
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              sleep:
                seconds: 8
          name: edge
          ports:
            - containerPort: 8080
              name: edge
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              httpHeaders:
                - name: Host
                  value: api.solace.onl
              path: /api/health
              port: edge
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 3
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 200m
              memory: 96Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/solace-api
              name: edge
              readOnly: true
        - env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: app-postgres-url
            - name: STALWART_BASE_URL
              value: http://stalwart-gate.railway.internal:8081
            - name: CALENDAR_SYNC
              value: 'true'
            - name: DATABASE_POOL_SIZE
              value: '10'
          envFrom:
            - secretRef:
                name: api-runtime
          image: zot.zot.svc:5000/solace-api/api@sha256:96c0ec8970441cfd0b2adabcf05a1eaebf2b75c4b0aff160098c80793d457679
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              sleep:
                seconds: 8
          name: api
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 4001
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 8
            successThreshold: 1
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 750m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/app-pg-ca
              name: app-pg-ca
              readOnly: true
      dnsPolicy: ClusterFirst
      hostAliases:
        - hostnames:
            - stalwart-gate.railway.internal
          ip: 127.0.0.1
      nodeSelector:
        kubernetes.io/hostname: webdock-1
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 40
      tolerations:
        - effect: NoSchedule
          key: roan.dev/apps-only
          operator: Equal
          value: 'true'
      volumes:
        - configMap:
            defaultMode: 420
            name: app-pg-ca
          name: app-pg-ca
        - configMap:
            defaultMode: 420
            name: api-edge-upstream
          name: edge
