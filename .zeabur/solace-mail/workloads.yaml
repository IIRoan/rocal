apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-cloudflared-a
  namespace: solace-mail
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mail-cf-tunnel
      instance: mail-cloudflared-a
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mail-cf-tunnel
        instance: mail-cloudflared-a
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --protocol
            - http2
            - run
          envFrom:
            - secretRef:
                name: mail-cf-tunnel
          image: cloudflare/cloudflared@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
          imagePullPolicy: IfNotPresent
          name: cloudflared
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: 2000
              scheme: HTTP
            periodSeconds: 4
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 350m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/solace-origin-ca
              name: solace-origin-ca
              readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: webdock-mail
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: roan.dev/apps-only
          operator: Equal
          value: 'true'
        - effect: NoSchedule
          key: roan.dev/mail-only
          operator: Equal
          value: 'true'
      volumes:
        - configMap:
            defaultMode: 420
            name: solace-origin-ca
          name: solace-origin-ca
---
