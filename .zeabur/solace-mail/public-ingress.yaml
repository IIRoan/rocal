apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: solace-public-ingress
  name: solace-public-ingress
  namespace: solace-mail
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: solace-public-ingress
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solace-public-ingress
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - webdock-1
                      - webdock-mail
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: solace-public-ingress
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      initContainers:
        - args:
            - --entryPoints.public.address=:9443/tcp
            - --entryPoints.public.http.tls=true
            - --entryPoints.smtp.address=:2525/tcp
            - --entryPoints.traefik.address=:8080/tcp
            - --providers.file.filename=/etc/solace-ingress/routes.yaml
            - --ping=true
            - --api.dashboard=false
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=solace-mail,riftbound,builder-system,demo,errors,portfolio,ente
            - --providers.kubernetesingress.ingressclass=solace-public
            - --providers.kubernetesingress.ingressendpoint.publishedservice=solace-mail/solace-public
            - --providers.kubernetesingress.disableClusterScopeResources=true
            - --log.level=WARN
            - --entryPoints.tunnel.address=:9444/tcp
            - --entryPoints.tunnel.http.tls=true
            - --entryPoints.public.http.middlewares=solace-direct-headers@file
            - --entryPoints.tunnel.http.middlewares=solace-tunnel-headers@file
            - --entryPoints.website.address=127.0.0.1:3001
            - --entryPoints.website.forwardedHeaders.trustedIPs=127.0.0.1/32
            - --entryPoints.apps.address=:9445/tcp
            - --entryPoints.apps.http.tls=true
            - --entryPoints.apps.http.middlewares=app-tunnel-cache@file
          image: docker.io/traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
          imagePullPolicy: IfNotPresent
          name: traefik
          restartPolicy: Always
          startupProbe:
            httpGet: {path: /ping, port: health}
            periodSeconds: 1
            failureThreshold: 60
          ports:
            - containerPort: 9443
              name: public-https
              protocol: TCP
            - containerPort: 9444
              name: tunnel-https
              protocol: TCP
            - containerPort: 9445
              name: apps-https
              protocol: TCP
            - containerPort: 2525
              name: smtp
              protocol: TCP
            - containerPort: 8080
              name: health
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: health
              scheme: HTTP
            periodSeconds: 3
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 300m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: ingress-routes
              mountPath: /etc/solace-ingress
              readOnly: true
            - name: kubernetes-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - --no-autoupdate
            - --edge-ip-version
            - '4'
            - --metrics
            - '0.0.0.0:2000'
            - --grace-period
            - 20s
            - run
          ports:
            - {name: tunnel-metrics, containerPort: 2000}
          startupProbe:
            httpGet: {path: /ready, port: tunnel-metrics}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: tunnel-metrics}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /metrics, port: tunnel-metrics}
            periodSeconds: 15
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tunnel-config, mountPath: /etc/cloudflared/config, readOnly: true}
            - {name: tunnel-credentials, mountPath: /etc/cloudflared/credentials, readOnly: true}
      volumes:
        - name: tunnel-config
          configMap:
            name: solace-edge-tunnel-config
        - name: tunnel-credentials
          secret:
            secretName: cloudflared-credentials
            defaultMode: 288
        - name: kubernetes-api
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
        - name: ingress-routes
          configMap:
            name: solace-ingress-routes
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: solace-tunnel-ingress
      serviceAccountName: solace-tunnel-ingress
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: roan.dev/apps-only
          operator: Equal
          value: 'true'
        - effect: NoSchedule
          key: roan.dev/mail-only
          operator: Equal
          value: 'true'
