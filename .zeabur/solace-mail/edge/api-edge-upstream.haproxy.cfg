global
    maxconn 512
    nbthread 1

defaults
    mode http
    timeout connect 5s
    timeout http-request 15s
    timeout client 5m
    timeout server 5m
    timeout tunnel 1h

resolvers cluster
    parse-resolv-conf
    hold valid 10s

frontend api_tunnel
    bind *:8080
    http-request return status 421 unless { hdr(host) -i api.solace.onl }
    bind *:8085
    acl direct_ingress dst_port 8085
    http-request set-var(txn.direct_ip) req.hdr_ip(X-Forwarded-For) if direct_ingress
    http-request del-header x-real-ip
    http-request del-header x-forwarded-for
    http-request del-header forwarded
    http-request del-header x-forwarded-host
    http-request del-header x-forwarded-proto
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[var(txn.direct_ip)] if direct_ingress { var(txn.direct_ip) -m found }
    http-request set-header X-Real-IP %[req.hdr_ip(CF-Connecting-IP)] if !direct_ingress { req.hdr_ip(CF-Connecting-IP) -m found }
    http-request del-header CF-Connecting-IP if direct_ingress
    http-response set-header X-Solace-Origin zeabur
    default_backend api_process

backend api_process
    retries 0
    server api 127.0.0.1:4001

# The deployed API allows the exact Railway-private host for its keyed JMAP gate.
# That name is pinned to loopback for this pod. Mail remains on the private cluster network.
listen mail_gate
    bind 127.0.0.1:8081
    retries 0
    server stalwart "${SOLACE_MAIL_UPSTREAM}" resolvers cluster init-addr libc,none
