http:
  routers:
    website:
      entryPoints: [website]
      rule: Host(`solace.onl`)
      service: website
  services:
    website:
      loadBalancer:
        healthCheck:
          path: /favicon-16x16.png
          method: HEAD
          interval: 500ms
          timeout: 750ms
        servers:
          - url: http://solace-web-0.solace-web.solace-mail.svc.cluster.local:3000
          - url: http://solace-web-1.solace-web.solace-mail.svc.cluster.local:3000
  middlewares:
    solace-direct-headers:
      headers:
        customRequestHeaders:
          X-Solace-Tunnel: ""
    solace-tunnel-headers:
      headers:
        customRequestHeaders:
          X-Solace-Tunnel: "1"
        customResponseHeaders:
          Cache-Control: "private, no-store"
    app-tunnel-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "private, no-store"
tcp:
  routers:
    smtp:
      entryPoints: [smtp]
      rule: HostSNI(`*`)
      service: mail-inbound
    mx-https:
      entryPoints: [public]
      rule: HostSNI(`mx.solace.onl`)
      service: mx-https
      tls:
        passthrough: true
  services:
    mail-inbound:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: mail-inbound.solace-mail.svc.cluster.local:2525
    mx-https:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: mail-live.solace-mail.svc.cluster.local:8443
