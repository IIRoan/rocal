http:
  middlewares:
    solace-direct-headers:
      headers:
        customRequestHeaders:
          X-Solace-Tunnel: ""
    solace-tunnel-headers:
      headers:
        customRequestHeaders:
          X-Solace-Tunnel: "1"
        customResponseHeaders:
          Cache-Control: "private, no-store"
    app-tunnel-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "private, no-store"
tcp:
  routers:
    smtp:
      entryPoints: [smtp]
      rule: HostSNI(`*`)
      service: mail-inbound
    mx-https:
      entryPoints: [public]
      rule: HostSNI(`mx.solace.onl`)
      service: mx-https
      tls:
        passthrough: true
    zeabur-apps:
      entryPoints: [public]
      rule: >-
        HostSNIRegexp(`(?i)^[a-z0-9-]+\.roan\.dev$`)
        && !(HostSNI(`builds.roan.dev`) || HostSNI(`demo.roan.dev`) || HostSNI(`test2.roan.dev`)
        || HostSNI(`errors.roan.dev`) || HostSNI(`objects.roan.dev`)
        || HostSNI(`www.roan.dev`) || HostSNI(`ingress.roan.dev`)
        || HostSNI(`ente.roan.dev`) || HostSNI(`enteweb.roan.dev`)
        || HostSNI(`zeabur.roan.dev`) || HostSNI(`login.roan.dev`))
      service: zeabur-apps
      tls:
        passthrough: true
  services:
    mail-inbound:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: mail-inbound.solace-mail.svc.cluster.local:2525
    mx-https:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: mail-live.solace-mail.svc.cluster.local:8443
    zeabur-apps:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: zeabur-app-gateway.traefik.svc.cluster.local:8444
