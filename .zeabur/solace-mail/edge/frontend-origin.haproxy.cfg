global
    maxconn 256
    nbthread 1

defaults
    mode http
    timeout connect 750ms
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout check 750ms

resolvers cluster
    parse-resolv-conf

frontend website
    bind *:3001
    default_backend frontend_origin

backend frontend_origin
    option httpchk GET /login
    http-check expect status 200
    option redispatch
    retries 1
    retry-on conn-failure
    default-server check inter 500ms downinter 1s rise 1 fall 1 init-state down
    server local 127.0.0.1:3000
    server peer solace-frontend.solace-mail.svc.cluster.local:3000 backup resolvers cluster init-addr none
