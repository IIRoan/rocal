apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: solace-mail
generatorOptions:
  immutable: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: api-edge-upstream
    files: [haproxy.cfg=api-edge-upstream.haproxy.cfg]
  - name: notifications-edge-upstream
    files: [haproxy.cfg=notifications-edge-upstream.haproxy.cfg]
  - name: solace-ingress-routes
    files: [routes.yaml=solace-ingress-routes.yaml]
  - name: solace-frontend-origin
    files: [haproxy.cfg=frontend-origin.haproxy.cfg]
