global
    nbthread 1
    maxconn 128
defaults
    mode http
    timeout connect 5s
    timeout client 90s
    timeout server 90s
resolvers cluster
    parse-resolv-conf
    hold valid 10s
listen mail_gate
    bind 127.0.0.1:8081
    retries 0
    server stalwart "${SOLACE_MAIL_UPSTREAM}" resolvers cluster init-addr libc,none
