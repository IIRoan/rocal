apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-database
  namespace: solace-mail
  labels:
    app.kubernetes.io/part-of: solace
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:37fdeea29a4d3ed14570f719488ba55bd21e8975eaea864be5ce74d25a9a13de
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: app-postgres
      app.kubernetes.io/part-of: solace
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      roan.dev/provider: webdock
    tolerations:
      - key: roan.dev/apps-only
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: roan.dev/mail-only
        operator: Equal
        value: "true"
        effect: NoSchedule
  bootstrap:
    initdb:
      database: solace
      owner: solace_app
      secret:
        name: app-database-auth
      encoding: UTF8
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
      dataChecksums: true
  enableSuperuserAccess: false
  enablePDB: true
  failoverDelay: 5
  smartShutdownTimeout: 0
  switchoverDelay: 45
  postgresql:
    parameters:
      max_connections: "64"
      shared_buffers: 48MB
      wal_keep_size: 128MB
      ssl_min_protocol_version: TLSv1.3
      wal_receiver_timeout: 5s
      wal_sender_timeout: 5s
    synchronous:
      dataDurability: preferred
      failoverQuorum: true
      method: any
      number: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 600m
      memory: 384Mi
  storage:
    size: 2Gi
    storageClass: solace-app-pg-project-encrypted
