apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: stalwart
      spec:
        minReadySeconds: 60
        template:
          spec:
            terminationGracePeriodSeconds: 50
            containers:
              - name: stalwart
                readinessProbe:
                  initialDelaySeconds: 8
                lifecycle:
                  preStop:
                    sleep:
                      seconds: 18
              - name: gateway
                ports:
                  - containerPort: 8081
                    name: private-jmap
                    protocol: TCP
                  - containerPort: 8082
                    name: public-jmap
                    protocol: TCP
                  - containerPort: 8085
                    name: public-direct
                    protocol: TCP
                  - containerPort: 18080
                    name: legacy-admin
                    protocol: TCP
                  - containerPort: 18443
                    name: edge-https
                    protocol: TCP
                  - containerPort: 22525
                    name: edge-smtp
                    protocol: TCP
                lifecycle:
                  preStop:
                    exec:
                      command:
                        - /bin/sh
                        - -c
                        - |
                          printf 'shutdown frontend ft_rollout_ready; shutdown frontend ft_edge_admin\n' |
                            socat -T 2 - UNIX-CONNECT:/tmp/solace-haproxy.sock
                          sleep 18
                readinessProbe:
                  initialDelaySeconds: 8
                  httpGet:
                    path: /readyz
                    port: 8084
                    scheme: HTTP
                  failureThreshold: 1
                  periodSeconds: 3
                  timeoutSeconds: 1
    target:
      kind: Deployment
