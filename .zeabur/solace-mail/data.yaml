apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mail-redis
  namespace: solace-mail
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mail-redis
  serviceName: mail-redis
  template:
    metadata:
      labels:
        app: mail-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - sh
            - -ec
            - |
              primary() {
                  REDISCLI_AUTH="$SENTINEL_PASSWORD" timeout 2 redis-cli --raw -h "$1" -p 26379 SENTINEL get-master-addr-by-name solace 2>/dev/null | head -n 1
              }
              while :; do
                  a=$(primary 10.43.11.29)
                  b=$(primary 10.43.45.232)
                  c=$(primary 10.43.35.161)
                  leader=""
                  if [ -n "$a" ] && { [ "$a" = "$b" ] || [ "$a" = "$c" ]; }; then
                      leader=$a
                  elif [ -n "$b" ] && [ "$b" = "$c" ]; then
                      leader=$b
                  fi
                  case "$leader" in 10.43.163.106|10.43.42.212) break;; esac
                  sleep 2
              done
              set -- redis-server --protected-mode yes --requirepass "$REDIS_PASSWORD" --masterauth "$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 64mb --maxmemory-policy noeviction --replica-announce-ip 10.43.163.106 --replica-read-only yes
              if [ "$leader" != "10.43.163.106" ]; then
                  set -- "$@" --replicaof "$leader" 6379
              fi
              exec "$@"
          env:
            - name: SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: SENTINEL_PASSWORD
                  name: mail-redis-sentinel-auth
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_PASSWORD
                  name: mail-object-auth
          image: docker.io/library/redis@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b
          imagePullPolicy: IfNotPresent
          name: mail-redis
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 2
            successThreshold: 1
            tcpSocket:
              port: 6379
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 300m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 10001
            runAsUser: 10001
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /data
              name: redis-runtime
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: webdock-mail
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: roan.dev/apps-only
          operator: Equal
          value: 'true'
        - effect: NoSchedule
          key: roan.dev/mail-only
          operator: Equal
          value: 'true'
      volumes:
        - name: redis-runtime
          emptyDir: {}
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
