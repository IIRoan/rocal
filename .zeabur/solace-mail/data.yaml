apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/part-of: solace
  name: mail-redis-sentinel-a
  namespace: solace-mail
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      instance: mail-redis-sentinel-a
  serviceName: mail-redis-sentinel-a
  template:
    metadata:
      labels:
        app: mail-redis-sentinel
        app.kubernetes.io/part-of: solace
        instance: mail-redis-sentinel-a
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - sh
            - -ec
            - |
              umask 077
              if [ ! -s /data/sentinel.conf ] || grep -Eq "^sentinel monitor solace [[:alpha:]]" /data/sentinel.conf; then
                  cat > /data/sentinel.conf.new <<EOF
              bind 0.0.0.0
              port 26379
              protected-mode yes
              dir /data
              requirepass "$SENTINEL_PASSWORD"
              sentinel announce-ip 10.43.11.29
              sentinel monitor solace 10.43.163.106 6379 2
              sentinel auth-pass solace "$REDIS_PASSWORD"
              sentinel sentinel-pass "$SENTINEL_PASSWORD"
              sentinel down-after-milliseconds solace 9000
              sentinel failover-timeout solace 30000
              sentinel parallel-syncs solace 1
              EOF
                  mv /data/sentinel.conf.new /data/sentinel.conf
              fi
              exec redis-sentinel /data/sentinel.conf
          env:
            - name: SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: SENTINEL_PASSWORD
                  name: mail-redis-sentinel-auth
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_PASSWORD
                  name: mail-object-auth
          image: docker.io/library/redis@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b
          imagePullPolicy: IfNotPresent
          name: sentinel
          ports:
            - containerPort: 26379
              name: sentinel
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$SENTINEL_PASSWORD" redis-cli --raw -p 26379 ping | grep -qx PONG
            failureThreshold: 3
            periodSeconds: 3
            successThreshold: 1
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 150m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /data
              name: state
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: webdock-mail
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: roan.dev/apps-only
          operator: Equal
          value: 'true'
        - effect: NoSchedule
          key: roan.dev/mail-only
          operator: Equal
          value: 'true'
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 32Mi
        storageClassName: local-path
        volumeMode: Filesystem
      status:
        phase: Pending
---
