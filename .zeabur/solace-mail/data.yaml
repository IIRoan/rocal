apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  labels:
    app.kubernetes.io/part-of: solace
  name: mail-database
  namespace: solace-mail
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - webdock-1
          weight: 60
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - webdock-1
                  - webdock-mail
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: roan.dev/apps-only
        operator: Equal
        value: 'true'
      - effect: NoSchedule
        key: roan.dev/mail-only
        operator: Equal
        value: 'true'
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      dataChecksums: true
      database: stalwart_v1
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: stalwart
      secret:
        name: mail-database-app
  enablePDB: true
  enableSuperuserAccess: false
  failoverDelay: 0
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:37fdeea29a4d3ed14570f719488ba55bd21e8975eaea864be5ce74d25a9a13de
  inheritedMetadata: {}
  instances: 2
  logLevel: info
  maxSyncReplicas: 0
  minSyncReplicas: 0
  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: false
  postgresGID: 26
  postgresUID: 26
  postgresql:
    parameters:
      archive_mode: 'on'
      archive_timeout: 5min
      dynamic_shared_memory_type: posix
