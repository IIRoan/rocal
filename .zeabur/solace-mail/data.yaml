apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mail-s3
  namespace: solace-mail
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mail-s3
  serviceName: mail-s3
  template:
    metadata:
      labels:
        app: mail-s3
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - webdock-mail
              weight: 60
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - webdock-mail
                      - webdock-1
      automountServiceAccountToken: false
      containers:
        - args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=127.0.0.1
            - -s3
            - -s3.ip.bind=0.0.0.0
            - -s3.port=8333
            - -s3.port.lance=0
            - -s3.config=/etc/s3/s3.json
            - -s3.autoCreateBucket=false
            - -master.volumeSizeLimitMB=128
            - -volume.max=24
          command:
            - /usr/bin/weed
          image: docker.io/chrislusf/seaweedfs@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
          imagePullPolicy: IfNotPresent
          name: seaweed
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - curl -fsS --max-time 2 http://127.0.0.1:9333/cluster/status | grep -Fq '"IsLeader":true' && curl -fsS --max-time
                  2 http://127.0.0.1:9333/dir/status | grep -Fq '"DataNodes":[{'
            failureThreshold: 3
            periodSeconds: 3
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 750m
              memory: 512Mi
            requests:
              cpu: 75m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsUser: 1000
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /etc/s3
              name: config
              readOnly: true
            - mountPath: /tmp
              name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: roan.dev/apps-only
          operator: Equal
          value: 'true'
        - effect: NoSchedule
          key: roan.dev/mail-only
          operator: Equal
          value: 'true'
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mail-objects
        - name: config
          secret:
            defaultMode: 420
            items:
              - key: s3.json
                path: s3.json
            secretName: mail-object-auth
        - name: tmp
          emptyDir: {}
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-objects
  namespace: solace-mail
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: solace-s3-encrypted
  volumeMode: Filesystem
---
apiVersion: v1
