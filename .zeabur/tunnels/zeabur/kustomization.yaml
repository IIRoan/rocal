apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik
namePrefix: zeabur-
resources:
  - ../base
  - ../base/network
  - origin-egress.yaml
generatorOptions:
  immutable: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: cloudflared-config
    files: [config.yaml]
