apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zeabur-roan-public
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: zeabur-roan-acme-account
    solvers:
      - selector:
          dnsNames: ['*.roan.dev', builds.roan.dev, demo.roan.dev, errors.roan.dev, objects.roan.dev, roan.dev, www.roan.dev]
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: zeabur-roan-acme-dns
              key: api-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solace-public-traefik
  namespace: builder-system
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    resourceNames: [builder-webhooks-public]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solace-public-traefik
  namespace: builder-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: solace-public-traefik
subjects:
  - kind: ServiceAccount
    name: solace-tunnel-ingress
    namespace: solace-mail
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: builder-webhooks-public-webdock
  namespace: builder-system
spec:
  dnsNames: [builds.roan.dev]
  issuerRef:
    kind: ClusterIssuer
    name: zeabur-roan-public
  secretName: builder-webhooks-public-webdock-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: builder-webhooks-public
  namespace: builder-system
  annotations:
    kubernetes.io/ingress.class: solace-public
    traefik.ingress.kubernetes.io/router.entrypoints: public,apps
spec:
  rules:
    - host: builds.roan.dev
      http:
        paths:
          - path: /hooks/
            pathType: Prefix
            backend:
              service:
                name: zeabur-builder-webhooks
                port:
                  name: http
  tls:
    - hosts: [builds.roan.dev]
      secretName: builder-webhooks-public-webdock-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: builder-webhooks-public-from-solace-public-traefik
  namespace: builder-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zeabur-builder
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: solace-mail
          podSelector:
            matchLabels:
              app.kubernetes.io/name: solace-public-ingress
      ports:
        - port: 8080
          protocol: TCP
---
