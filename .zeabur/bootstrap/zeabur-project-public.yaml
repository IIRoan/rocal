metadata:
  name: web-webdock
  namespace: demo
spec:
  dnsNames: [demo.roan.dev]
  issuerRef:
    kind: ClusterIssuer
    name: zeabur-roan-public
  secretName: web-webdock-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: demo
  annotations:
    kubernetes.io/ingress.class: solace-public
    traefik.ingress.kubernetes.io/router.entrypoints: public,apps
spec:
  rules:
    - host: demo.roan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
    - host: test2.roan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
  tls:
    - hosts: [demo.roan.dev]
      secretName: web-webdock-tls
    - hosts: [test2.roan.dev]
      secretName: web-tls
---
apiVersion: networking.k8s.io/v1
