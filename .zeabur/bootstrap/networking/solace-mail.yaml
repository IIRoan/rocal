apiVersion: v1
kind: Service
metadata:
  name: mail-live
  namespace: solace-mail
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: private-jmap
      port: 8081
      protocol: TCP
      targetPort: 8081
    - name: public-jmap
      port: 8082
      protocol: TCP
      targetPort: 8082
    - name: smtp
      port: 2525
      protocol: TCP
      targetPort: 22525
    - name: https
      port: 8443
      protocol: TCP
      targetPort: 18443
    - name: legacy-admin
      port: 18080
      protocol: TCP
      targetPort: 18080
  selector:
    app: stalwart-production
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mail-pg
  namespace: solace-mail
spec:
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: mail-database
    cnpg.io/instanceRole: primary
  type: ClusterIP
---
