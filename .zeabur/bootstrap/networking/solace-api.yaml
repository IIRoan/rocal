apiVersion: v1
kind: Service
metadata:
  name: app-postgres
  namespace: solace-api
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    app: app-postgres
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: app-postgres-standby
  namespace: solace-api
spec:
  clusterIP: None
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    app: app-postgres-standby
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-postgres-ingress
  namespace: solace-api
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: solace-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notifications
        - podSelector:
            matchLabels:
              app: app-postgres-standby
      ports:
        - port: 5432
          protocol: TCP
  podSelector:
    matchLabels:
      app: app-postgres
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-postgres-primary-egress
  namespace: solace-api
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
  podSelector:
    matchLabels:
      app: app-postgres
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-postgres-solace-project
  namespace: solace-api
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: solace-mail
          podSelector:
            matchLabels:
              app.kubernetes.io/name: solace-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: solace-mail
          podSelector:
            matchLabels:
              app.kubernetes.io/name: notifications
      ports:
        - port: 5432
          protocol: TCP
  podSelector:
    matchLabels:
      app: app-postgres
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-postgres-standby-egress
  namespace: solace-api
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: app-postgres
  podSelector:
    matchLabels:
      app: app-postgres-standby
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-postgres-standby-isolation
  namespace: solace-api
spec:
  podSelector:
    matchLabels:
      app: app-postgres-standby
  policyTypes:
    - Ingress
