apiVersion: v1
kind: Service
metadata:
  name: solace-frontend
  namespace: solace-mail
  labels:
    app.kubernetes.io/name: solace-frontend
    app.kubernetes.io/part-of: solace
spec:
  selector:
    app.kubernetes.io/name: solace-frontend
  trafficDistribution: PreferSameNode
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solace-frontend-peer
  namespace: solace-mail
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: solace-frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: solace-frontend
      ports:
        - {port: 3000, protocol: TCP}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: solace-frontend
      ports:
        - {port: 3000, protocol: TCP}
