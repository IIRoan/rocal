apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solace-jmap-endpoints
  namespace: solace-mail
rules:
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solace-jmap-endpoints
  namespace: solace-mail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: solace-jmap-endpoints
subjects:
- kind: ServiceAccount
  name: solace-jmap-endpoints
  namespace: solace-mail
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: solace-jmap-endpoints
  namespace: solace-mail
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solace-jmap-endpoints-api
  namespace: solace-mail
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.43.0.1/32
    - ipBlock:
        cidr: 192.168.2.106/32
  podSelector:
    matchLabels:
      app.kubernetes.io/name: solace-jmap-failover
  policyTypes:
  - Egress
