apiVersion: v1
kind: Service
metadata:
  name: solace-tunnel-gateway
  namespace: solace-mail
spec:
  selector:
    app.kubernetes.io/name: solace-public-ingress
  trafficDistribution: PreferSameNode
  ports:
    - name: https
      port: 9444
      targetPort: tunnel-https
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solace-tunnel-gateway
  namespace: solace-mail
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: solace-public-ingress
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - {port: 9444, protocol: TCP}
