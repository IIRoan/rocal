apiVersion: v1
kind: Namespace
metadata:
  annotations:
    zeabur.com/description: "Production across both Webdock VPSs\nHTTPS \u2192 Traefik on both Webdock VPSs \u2192\
      \ Solace API and Stalwart\nSMTP \u2192 Webdock MX gateways \u2192 Stalwart\nSolace API and notifications \u2192 Stalwart\
      \ and application PostgreSQL\nStalwart \u2192 mail PostgreSQL, Redis and SeaweedFS\nMail PostgreSQL has a synchronous standby.\nApplication PostgreSQL uses one instance.\
      \ Redis has a replica. SeaweedFS has one writer on replicated storage."
    zeabur.com/display-name: Solace
  labels:
    pod-security.kubernetes.io/enforce: restricted
    zeabur.com/project: 'true'
  name: solace-mail
spec:
  finalizers:
    - kubernetes
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    zeabur.com/description: Production Solace API running on the Webdock VPS with the most available CPU and disk.
    zeabur.com/display-name: Solace API
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  name: solace-api
spec:
  finalizers:
    - kubernetes
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: solace-app-pg-encrypted
allowVolumeExpansion: true
parameters:
  csi.storage.k8s.io/node-expand-secret-name: app-pg-crypto
  csi.storage.k8s.io/node-expand-secret-namespace: solace-api
  csi.storage.k8s.io/node-publish-secret-name: app-pg-crypto
  csi.storage.k8s.io/node-publish-secret-namespace: solace-api
  csi.storage.k8s.io/node-stage-secret-name: app-pg-crypto
  csi.storage.k8s.io/node-stage-secret-namespace: solace-api
  dataEngine: v1
  dataLocality: strict-local
  encrypted: 'true'
  fsType: ext4
  numberOfReplicas: '1'
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: solace-pg-encrypted
allowVolumeExpansion: true
parameters:
  csi.storage.k8s.io/node-expand-secret-name: mail-pg-crypto
  csi.storage.k8s.io/node-expand-secret-namespace: solace-mail
  csi.storage.k8s.io/node-publish-secret-name: mail-pg-crypto
  csi.storage.k8s.io/node-publish-secret-namespace: solace-mail
  csi.storage.k8s.io/node-stage-secret-name: mail-pg-crypto
  csi.storage.k8s.io/node-stage-secret-namespace: solace-mail
  dataEngine: v1
  dataLocality: strict-local
  encrypted: 'true'
  fsType: ext4
  numberOfReplicas: '1'
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: solace-s3-encrypted
allowVolumeExpansion: true
parameters:
  csi.storage.k8s.io/node-expand-secret-name: mail-s3-crypto
  csi.storage.k8s.io/node-expand-secret-namespace: solace-mail
  csi.storage.k8s.io/node-publish-secret-name: mail-s3-crypto
  csi.storage.k8s.io/node-publish-secret-namespace: solace-mail
  csi.storage.k8s.io/node-stage-secret-name: mail-s3-crypto
  csi.storage.k8s.io/node-stage-secret-namespace: solace-mail
  dataEngine: v1
  dataLocality: best-effort
  encrypted: 'true'
  fsType: ext4
  numberOfReplicas: '2'
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
