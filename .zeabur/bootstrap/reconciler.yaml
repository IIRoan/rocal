apiVersion: v1
kind: ServiceAccount
metadata:
  name: solace-reconciler
  namespace: solace-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solace-controller-impersonation
  namespace: solace-gitops
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [solace-reconciler]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solace-controller-impersonation
  namespace: solace-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: solace-controller-impersonation
subjects:
  - kind: ServiceAccount
    name: kustomize-controller
    namespace: solace-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: solace-project-resources
rules:
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solace-project-resources
  namespace: solace-mail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: solace-project-resources
subjects:
  - kind: ServiceAccount
    name: solace-reconciler
    namespace: solace-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solace-project-resources
  namespace: solace-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: solace-project-resources
subjects:
  - kind: ServiceAccount
    name: solace-reconciler
    namespace: solace-gitops
