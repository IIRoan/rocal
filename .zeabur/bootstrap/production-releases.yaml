apiVersion: v1
kind: ConfigMap
metadata:
  name: solace-release-requests
  namespace: solace-gitops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: solace-release-images
  namespace: solace-gitops
  labels:
    reconcile.fluxcd.io/watch: Enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: solace-release-controller
  namespace: solace-mail
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: solace-release-requests
  namespace: solace-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solace-release-controller
  namespace: solace-mail
rules:
  - apiGroups: [builder.zeabur.com]
    resources: [builds]
    resourceNames: [api, notifications, stalwart]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [solace-api, notifications, stalwart-a, stalwart-b]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solace-release-controller
  namespace: solace-gitops
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [solace-release-requests]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [solace-release-images]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solace-release-controller
  namespace: solace-mail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: solace-release-controller
subjects:
  - kind: ServiceAccount
    name: solace-release-controller
    namespace: solace-mail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solace-release-controller
  namespace: solace-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: solace-release-controller
subjects:
  - kind: ServiceAccount
    name: solace-release-controller
    namespace: solace-mail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solace-release-requests
  namespace: solace-gitops
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [solace-release-requests]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solace-release-requests
  namespace: solace-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: solace-release-requests
subjects:
  - kind: ServiceAccount
    name: solace-release-requests
    namespace: solace-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solace-release-requests-impersonation
  namespace: solace-gitops
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [solace-release-requests]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solace-release-requests-impersonation
  namespace: solace-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: solace-release-requests-impersonation
subjects:
  - kind: ServiceAccount
    name: kustomize-controller
    namespace: solace-gitops
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: solace-release-requests
  namespace: solace-gitops
spec:
  interval: 1m
  url: https://github.com/IIRoan/rocal.git
  ref:
    branch: solace-release-requests
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: solace-release-requests
  namespace: solace-gitops
spec:
  interval: 1m
  timeout: 1m
  path: ./
  prune: false
  deletionPolicy: Orphan
  serviceAccountName: solace-release-requests
  sourceRef:
    kind: GitRepository
    name: solace-release-requests
---
apiVersion: builder.zeabur.com/v1alpha1
kind: Build
metadata:
  name: api
  namespace: solace-mail
spec:
  builderRef: dockerfile
  concurrency: Replace
  suspend: true
  source:
    git:
      url: https://github.com/IIRoan/rocal.git
      ref: master
      dockerfile: apps/backend/Dockerfile
  output:
    image: zot.zot.svc:5000/solace-mail/api
---
apiVersion: builder.zeabur.com/v1alpha1
kind: Build
metadata:
  name: notifications
  namespace: solace-mail
spec:
  builderRef: dockerfile
  concurrency: Replace
  suspend: true
  source:
    git:
      url: https://github.com/IIRoan/rocal.git
      ref: master
      dockerfile: apps/notifications/Dockerfile
  output:
    image: zot.zot.svc:5000/solace-mail/notifications
---
apiVersion: builder.zeabur.com/v1alpha1
kind: Build
metadata:
  name: stalwart
  namespace: solace-mail
spec:
  builderRef: dockerfile
  concurrency: Replace
  suspend: true
  source:
    git:
      url: https://github.com/IIRoan/rocal.git
      ref: master
      contextDir: apps/stalwart
  output:
    image: zot.zot.svc:5000/solace-mail/stalwart
