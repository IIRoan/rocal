apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    image:
      tag: v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
        ingressEndpoint:
          hostname: ingress.roan.dev
      kubernetesGateway:
        statusAddress:
          hostname: ingress.roan.dev
          service:
            enabled: false
    ports:
      web:
        asDefault: true
      websecure:
        asDefault: true
      appsecure:
        port: 8444
        expose:
          default: false
        exposedPort: 8444
        protocol: TCP
        proxyProtocol:
          trustedIPs: [10.42.0.0/16]
