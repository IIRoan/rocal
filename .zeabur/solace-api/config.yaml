apiVersion: v1
kind: ConfigMap
metadata:
  name: app-pg-init
  namespace: solace-api
data:
  00-replication.sh: |
    #!/bin/sh
    set -eu
    case "$REPLICATION_PASSWORD" in solace-prod-*) ;; *) exit 1 ;; esac
    printf "CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '%s';
    " "$REPLICATION_PASSWORD" |
        psql -v ON_ERROR_STOP=1 -U dbadmin -d postgres >/dev/null
    printf '%s
    ' 'hostssl replication replicator 10.42.162.192/26 scram-sha-256' >> "$PGDATA/pg_hba.conf"

    case "$APP_PASSWORD" in solace-prod-*) ;; *) exit 1 ;; esac
    printf "CREATE ROLE solace_app WITH LOGIN PASSWORD '%s';\n" "$APP_PASSWORD" |
        psql -v ON_ERROR_STOP=1 -U dbadmin -d postgres >/dev/null
    createdb -U dbadmin -O solace_app solace
    createdb -U dbadmin -O solace_app app_baseline
    sed -i '/^host[[:space:]]*all[[:space:]]*all[[:space:]]*all[[:space:]]/s/^host[[:space:]]/hostssl /' "$PGDATA/pg_hba.conf"
